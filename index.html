<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네이버 플레이스 순위 조회</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f5;
    color: #333;
}

.header {
    background: #1a1a2e;
    color: #fff;
    padding: 20px 0;
}

.header-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px;
}

.header h1 {
    font-size: 22px;
    font-weight: 700;
}

.header p {
    font-size: 13px;
    color: #aaa;
    margin-top: 4px;
}

/* === 햄버거 메뉴 === */
.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.menu-btn {
    width: 38px;
    height: 38px;
    border: 1px solid rgba(255,255,255,0.25);
    background: transparent;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}
.menu-btn span {
    display: block;
    width: 18px;
    height: 2px;
    background: #fff;
    position: relative;
}
.menu-btn span:before,
.menu-btn span:after {
    content: "";
    position: absolute;
    left: 0;
    width: 18px;
    height: 2px;
    background: #fff;
}
.menu-btn span:before { top: -6px; }
.menu-btn span:after { top: 6px; }

.drawer-overlay{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    z-index: 9999;
}
.drawer-overlay.show{ display:block; }
.drawer{
    position: absolute;
    top: 0;
    right: 0;
    width: 280px;
    height: 100%;
    background: #fff;
    box-shadow: -10px 0 30px rgba(0,0,0,0.18);
    padding: 16px;
}
.drawer-head{
    display:flex;
    justify-content: space-between;
    align-items:center;
    padding-bottom:10px;
    border-bottom:1px solid #eee;
    margin-bottom:10px;
}
.drawer-title{ font-weight:800; color:#1a1a2e; }
.drawer-close{
    border:none;
    background:none;
    font-size:22px;
    cursor:pointer;
    color:#666;
}
.drawer a{
    display:block;
    padding:12px 10px;
    border-radius:10px;
    color:#333;
    text-decoration:none;
    font-weight:700;
}
.drawer a:hover{ background:#f5f5f5; }
.drawer .mutedlink{
    font-size:12px;
    color:#888;
    font-weight:600;
    padding:0 10px 8px;
}

/* === layout === */
.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
}

.card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 20px;
}

.card h2 {
    font-size: 16px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #eee;
}

.form-row {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
}

.form-group {
    flex: 1;
    min-width: 180px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #555;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
}

.form-group input:focus {
    border-color: #1a1a2e;
}

.btn {
    padding: 10px 28px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}

.btn-primary {
    background: #1a1a2e;
    color: #fff;
}

.btn-primary:hover {
    background: #16213e;
}

.btn-primary:disabled {
    background: #999;
    cursor: not-allowed;
}

.result-box {
    display: none;
    margin-top: 20px;
    padding: 24px;
    border-radius: 8px;
    text-align: center;
}

.result-found {
    background: #eafaf1;
    border: 2px solid #2ecc71;
}

.result-notfound {
    background: #fdedec;
    border: 2px solid #e74c3c;
}

.result-error {
    background: #fef9e7;
    border: 2px solid #f39c12;
}

.result-rank {
    font-size: 52px;
    font-weight: 800;
    color: #1a1a2e;
    margin: 8px 0;
}

.result-rank-sub {
    font-size: 14px;
    color: #888;
}

.result-name {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
}

.result-detail {
    font-size: 13px;
    color: #666;
    margin-top: 6px;
}

.result-stats {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 14px;
}

.result-stat {
    text-align: center;
}

.result-stat-value {
    font-size: 18px;
    font-weight: 700;
    color: #1a1a2e;
}

.result-stat-label {
    font-size: 11px;
    color: #999;
}

.result-tags {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
}

.tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
}

.tag-blue {
    background: #ebf5fb;
    color: #2980b9;
}

.tag-green {
    background: #eafaf1;
    color: #27ae60;
}

.tag-orange {
    background: #fef9e7;
    color: #e67e22;
}

.tag-gray {
    background: #f0f0f0;
    color: #666;
}

.tag-red {
    background: #fdedec;
    color: #c0392b;
}

.loading {
    display: none;
    text-align: center;
    padding: 30px;
}

.spinner {
    display: inline-block;
    width: 32px;
    height: 32px;
    border: 3px solid #ddd;
    border-top-color: #1a1a2e;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loading-text {
    margin-top: 10px;
    font-size: 13px;
    color: #888;
}

/* 테이블 */
.rank-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-top: 16px;
}

.rank-table th {
    background: #f8f8f8;
    padding: 8px 6px;
    text-align: left;
    font-weight: 600;
    border-bottom: 2px solid #ddd;
    white-space: nowrap;
    position: sticky;
    top: 0;
}

.rank-table td {
    padding: 8px 6px;
    border-bottom: 1px solid #eee;
    vertical-align: middle;
}

.rank-table tbody tr:hover {
    background: #f5f5f5;
}

.rank-table .highlight {
    background: #fff9c4;
}

.badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 11px;
    color: #fff;
}

.badge-1 { background: #e74c3c; }
.badge-3 { background: #2ecc71; }
.badge-5 { background: #3498db; }
.badge-10 { background: #f39c12; }
.badge-20 { background: #e67e22; }
.badge-other { background: #95a5a6; }

.table-name {
    font-weight: 600;
    color: #1a1a2e;
    cursor: pointer;
}

.table-name:hover {
    text-decoration: underline;
    color: #3498db;
}

.table-micro {
    font-size: 10px;
    color: #999;
    font-style: italic;
    display: block;
    margin-top: 2px;
}

.table-icons {
    display: flex;
    gap: 3px;
    flex-wrap: wrap;
}

.table-icon {
    display: inline-block;
    padding: 1px 5px;
    border-radius: 6px;
    font-size: 9px;
    font-weight: 600;
    white-space: nowrap;
}

.icon-yes {
    background: #eafaf1;
    color: #27ae60;
}

.page-info {
    text-align: center;
    font-size: 12px;
    color: #aaa;
    margin-top: 8px;
}

.max-select {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
}

.max-select label {
    font-size: 13px;
    font-weight: 600;
    color: #555;
}

.max-select select {
    padding: 6px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 13px;
}

/* 상세 모달 */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    background: #fff;
    border-radius: 10px;
    width: 90%;
    max-width: 520px;
    max-height: 80vh;
    overflow-y: auto;
}

.modal-header {
    position: sticky;
    top: 0;
    background: #1a1a2e;
    color: #fff;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 10px 10px 0 0;
    z-index: 1;
}

.modal-header h3 {
    font-size: 15px;
    font-weight: 600;
}

.modal-close {
    background: none;
    border: none;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
}

.modal-body {
    padding: 20px;
}

.detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
}

.detail-item {
    padding: 10px;
    background: #f8f8f8;
    border-radius: 6px;
}

.detail-label {
    font-size: 11px;
    color: #999;
    margin-bottom: 2px;
}

.detail-value {
    font-size: 14px;
    font-weight: 600;
    color: #333;
}

.detail-full {
    grid-column: 1 / -1;
}

.detail-section-title {
    font-size: 13px;
    font-weight: 600;
    color: #1a1a2e;
    margin: 16px 0 8px 0;
    padding-bottom: 6px;
    border-bottom: 1px solid #eee;
}

.detail-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 12px;
}

.detail-tag {
    display: inline-block;
    padding: 3px 10px;
    background: #f0f0f0;
    border-radius: 12px;
    font-size: 11px;
    color: #555;
}

/* 히스토리 */
.history-list {
    margin-top: 16px;
}

.history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 13px;
}

.history-item:hover {
    background: #fafafa;
}

.history-keyword {
    font-weight: 600;
}

.btn-tiny {
    padding: 4px 10px;
    font-size: 11px;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 4px;
    cursor: pointer;
}

.btn-tiny:hover {
    background: #f0f0f0;
}

.btn-tiny-del {
    color: #e74c3c;
    border-color: #e74c3c;
}

@media (max-width: 600px) {
    .form-row {
        flex-direction: column;
    }
    .form-group {
        min-width: 100%;
    }
    .result-rank {
        font-size: 40px;
    }
    .detail-grid {
        grid-template-columns: 1fr;
    }
    .rank-table {
        font-size: 11px;
    }
    .rank-table th,
    .rank-table td {
        padding: 6px 4px;
    }
    .result-stats {
        gap: 10px;
    }
}
</style>
</head>
<body>

<div class="header">
    <div class="header-inner">
        <div class="header-top">
            <h1>네이버 플레이스 순위 조회</h1>
            <button class="menu-btn" id="btnMenu" aria-label="메뉴"><span></span></button>
        </div>
        <p>키워드와 플레이스 ID를 입력하면 실시간으로 순위를 확인합니다</p>
    </div>
</div>

<div class="container">

    <div class="card">
        <h2>순위 조회</h2>
        <div class="form-row">
            <div class="form-group">
                <label>검색 키워드</label>
                <input type="text" id="inputKeyword" placeholder="예: 남영역맛집">
            </div>
            <div class="form-group">
                <label>플레이스 ID</label>
                <input type="text" id="inputPlaceId" placeholder="예: 1951454277">
            </div>
        </div>
        <div class="max-select">
            <label>검색 범위</label>
            <select id="selectMaxRank">
                <option value="100">100위까지</option>
                <option value="200">200위까지</option>
                <option value="300" selected>300위까지</option>
            </select>
        </div>
        <button class="btn btn-primary" id="btnSearch">순위 조회</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">검색 중...</div>
        </div>

        <div class="result-box" id="resultBox"></div>
    </div>

    <div class="card" id="tableCard" style="display:none;">
        <h2>검색 결과 (<span id="tableKeyword"></span>)</h2>
        <div style="overflow-x:auto;max-height:600px;overflow-y:auto;">
            <table class="rank-table" id="rankTable">
                <thead>
                    <tr>
                        <th>순위</th>
                        <th>업체명</th>
                        <th>카테고리</th>
                        <th>블로그</th>
                        <th>방문자</th>
                        <th>별점</th>
                        <th>저장</th>
                        <th>이미지</th>
                        <th>서비스</th>
                    </tr>
                </thead>
                <tbody id="rankTableBody"></tbody>
            </table>
        </div>
        <div class="page-info" id="pageInfo"></div>
    </div>

    <div class="card">
        <h2>최근 조회 기록</h2>
        <div class="history-list" id="historyList"></div>
        <div id="historyEmpty" style="text-align:center;padding:20px;color:#aaa;font-size:13px;">
            조회 기록이 없습니다
        </div>
    </div>

</div>

<!-- Drawer Menu -->
<div class="drawer-overlay" id="drawer">
    <div class="drawer" role="dialog" aria-modal="true">
        <div class="drawer-head">
            <div class="drawer-title">메뉴</div>
            <button class="drawer-close" id="btnDrawerClose" aria-label="닫기">×</button>
        </div>
        <div class="mutedlink">페이지 이동</div>
        <a href="./index.html">실시간 조회</a>
        <a href="#" id="linkTracker">플레이스 추적</a>
    </div>
</div>

<!-- 상세 모달 -->
<div class="modal-overlay" id="detailModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">상세정보</h3>
            <button class="modal-close" id="modalClose">x</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script>
(function() {
    "use strict";

    // 실시간용 프록시 Worker
    var PROXY = "https://naverrank.dampd21.workers.dev/";

    // tracker 페이지 파일명(같은 폴더에 tracker.html 있어야 함)
    var TRACKER_PAGE = "tracker.html";

    var HKEY = "npt_rank_history";
    var allItems = [];

    /* ---- 유틸 ---- */
    function esc(s) { return s ? String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ""; }
    function val(v, d) { return (v !== null && v !== undefined && v !== "") ? v : (d !== undefined ? d : "-"); }

    /* ---- 히스토리 ---- */
    function loadH() { try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch(e) { return []; } }
    function saveH(l) { localStorage.setItem(HKEY, JSON.stringify(l)); }

    function addH(kw, pid, rank, name) {
        var l = loadH();
        l.unshift({ keyword:kw, placeId:pid, rank:rank, name:name||"", time:new Date().toLocaleString("ko-KR") });
        if (l.length > 50) l = l.slice(0,50);
        saveH(l);
        renderH();
    }

    function renderH() {
        var l = loadH();
        var c = document.getElementById("historyList");
        var e = document.getElementById("historyEmpty");
        c.innerHTML = "";
        if (l.length === 0) { e.style.display = "block"; return; }
        e.style.display = "none";

        for (var i = 0; i < l.length; i++) {
            (function(idx) {
                var it = l[idx];
                var d = document.createElement("div");
                d.className = "history-item";
                var rt = it.rank ? it.rank + "위" : "순위밖";
                var nt = it.name ? " - " + it.name : "";
                d.innerHTML =
                    '<div><span class="history-keyword">' + esc(it.keyword) + '</span>' +
                    '<span style="color:#888;font-size:12px;"> (ID: ' + esc(it.placeId) + ')</span>' +
                    '<br><span style="font-size:11px;color:#aaa;">' + it.time + ' / ' + rt + nt + '</span></div>' +
                    '<div style="display:flex;gap:6px;">' +
                    '<button class="btn-tiny re">재조회</button>' +
                    '<button class="btn-tiny btn-tiny-del del">삭제</button></div>';
                d.querySelector(".re").onclick = function(ev) {
                    ev.stopPropagation();
                    document.getElementById("inputKeyword").value = it.keyword;
                    document.getElementById("inputPlaceId").value = it.placeId;
                    doSearch();
                };
                d.querySelector(".del").onclick = function(ev) {
                    ev.stopPropagation();
                    var ll = loadH(); ll.splice(idx,1); saveH(ll); renderH();
                };
                c.appendChild(d);
            })(i);
        }
    }

    /* ---- 배지 ---- */
    function bc(r) {
        if (r===1) return "badge-1";
        if (r<=3) return "badge-3";
        if (r<=5) return "badge-5";
        if (r<=10) return "badge-10";
        if (r<=20) return "badge-20";
        return "badge-other";
    }

    /* ---- 로딩/결과 ---- */
    function showLoad(m) {
        document.getElementById("loading").style.display = "block";
        document.getElementById("loadingText").textContent = m || "검색 중...";
        document.getElementById("resultBox").style.display = "none";
        document.getElementById("tableCard").style.display = "none";
    }
    function hideLoad() { document.getElementById("loading").style.display = "none"; }
    function showRes(h, c) {
        var b = document.getElementById("resultBox");
        b.className = "result-box " + c;
        b.innerHTML = h;
        b.style.display = "block";
    }

    /* ---- 서비스 태그 생성 ---- */
    function svcTags(it) {
        var tags = [];
        if (it.hasBooking) tags.push('<span class="table-icon icon-yes">예약</span>');
        if (it.hasNPay) tags.push('<span class="table-icon icon-yes">N페이</span>');
        var no = it.naverOrder || {};
        if (no.isDelivery) tags.push('<span class="table-icon icon-yes">배달</span>');
        if (no.isTableOrder) tags.push('<span class="table-icon icon-yes">테이블주문</span>');
        var pi = it.posInfo || {};
        if (pi.isPOS) tags.push('<span class="table-icon icon-yes">POS</span>');
        if (it.coupon) tags.push('<span class="table-icon icon-yes">쿠폰</span>');
        if (it.newOpening) tags.push('<span class="table-icon icon-yes">신규오픈</span>');
        if (it.hasWheelchairEntrance) tags.push('<span class="table-icon icon-yes">휠체어</span>');
        var bi = it.broadcastInfo || {};
        if (bi.program) tags.push('<span class="table-icon icon-yes">' + esc(bi.program) + '</span>');
        return tags.join("");
    }

    /* ---- 결과 태그 (상단 요약) ---- */
    function resTags(it) {
        var t = [];
        if (it.hasBooking) t.push('<span class="tag tag-green">예약가능</span>');
        if (it.hasNPay) t.push('<span class="tag tag-green">N페이</span>');
        var no = it.naverOrder || {};
        if (no.isDelivery) t.push('<span class="tag tag-blue">배달</span>');
        if (no.isTableOrder) t.push('<span class="tag tag-blue">테이블주문</span>');
        if (it.coupon) t.push('<span class="tag tag-orange">쿠폰</span>');
        if (it.newOpening) t.push('<span class="tag tag-red">신규오픈</span>');
        var bi = it.broadcastInfo || {};
        if (bi.program) t.push('<span class="tag tag-orange">' + esc(bi.program) + '</span>');
        var pi = it.posInfo || {};
        if (pi.isPOS) t.push('<span class="tag tag-gray">POS</span>');
        if (it.hasWheelchairEntrance) t.push('<span class="tag tag-gray">휠체어</span>');
        return t.join("");
    }

    /* ---- API 호출 ---- */
    function fetchPage(kw, start, display) {
        return new Promise(function(resolve, reject) {
            var url = PROXY + "?keyword=" + encodeURIComponent(kw) + "&start=" + start + "&display=" + display;
            var x = new XMLHttpRequest();
            x.open("POST", url, true);
            x.setRequestHeader("Content-Type", "application/json");
            x.timeout = 20000;
            x.onload = function() {
                if (x.status === 200) {
                    try { resolve(JSON.parse(x.responseText)); }
                    catch(e) { reject("응답 파싱 실패"); }
                } else { reject("HTTP " + x.status); }
            };
            x.onerror = function() { reject("네트워크 오류"); };
            x.ontimeout = function() { reject("시간 초과"); };
            x.send("{}");
        });
    }

    /* ---- 검색 실행 ---- */
    function doSearch() {
        var kw = document.getElementById("inputKeyword").value.trim();
        var pid = document.getElementById("inputPlaceId").value.trim();
        var maxR = parseInt(document.getElementById("selectMaxRank").value) || 300;
        if (!kw) { alert("키워드를 입력하세요."); return; }
        if (!pid) { alert("플레이스 ID를 입력하세요."); return; }

        document.getElementById("btnSearch").disabled = true;
        showLoad("'" + kw + "' 검색 중... (1~100위)");
        allItems = [];
        var total = 0, page = 0, ps = 100, mp = Math.ceil(maxR / ps);

        function next() {
            page++;
            var s = (page-1)*ps+1, d = Math.min(ps, maxR-s+1);
            if (page > 1) document.getElementById("loadingText").textContent = "'" + kw + "' 검색 중... (" + s + "~" + (s+d-1) + "위)";

            fetchPage(kw, s, d).then(function(data) {
                var items = [], t = 0;
                if (Array.isArray(data) && data.length > 0) {
                    var r = data[0].data && data[0].data.restaurants;
                    if (r) { items = r.items || []; t = r.total || 0; }
                }
                total = t;
                allItems = allItems.concat(items);

                var fi = -1;
                for (var i = 0; i < allItems.length; i++) {
                    if (String(allItems[i].id) === String(pid)) { fi = i; break; }
                }

                if (fi >= 0 || items.length < d || page >= mp) {
                    hideLoad();
                    document.getElementById("btnSearch").disabled = false;
                    render(kw, pid, total, maxR);
                } else {
                    setTimeout(next, 300);
                }
            }).catch(function(err) {
                hideLoad();
                document.getElementById("btnSearch").disabled = false;
                showRes('<div style="font-size:15px;font-weight:600;color:#e67e22;">조회 실패</div><div class="result-detail">' + esc(err) + '</div>', "result-error");
            });
        }
        next();
    }
    window.doSearch = doSearch;

    /* ---- 결과 렌더링 ---- */
    function render(kw, pid, total, maxR) {
        var fi = -1, found = null;
        for (var i = 0; i < allItems.length; i++) {
            if (String(allItems[i].id) === String(pid)) { fi = i; found = allItems[i]; break; }
        }

        if (fi >= 0) {
            var rank = fi + 1;
            var tags = resTags(found);
            showRes(
                '<div class="result-name">' + esc(found.name) + '</div>' +
                '<div class="result-detail">' + esc(found.category) + ' / ' + esc(found.businessCategory) + '</div>' +
                '<div class="result-rank">' + rank + '<span style="font-size:20px;">위</span></div>' +
                '<div class="result-rank-sub">전체 ' + total + '개 중</div>' +
                '<div class="result-stats">' +
                    '<div class="result-stat"><div class="result-stat-value">' + val(found.blogCafeReviewCount, 0) + '</div><div class="result-stat-label">블로그리뷰</div></div>' +
                    '<div class="result-stat"><div class="result-stat-value">' + val(found.visitorReviewCount, 0) + '</div><div class="result-stat-label">방문자리뷰</div></div>' +
                    '<div class="result-stat"><div class="result-stat-value">' + val(found.visitorReviewScore, "-") + '</div><div class="result-stat-label">별점</div></div>' +
                    '<div class="result-stat"><div class="result-stat-value">' + val(found.saveCount, 0) + '</div><div class="result-stat-label">저장</div></div>' +
                    '<div class="result-stat"><div class="result-stat-value">' + val(found.imageCount, 0) + '</div><div class="result-stat-label">이미지</div></div>' +
                '</div>' +
                (found.microReview ? '<div class="result-detail" style="font-style:italic;color:#888;margin-top:10px;">"' + esc(found.microReview) + '"</div>' : '') +
                (tags ? '<div class="result-tags">' + tags + '</div>' : '') +
                '<div style="margin-top:14px;"><a href="https://m.place.naver.com/restaurant/' + found.id + '/home" target="_blank" style="font-size:12px;color:#3498db;">네이버 플레이스에서 보기</a></div>',
                "result-found"
            );
            addH(kw, pid, rank, found.name);
        } else {
            showRes(
                '<div style="font-size:16px;font-weight:600;color:#e74c3c;">' + maxR + '위 안에 없습니다</div>' +
                '<div class="result-detail">플레이스 ID: ' + esc(pid) + '</div>' +
                '<div class="result-detail">전체 검색 결과: ' + total + '개</div>',
                "result-notfound"
            );
            addH(kw, pid, null, "");
        }

        /* 테이블 */
        if (allItems.length > 0) {
            document.getElementById("tableCard").style.display = "block";
            document.getElementById("tableKeyword").textContent = kw;
            var tb = document.getElementById("rankTableBody");
            tb.innerHTML = "";

            for (var j = 0; j < allItems.length; j++) {
                var it = allItems[j];
                var isT = String(it.id) === String(pid);
                var tr = document.createElement("tr");
                if (isT) tr.className = "highlight";
                var rn = j + 1;

                tr.innerHTML =
                    '<td><span class="badge ' + bc(rn) + '">' + rn + '</span></td>' +
                    '<td><span class="table-name" data-idx="' + j + '">' + esc(it.name) + '</span>' +
                        (isT ? ' <span style="color:#e74c3c;font-size:10px;font-weight:700;">[대상]</span>' : '') +
                        (it.microReview ? '<span class="table-micro">' + esc(it.microReview) + '</span>' : '') +
                    '</td>' +
                    '<td>' + esc(it.category) + '</td>' +
                    '<td>' + val(it.blogCafeReviewCount, 0) + '</td>' +
                    '<td>' + val(it.visitorReviewCount, 0) + '</td>' +
                    '<td>' + val(it.visitorReviewScore, "-") + '</td>' +
                    '<td>' + val(it.saveCount, 0) + '</td>' +
                    '<td>' + val(it.imageCount, 0) + '</td>' +
                    '<td><div class="table-icons">' + svcTags(it) + '</div></td>';
                tb.appendChild(tr);
            }

            document.getElementById("pageInfo").textContent = allItems.length + "개 표시 / 전체 " + total + "개";

            var links = tb.querySelectorAll(".table-name");
            for (var n = 0; n < links.length; n++) {
                links[n].addEventListener("click", function() {
                    openDetail(parseInt(this.getAttribute("data-idx")));
                });
            }
        }
    }

    /* ---- 상세 모달 ---- */
    function openDetail(idx) {
        if (idx < 0 || idx >= allItems.length) return;
        var it = allItems[idx];
        var rn = idx + 1;

        document.getElementById("modalTitle").textContent = esc(it.name) + " (#" + rn + "위)";

        var h = '';

        /* 기본 */
        h += '<div class="detail-grid">';
        h += '<div class="detail-item"><div class="detail-label">업체명</div><div class="detail-value">' + esc(it.name) + '</div></div>';
        h += '<div class="detail-item"><div class="detail-label">카테고리</div><div class="detail-value">' + esc(it.category) + '</div></div>';
        h += '<div class="detail-item"><div class="detail-label">플레이스 ID</div><div class="detail-value">' + esc(it.id) + '</div></div>';
        h += '<div class="detail-item"><div class="detail-label">DB 타입</div><div class="detail-value">' + esc(it.dbType) + '</div></div>';
        h += '<div class="detail-item"><div class="detail-label">대분류</div><div class="detail-value">' + esc(it.businessCategory) + '</div></div>';
        h += '<div class="detail-item"><div class="detail-label">이미지 수</div><div class="detail-value">' + val(it.imageCount, 0) + '</div></div>';
        h += '</div>';

        if (it.microReview) {
            h += '<div class="detail-item detail-full" style="margin-bottom:12px;"><div class="detail-label">한줄 요약</div><div class="detail-value" style="font-style:italic;">"' + esc(it.microReview) + '"</div></div>';
        }

        /* 리뷰/저장 */
        h += '<div class="detail-section-title">리뷰 / 저장 통계</div>';
        h += '<div class="detail-grid">';
        h += '<div class="detail-item"><div class="detail-label">블로그 리뷰</div><div class="detail-value">' + val(it.blogCafeReviewCount, 0) + '</div></div>';
        h += '<div class="detail-item"><div class="detail-label">방문자 리뷰</div><div class="detail-value">' + val(it.visitorReviewCount, 0) + '</div></div>';
        h += '<div class="detail-item"><div class="detail-label">별점</div><div class="detail-value">' + val(it.visitorReviewScore, "-") + '</div></div>';
        h += '<div class="detail-item"><div class="detail-label">저장수</div><div class="detail-value">' + val(it.saveCount, 0) + '</div></div>';
        h += '</div>';

        /* 서비스 */
        h += '<div class="detail-section-title">서비스 / 기능</div>';
        h += '<div class="detail-grid">';
        h += '<div class="detail-item"><div class="detail-label">예약</div><div class="detail-value">' + (it.hasBooking ? "가능" : "불가") + '</div></div>';
        h += '<div class="detail-item"><div class="detail-label">네이버페이</div><div class="detail-value">' + (it.hasNPay ? "가능" : "불가") + '</div></div>';
        var no = it.naverOrder || {};
        h += '<div class="detail-item"><div class="detail-label">배달</div><div class="detail-value">' + (no.isDelivery ? "가능" : "불가") + '</div></div>';
        h += '<div class="detail-item"><div class="detail-label">테이블주문</div><div class="detail-value">' + (no.isTableOrder ? "가능" : "불가") + '</div></div>';
        var pi = it.posInfo || {};
        h += '<div class="detail-item"><div class="detail-label">POS 연동</div><div class="detail-value">' + (pi.isPOS ? "연동" : "미연동") + '</div></div>';
        h += '<div class="detail-item"><div class="detail-label">휠체어</div><div class="detail-value">' + (it.hasWheelchairEntrance ? "가능" : "-") + '</div></div>';
        h += '<div class="detail-item"><div class="detail-label">쿠폰</div><div class="detail-value">' + (it.coupon ? "있음" : "없음") + '</div></div>';
        h += '<div class="detail-item"><div class="detail-label">신규오픈</div><div class="detail-value">' + (it.newOpening ? "신규" : "-") + '</div></div>';
        h += '</div>';

        /* 방송 */
        var bi = it.broadcastInfo || {};
        if (bi.program) {
            h += '<div class="detail-section-title">방송 출연</div>';
            h += '<div class="detail-item detail-full" style="margin-bottom:12px;"><div class="detail-label">프로그램</div><div class="detail-value">' + esc(bi.program) + '</div></div>';
        }

        /* 편의시설 */
        if (it.options) {
            h += '<div class="detail-section-title">편의시설 / 옵션</div>';
            h += '<div class="detail-tags">';
            var opts = it.options.split(",");
            for (var oi = 0; oi < opts.length; oi++) {
                h += '<span class="detail-tag">' + esc(opts[oi].trim()) + '</span>';
            }
            h += '</div>';
        }

        /* 링크 */
        h += '<div style="margin-top:16px;text-align:center;">';
        h += '<a href="https://m.place.naver.com/restaurant/' + it.id + '/home" target="_blank" class="btn btn-primary" style="font-size:12px;padding:8px 20px;text-decoration:none;display:inline-block;">네이버 플레이스에서 보기</a>';
        h += '</div>';

        document.getElementById("modalBody").innerHTML = h;
        document.getElementById("detailModal").classList.add("show");
    }
    window.openDetail = openDetail;

    /* 모달 닫기 */
    document.getElementById("modalClose").onclick = function() {
        document.getElementById("detailModal").classList.remove("show");
    };
    document.getElementById("detailModal").onclick = function(e) {
        if (e.target === this) this.classList.remove("show");
    };

    /* 이벤트 */
    document.getElementById("btnSearch").onclick = doSearch;
    document.getElementById("inputKeyword").onkeydown = function(e) { if (e.key === "Enter") doSearch(); };
    document.getElementById("inputPlaceId").onkeydown = function(e) { if (e.key === "Enter") doSearch(); };

    // === Drawer ===
    var drawer = document.getElementById("drawer");
    var btnMenu = document.getElementById("btnMenu");
    var btnDrawerClose = document.getElementById("btnDrawerClose");
    var linkTracker = document.getElementById("linkTracker");

    function openDrawer(){
        // tracker로 넘어갈 때 현재 입력값도 같이 전달
        var kw = document.getElementById("inputKeyword").value.trim();
        var pid = document.getElementById("inputPlaceId").value.trim();
        linkTracker.href = "./" + TRACKER_PAGE + "?keyword=" + encodeURIComponent(kw) + "&placeId=" + encodeURIComponent(pid);
        drawer.classList.add("show");
    }
    function closeDrawer(){ drawer.classList.remove("show"); }

    btnMenu.onclick = openDrawer;
    btnDrawerClose.onclick = closeDrawer;
    drawer.onclick = function(e){ if(e.target === drawer) closeDrawer(); };

    renderH();
})();
</script>
</body>
</html>
