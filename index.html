<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네이버 플레이스 실시간 순위 조회</title>
<style>
/* ── 전체 테마 ── */
:root {
  --primary: #03c75a;
  --primary-dark: #02a04a;
  --bg: #f5f7fa;
  --card: #ffffff;
  --text: #333;
  --text-light: #888;
  --border: #e0e0e0;
  --danger: #e74c3c;
  --success: #27ae60;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--bg); color:var(--text); }

/* ── 햄버거 ── */
.hamburger-menu { position: relative; }
.hamburger-btn {
  background: none; border: none; font-size: 28px; cursor: pointer;
  color: #fff; padding: 4px 8px; line-height: 1;
}
.hamburger-dropdown {
  display: none; position: absolute; top: 44px; right: 0;
  background: #fff; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,.15);
  min-width: 200px; z-index: 999; overflow: hidden;
}
.hamburger-dropdown.active { display: block; }
.hamburger-dropdown a {
  display: block; padding: 14px 20px; text-decoration: none;
  color: var(--text); font-size: 15px; border-bottom: 1px solid #f0f0f0;
  transition: background .2s;
}
.hamburger-dropdown a:last-child { border-bottom: none; }
.hamburger-dropdown a:hover { background: #f0faf4; }
.hamburger-dropdown a.current { color: var(--primary); font-weight: 700; }

/* ── 헤더 ── */
header {
  background: var(--primary); color: #fff; padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
header h1 { font-size: 18px; font-weight: 700; }

/* ── 컨테이너 ── */
.container { max-width: 720px; margin: 0 auto; padding: 20px; }

/* ── 카드 ── */
.card {
  background: var(--card); border-radius: 12px; padding: 24px;
  box-shadow: 0 2px 12px rgba(0,0,0,.06); margin-bottom: 20px;
}

/* ── 폼 ── */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-light); margin-bottom: 6px; }
.form-group select,
.form-group input {
  width: 100%; padding: 12px 14px; border: 1px solid var(--border);
  border-radius: 8px; font-size: 15px; outline: none; transition: border .2s;
}
.form-group select:focus,
.form-group input:focus { border-color: var(--primary); }

.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }

.btn {
  display: inline-block; padding: 14px 24px; background: var(--primary);
  color: #fff; border: none; border-radius: 8px; font-size: 15px;
  font-weight: 600; cursor: pointer; width: 100%; text-align: center;
  transition: background .2s;
}
.btn:hover { background: var(--primary-dark); }
.btn:disabled { background: #ccc; cursor: not-allowed; }

/* ── 결과 ── */
.result-summary {
  padding: 16px; background: #f0faf4; border-radius: 8px; margin-bottom: 16px;
  text-align: center; font-size: 18px; font-weight: 700;
}
.result-summary.not-found { background: #fdf0ef; color: var(--danger); }
.rank-highlight { color: var(--primary); font-size: 28px; }

/* ── 테이블 ── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #f8f9fa; padding: 10px 8px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border); white-space: nowrap; }
td { padding: 10px 8px; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
tr:hover { background: #fafafa; }
tr.highlight { background: #e8f8ee !important; font-weight: 700; }

/* ── 히스토리 ── */
.history-section { margin-top: 12px; }
.history-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
  margin-bottom: 8px; cursor: pointer; transition: background .2s; font-size: 13px;
}
.history-item:hover { background: #f0faf4; }
.history-item .hi-keyword { font-weight: 600; }
.history-item .hi-rank { color: var(--primary); font-weight: 700; }
.history-item .hi-time { color: var(--text-light); font-size: 11px; }
.clear-history-btn { font-size:12px; color:var(--danger); cursor:pointer; border:none; background:none; float:right; }

/* ── 로딩 ── */
.loading { text-align: center; padding: 40px; color: var(--text-light); }
.loading::after { content: ''; display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin-left: 8px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 반응형 ── */
@media (max-width: 600px) {
  .form-row { flex-direction: column; gap: 0; }
  header h1 { font-size: 16px; }
}
</style>
</head>
<body>

<!-- ★ Worker A 도메인을 여기서 변경 ★ -->
<script>
  const PROXY_API_BASE = 'https://naverrank.dampd21.workers.dev';
  const TRACKER_API_BASE = 'https://ranktracker.dampd21.workers.dev';
</script>

<header>
  <h1>🔍 네이버 플레이스 실시간 순위</h1>
  <div class="hamburger-menu">
    <button class="hamburger-btn" onclick="toggleMenu()">☰</button>
    <div class="hamburger-dropdown" id="navMenu">
      <a href="index.html" class="current">📊 실시간 순위 조회</a>
      <a href="tracker.html">📈 플레이스 추적</a>
    </div>
  </div>
</header>

<div class="container">
  <!-- 검색 폼 -->
  <div class="card">
    <div class="form-group">
      <label>업종</label>
      <select id="kind">
        <option value="restaurant">🍽️ 식당/카페</option>
        <option value="hairshop">💇 미용실(헤어샵)</option>
        <option value="nailshop">💅 네일</option>
        <option value="hospital">🏥 병원</option>
        <option value="accommodation">🏨 펜션/숙박</option>
      </select>
    </div>
    <div class="form-group">
      <label>키워드 (예: 강남역 맛집)</label>
      <input type="text" id="keyword" placeholder="검색할 키워드 입력">
    </div>
    <div class="form-group">
      <label>Place ID (대상 업체)</label>
      <input type="text" id="placeId" placeholder="플레이스 ID 입력">
    </div>
    <div class="form-group">
      <label>최대 검색 순위</label>
      <select id="maxRank">
        <option value="100">Top 100</option>
        <option value="200">Top 200</option>
        <option value="300">Top 300</option>
      </select>
    </div>
    <button class="btn" id="searchBtn" onclick="doSearch()">🔍 순위 조회</button>
  </div>

  <!-- 결과 -->
  <div id="resultArea"></div>

  <!-- 히스토리 -->
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <strong style="font-size:14px;">📋 조회 히스토리</strong>
      <button class="clear-history-btn" onclick="clearHistory()">전체 삭제</button>
    </div>
    <div id="historyList" class="history-section"></div>
  </div>
</div>

<script>
// ── 메뉴 ──
function toggleMenu() {
  document.getElementById('navMenu').classList.toggle('active');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.hamburger-menu')) {
    document.getElementById('navMenu').classList.remove('active');
  }
});

// ── 검색 ──
async function doSearch() {
  const kind = document.getElementById('kind').value;
  const keyword = document.getElementById('keyword').value.trim();
  const placeId = document.getElementById('placeId').value.trim();
  const maxRank = parseInt(document.getElementById('maxRank').value);

  if (!keyword || !placeId) {
    alert('키워드와 Place ID를 입력하세요.');
    return;
  }

  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.textContent = '조회 중...';
  document.getElementById('resultArea').innerHTML = '<div class="loading">순위 검색 중</div>';

  const display = 50;
  const pages = Math.ceil(maxRank / display);
  let allItems = [];
  let total = 0;
  let foundRank = -1;
  let error = null;

  try {
    for (let page = 0; page < pages; page++) {
      const start = page * display + 1;
      const url = `${PROXY_API_BASE}?kind=${encodeURIComponent(kind)}&keyword=${encodeURIComponent(keyword)}&start=${start}&display=${display}`;
      const resp = await fetch(url, { method: 'POST' });
      const data = await resp.json();

      if (data.error) {
        error = data.error;
        break;
      }

      total = data.total || total;
      if (data.items) {
        allItems = allItems.concat(data.items);
      }

      // 이미 찾았으면 더 이상 호출 안함
      if (foundRank < 0) {
        for (let i = 0; i < (data.items||[]).length; i++) {
          if (String(data.items[i].id) === String(placeId)) {
            foundRank = data.items[i].rank;
            break;
          }
        }
      }

      // 더 이상 아이템이 없으면 중단
      if (!data.items || data.items.length < display) break;

      // rate limit 방지
      if (page < pages - 1) await sleep(300);
    }
  } catch (e) {
    error = e.message;
  }

  btn.disabled = false;
  btn.textContent = '🔍 순위 조회';

  renderResult(kind, keyword, placeId, maxRank, total, allItems, foundRank, error);
  saveHistory(kind, keyword, placeId, maxRank, foundRank, total);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function renderResult(kind, keyword, placeId, maxRank, total, items, foundRank, error) {
  const area = document.getElementById('resultArea');
  let html = '';

  if (error) {
    html += `<div class="card"><div class="result-summary not-found">⚠️ 오류: ${escHtml(error)}</div></div>`;
  }

  if (foundRank > 0) {
    html += `<div class="card"><div class="result-summary">
      🎯 <strong>${escHtml(keyword)}</strong> 에서<br>
      <span class="rank-highlight">${foundRank}위</span>
      <span style="font-size:14px;color:var(--text-light)"> / 전체 ${total}개</span>
    </div></div>`;
  } else if (!error) {
    html += `<div class="card"><div class="result-summary not-found">
      😔 Top ${maxRank} 안에 해당 업체가 없습니다.<br>
      <span style="font-size:14px;color:var(--text-light)">전체 ${total}개 중 ${items.length}개 검색 완료</span>
    </div></div>`;
  }

  // 테이블
  if (items.length > 0) {
    html += `<div class="card"><div class="table-wrap"><table>
    <thead><tr>
      <th>#</th><th>업체명</th><th>카테고리</th><th>블로그</th><th>방문자</th><th>저장</th><th>별점</th>
    </tr></thead><tbody>`;
    items.forEach(it => {
      const isTarget = String(it.id) === String(placeId);
      html += `<tr class="${isTarget ? 'highlight' : ''}">
        <td>${it.rank}</td>
        <td>${escHtml(it.name)}${isTarget ? ' ⭐' : ''}</td>
        <td>${escHtml(it.category || '')}</td>
        <td>${it.blogCount||0}</td>
        <td>${it.visitorCount||0}</td>
        <td>${it.saveCount||0}</td>
        <td>${it.score||'-'}</td>
      </tr>`;
    });
    html += `</tbody></table></div></div>`;
  }

  // tracker 이동 버튼
  html += `<div style="text-align:center; margin:12px 0;">
    <a href="tracker.html?kind=${encodeURIComponent(kind)}&keyword=${encodeURIComponent(keyword)}&placeId=${encodeURIComponent(placeId)}" style="color:var(--primary);font-weight:600;text-decoration:none;">📈 이 키워드를 추적하기 →</a>
  </div>`;

  area.innerHTML = html;
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── 히스토리 (localStorage) ──
function getHistory() {
  try { return JSON.parse(localStorage.getItem('rankHistory') || '[]'); }
  catch { return []; }
}
function saveHistory(kind, keyword, placeId, maxRank, rank, total) {
  const hist = getHistory();
  hist.unshift({
    kind, keyword, placeId, maxRank, rank, total,
    time: new Date().toLocaleString('ko-KR')
  });
  if (hist.length > 30) hist.length = 30;
  localStorage.setItem('rankHistory', JSON.stringify(hist));
  renderHistory();
}
function clearHistory() {
  localStorage.removeItem('rankHistory');
  renderHistory();
}
function renderHistory() {
  const hist = getHistory();
  const el = document.getElementById('historyList');
  if (!hist.length) { el.innerHTML = '<div style="text-align:center;color:var(--text-light);font-size:13px;padding:12px;">아직 조회 기록이 없습니다</div>'; return; }
  el.innerHTML = hist.map(h => `
    <div class="history-item" onclick="loadHistory('${escAttr(h.kind)}','${escAttr(h.keyword)}','${escAttr(h.placeId)}',${h.maxRank})">
      <div>
        <span class="hi-keyword">${escHtml(h.keyword)}</span>
        <span style="color:var(--text-light);font-size:11px;">(${kindLabel(h.kind)})</span><br>
        <span class="hi-time">${h.time}</span>
      </div>
      <div class="hi-rank">${h.rank > 0 ? h.rank + '위' : '미발견'}</div>
    </div>
  `).join('');
}
function loadHistory(kind, keyword, placeId, maxRank) {
  document.getElementById('kind').value = kind;
  document.getElementById('keyword').value = keyword;
  document.getElementById('placeId').value = placeId;
  document.getElementById('maxRank').value = maxRank;
  doSearch();
}
function escAttr(s) { return (s||'').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
function kindLabel(k) {
  const m = { restaurant:'식당/카페', hairshop:'미용실', nailshop:'네일', hospital:'병원', accommodation:'숙박' };
  return m[k] || k;
}

// ── 초기화 ──
renderHistory();

// URL 파라미터로 자동 채우기
(function() {
  const p = new URLSearchParams(location.search);
  if (p.get('kind')) document.getElementById('kind').value = p.get('kind');
  if (p.get('keyword')) document.getElementById('keyword').value = p.get('keyword');
  if (p.get('placeId')) document.getElementById('placeId').value = p.get('placeId');
})();
</script>
</body>
</html>
