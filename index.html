<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네이버 플레이스 순위 조회</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;color:#333}
.header{background:#1a1a2e;color:#fff;padding:20px 0}
.header-inner{max-width:900px;margin:0 auto;padding:0 20px}
.header h1{font-size:22px;font-weight:700}
.header p{font-size:13px;color:#aaa;margin-top:4px}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.menu-btn{width:38px;height:38px;border:1px solid rgba(255,255,255,.25);background:transparent;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.menu-btn span{display:block;width:18px;height:2px;background:#fff;position:relative}
.menu-btn span:before,.menu-btn span:after{content:"";position:absolute;left:0;width:18px;height:2px;background:#fff}
.menu-btn span:before{top:-6px}.menu-btn span:after{top:6px}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:9999}
.drawer-overlay.show{display:block}
.drawer{position:absolute;top:0;right:0;width:280px;height:100%;background:#fff;box-shadow:-10px 0 30px rgba(0,0,0,.18);padding:16px}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid #eee;margin-bottom:10px}
.drawer-title{font-weight:800;color:#1a1a2e}
.drawer-close{border:none;background:none;font-size:22px;cursor:pointer;color:#666}
.drawer a{display:block;padding:12px 10px;border-radius:10px;color:#333;text-decoration:none;font-weight:700}
.drawer a:hover{background:#f5f5f5}
.drawer .mutedlink{font-size:12px;color:#888;font-weight:600;padding:0 10px 8px}
.container{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:24px;margin-bottom:20px}
.card h2{font-size:16px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #eee}
.form-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.form-group{flex:1;min-width:180px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#555}
.form-group input,.form-group select{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:6px;font-size:14px;outline:none}
.form-group input:focus{border-color:#1a1a2e}
.btn{padding:10px 28px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s}
.btn-primary{background:#1a1a2e;color:#fff}
.btn-primary:hover{background:#16213e}
.btn-primary:disabled{background:#999;cursor:not-allowed}
.btn-ghost{background:#fff;border:1px solid #ccc;color:#333}
.btn-ghost:hover{background:#f0f0f0}
.result-box{display:none;margin-top:20px;padding:24px;border-radius:8px;text-align:center}
.result-found{background:#eafaf1;border:2px solid #2ecc71}
.result-notfound{background:#fdedec;border:2px solid #e74c3c}
.result-error{background:#fef9e7;border:2px solid #f39c12}
.result-rank{font-size:52px;font-weight:800;color:#1a1a2e;margin:8px 0}
.result-rank-sub{font-size:14px;color:#888}
.result-name{font-size:18px;font-weight:700;margin-bottom:4px}
.result-detail{font-size:13px;color:#666;margin-top:6px}
.result-stats{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:14px}
.result-stat{text-align:center}
.result-stat-value{font-size:18px;font-weight:700;color:#1a1a2e}
.result-stat-label{font-size:11px;color:#999}
.loading{display:none;text-align:center;padding:30px}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid #ddd;border-top-color:#1a1a2e;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:10px;font-size:13px;color:#888}
.rank-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:16px}
.rank-table th{background:#f8f8f8;padding:8px 6px;text-align:left;font-weight:600;border-bottom:2px solid #ddd;white-space:nowrap;position:sticky;top:0}
.rank-table td{padding:8px 6px;border-bottom:1px solid #eee;vertical-align:middle}
.rank-table tbody tr:hover{background:#f5f5f5}
.rank-table .highlight{background:#fff9c4}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-weight:700;font-size:11px;color:#fff}
.badge-1{background:#e74c3c}.badge-3{background:#2ecc71}.badge-5{background:#3498db}
.badge-10{background:#f39c12}.badge-20{background:#e67e22}.badge-other{background:#95a5a6}
.table-name{font-weight:600;color:#1a1a2e}
.table-micro{font-size:10px;color:#999;font-style:italic;display:block;margin-top:2px}
.max-select{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.max-select label{font-size:13px;font-weight:600;color:#555}
.max-select select{padding:6px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px}
.page-info{text-align:center;font-size:12px;color:#aaa;margin-top:8px}
.history-list{margin-top:16px}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #f0f0f0;font-size:13px}
.history-item:hover{background:#fafafa}
.history-keyword{font-weight:600}
.btn-tiny{padding:4px 10px;font-size:11px;border:1px solid #ddd;background:#fff;border-radius:4px;cursor:pointer}
.btn-tiny:hover{background:#f0f0f0}
.btn-tiny-del{color:#e74c3c;border-color:#e74c3c}

.muted{color:#888;font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10000;padding:24px;overflow:auto}
.modal-overlay.show{display:block}
.modal{max-width:920px;margin:0 auto;background:#fff;border-radius:12px;border:1px solid #e5e5e5;overflow:hidden}
.modal-head{padding:14px 16px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fafafa}
.modal-title{font-weight:900;color:#1a1a2e}
.modal-close{border:none;background:none;font-size:22px;cursor:pointer;color:#666}
.modal-body{padding:16px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.kv .box{border:1px solid #eee;border-radius:12px;padding:12px;background:#fff}
.kv .box b{display:block;font-size:18px;color:#1a1a2e}
.kv .box span{font-size:11px;color:#888}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.chartBox{border:1px solid #eee;border-radius:12px;padding:12px;background:#fff}
.chartBox h3{margin:0 0 8px;font-size:13px;color:#1a1a2e}
.chartWrap{height:260px;position:relative}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2ff;color:#1a1a2e;font-size:11px;font-weight:700;margin:2px 4px 0 0}
.tag-neg{background:#ffecec;color:#b12b2b}
@media(max-width:900px){.kv{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-top">
      <h1>네이버 플레이스 순위 조회</h1>
      <button class="menu-btn" id="btnMenu" aria-label="메뉴"><span></span></button>
    </div>
    <p>업종과 키워드, 플레이스 ID를 입력하면 실시간으로 순위를 확인합니다</p>
  </div>
</div>

<div class="container">
  <div class="card">
    <h2>순위 조회</h2>
    <div class="form-row">
      <div class="form-group">
        <label>업종</label>
        <select id="selectKind">
          <option value="restaurant">식당/카페</option>
          <option value="hairshop">미용실(헤어샵)</option>
          <option value="nailshop">네일</option>
          <option value="hospital">병원</option>
          <option value="accommodation">펜션/숙박</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>검색 키워드</label>
        <input type="text" id="inputKeyword" placeholder="예: 강남역맛집">
      </div>
      <div class="form-group">
        <label>플레이스 ID</label>
        <input type="text" id="inputPlaceId" placeholder="예: 1951454277">
      </div>
    </div>
    <div class="max-select">
      <label>검색 범위</label>
      <select id="selectMaxRank">
        <option value="100">100위까지</option>
        <option value="200">200위까지</option>
        <option value="300" selected>300위까지</option>
      </select>
    </div>
    <button class="btn btn-primary" id="btnSearch">순위 조회</button>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingText">검색 중...</div>
    </div>
    <div class="result-box" id="resultBox"></div>
  </div>

  <div class="card" id="tableCard" style="display:none;">
    <h2>검색 결과 (<span id="tableKeyword"></span>)</h2>
    <div style="overflow-x:auto;max-height:600px;overflow-y:auto;">
      <table class="rank-table" id="rankTable">
        <thead>
          <tr>
            <th>순위</th><th>업체명</th><th>카테고리</th><th>블로그</th><th>방문자</th><th>별점</th><th>저장</th><th>이미지</th>
          </tr>
        </thead>
        <tbody id="rankTableBody"></tbody>
      </table>
    </div>
    <div class="page-info" id="pageInfo"></div>
  </div>

  <div class="card">
    <h2>최근 조회 기록</h2>
    <div class="history-list" id="historyList"></div>
    <div id="historyEmpty" style="text-align:center;padding:20px;color:#aaa;font-size:13px;">조회 기록이 없습니다</div>
  </div>
</div>

<div class="drawer-overlay" id="drawer">
  <div class="drawer" role="dialog" aria-modal="true">
    <div class="drawer-head">
      <div class="drawer-title">메뉴</div>
      <button class="drawer-close" id="btnDrawerClose" aria-label="닫기">x</button>
    </div>
    <div class="mutedlink">페이지 이동</div>
    <a href="./index.html">실시간 조회</a>
    <a href="#" id="linkTracker">플레이스 추적</a>
  </div>
</div>

<!-- 리뷰 모달 -->
<div class="modal-overlay" id="reviewModal">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="rmTitle">리뷰 대시보드</div>
        <div class="muted" id="rmSub"></div>
      </div>
      <button class="modal-close" id="rmClose" aria-label="닫기">x</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <button class="btn btn-ghost" id="rm7">7일</button>
        <button class="btn btn-ghost" id="rm30">30일</button>
        <button class="btn btn-ghost" id="rmCustomBtn">직접입력</button>
        <button class="btn btn-ghost" id="rmDownload">HTML 다운로드(차트+표)</button>
        <span class="muted" id="rmRangeText"></span>
      </div>

      <div id="rmCustomBox" style="display:none;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;">
        <input id="rmStart" placeholder="YYYY-MM-DD">
        <input id="rmEnd" placeholder="YYYY-MM-DD">
        <button class="btn btn-primary" id="rmApply">적용</button>
      </div>

      <div id="rmStatus" class="muted" style="margin-top:10px;"></div>
      <div id="rmContent" style="margin-top:10px;"></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var PROXY = "https://naverrank.dampd21.workers.dev/";
  var DASH_BASE = "https://naverdashboard.dampd21.workers.dev";
  var TRACKER_PAGE = "tracker.html";
  var HKEY = "npt_rank_history";

  var allItems = [];
  var lastFound = null;

  function comma(n){ return (n==null) ? "-" : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function esc(s){ return s==null ? "" : String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function val(v, d){ return (v !== null && v !== undefined && v !== "") ? v : (d !== undefined ? d : "-"); }

  function ymd(d){
    var yyyy=d.getFullYear(), mm=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
    return yyyy+"-"+mm+"-"+dd;
  }
  // 오늘 미포함 (로컬 기준)
  function calcRange(days){
    var now = new Date();
    var end = new Date(now.getFullYear(), now.getMonth(), now.getDate()-1);
    var start = new Date(end.getFullYear(), end.getMonth(), end.getDate()-(days-1));
    return { startDate: ymd(start), endDate: ymd(end) };
  }
  function isYMD(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s||"")); }

  function parseCount(v){
    if(v==null) return 0;
    if(typeof v==="number") return v;
    var s=String(v).replace(/,/g,"").replace(/~/g,"").trim();
    var n=parseInt(s,10);
    return isNaN(n)?0:n;
  }

  function extractItems(kind, raw){
    try{
      if(Array.isArray(raw) && raw[0] && raw[0].errors && raw[0].errors.length){
        return { items:[], total:0, error: raw[0].errors[0].message || "GRAPHQL_ERROR" };
      }
      var d = raw[0].data;
      if(kind==="restaurant") return { items: d.restaurants.items||[], total:d.restaurants.total||0 };
      if(kind==="hairshop"||kind==="nailshop"||kind==="hospital") return { items: d.businesses.items||[], total:d.businesses.total||0 };
      if(kind==="accommodation"){
        var biz = d.accommodationSearch && d.accommodationSearch.business;
        if(biz) return { items: biz.items||[], total: biz.total||0 };
      }
    }catch(e){}
    return { items:[], total:0 };
  }

  function normalizeItem(kind, it){
    return {
      id: it.id,
      name: it.name||"",
      category: it.category||"",
      businessCategory: it.businessCategory||"",
      blogCafeReviewCount: parseCount(it.blogCafeReviewCount),
      visitorReviewCount: parseCount(it.visitorReviewCount || it.placeReviewCount || it.totalReviewCount),
      visitorReviewScore: it.visitorReviewScore || it.placeReviewScore || it.bookingReviewScore || null,
      saveCount: parseCount(it.saveCount),
      imageCount: parseCount(it.imageCount),
      microReview: it.microReview || ""
    };
  }

  function kindLabel(k){
    var m={ restaurant:"식당/카페", hairshop:"미용실", nailshop:"네일", hospital:"병원", accommodation:"숙박" };
    return m[k]||k;
  }
  function bc(r){
    if(r===1) return "badge-1";
    if(r<=3) return "badge-3";
    if(r<=5) return "badge-5";
    if(r<=10) return "badge-10";
    if(r<=20) return "badge-20";
    return "badge-other";
  }

  function loadH(){ try{ return JSON.parse(localStorage.getItem(HKEY))||[]; }catch(e){ return []; } }
  function saveH(l){ localStorage.setItem(HKEY, JSON.stringify(l)); }
  function addH(kind, kw, pid, rank, name){
    var l=loadH();
    l.unshift({ kind:kind, keyword:kw, placeId:pid, rank:rank, name:name||"", time:new Date().toLocaleString("ko-KR") });
    if(l.length>50) l=l.slice(0,50);
    saveH(l); renderH();
  }
  function renderH(){
    var l=loadH();
    var c=document.getElementById("historyList");
    var e=document.getElementById("historyEmpty");
    c.innerHTML="";
    if(l.length===0){ e.style.display="block"; return; }
    e.style.display="none";
    for(var i=0;i<l.length;i++){
      (function(idx){
        var it=l[idx];
        var d=document.createElement("div");
        d.className="history-item";
        var rt=it.rank ? it.rank+"위" : "순위밖";
        var nt=it.name ? " - "+it.name : "";
        var kl=kindLabel(it.kind||"restaurant");
        d.innerHTML =
          '<div><span class="history-keyword">'+esc(it.keyword)+'</span>' +
          '<span style="color:#888;font-size:12px;"> ['+kl+'] (ID: '+esc(it.placeId)+')</span>' +
          '<br><span style="font-size:11px;color:#aaa;">'+it.time+' / '+rt+nt+'</span></div>' +
          '<div style="display:flex;gap:6px;">' +
          '<button class="btn-tiny re">재조회</button>' +
          '<button class="btn-tiny btn-tiny-del del">삭제</button></div>';

        d.querySelector(".re").onclick=function(ev){
          ev.stopPropagation();
          document.getElementById("selectKind").value=it.kind||"restaurant";
          document.getElementById("inputKeyword").value=it.keyword;
          document.getElementById("inputPlaceId").value=it.placeId;
          doSearch();
        };
        d.querySelector(".del").onclick=function(ev){
          ev.stopPropagation();
          var ll=loadH(); ll.splice(idx,1); saveH(ll); renderH();
        };
        c.appendChild(d);
      })(i);
    }
  }

  function showLoad(m){
    document.getElementById("loading").style.display="block";
    document.getElementById("loadingText").textContent=m||"검색 중...";
    document.getElementById("resultBox").style.display="none";
    document.getElementById("tableCard").style.display="none";
  }
  function hideLoad(){ document.getElementById("loading").style.display="none"; }
  function showRes(h, cls){
    var b=document.getElementById("resultBox");
    b.className="result-box "+cls;
    b.innerHTML=h;
    b.style.display="block";
  }

  function fetchPage(kind, kw, start, display){
    return new Promise(function(resolve, reject){
      var url = PROXY + "?kind="+encodeURIComponent(kind)+"&keyword="+encodeURIComponent(kw)+"&start="+start+"&display="+display;
      var x=new XMLHttpRequest();
      x.open("POST", url, true);
      x.setRequestHeader("Content-Type","application/json");
      x.timeout=20000;
      x.onload=function(){
        if(x.status===200){
          try{
            var j=JSON.parse(x.responseText);
            if(Array.isArray(j)&&j[0]&&j[0].errors&&j[0].errors.length){
              reject("GRAPHQL_ERROR: "+(j[0].errors[0].message||"unknown"));
              return;
            }
            resolve(j);
          }catch(e){
            reject("응답 파싱 실패: "+x.responseText.substring(0,200));
          }
        }else reject("HTTP "+x.status+": "+x.responseText.substring(0,200));
      };
      x.onerror=function(){ reject("네트워크 오류"); };
      x.ontimeout=function(){ reject("시간 초과"); };
      x.send("{}");
    });
  }

  function doSearch(){
    var kind=document.getElementById("selectKind").value;
    var kw=document.getElementById("inputKeyword").value.trim();
    var pid=document.getElementById("inputPlaceId").value.trim();
    var maxR=parseInt(document.getElementById("selectMaxRank").value)||300;
    if(!kw){ alert("키워드를 입력하세요."); return; }
    if(!pid){ alert("플레이스 ID를 입력하세요."); return; }

    document.getElementById("btnSearch").disabled=true;
    showLoad("'"+kw+"' 검색 중... (1~100위)");
    allItems=[];
    lastFound=null;

    var total=0, page=0, ps=100, mp=Math.ceil(maxR/ps);

    function next(){
      page++;
      var s=(page-1)*ps+1, d=Math.min(ps, maxR-s+1);
      if(page>1) document.getElementById("loadingText").textContent="'"+kw+"' 검색 중... ("+s+"~"+(s+d-1)+"위)";
      fetchPage(kind, kw, s, d).then(function(raw){
        var ex=extractItems(kind, raw);
        if(ex.error) throw new Error(ex.error);

        total=ex.total||total;
        var normalized=(ex.items||[]).map(function(it){ return normalizeItem(kind,it); });
        allItems=allItems.concat(normalized);

        var fi=-1;
        for(var i=0;i<allItems.length;i++){
          if(String(allItems[i].id)===String(pid)){ fi=i; break; }
        }
        if(fi>=0 || (ex.items||[]).length<d || page>=mp){
          hideLoad(); document.getElementById("btnSearch").disabled=false;
          render(kind, kw, pid, total, maxR);
        }else setTimeout(next, 300);
      }).catch(function(err){
        hideLoad(); document.getElementById("btnSearch").disabled=false;
        showRes('<div style="font-size:15px;font-weight:600;color:#e67e22;">조회 실패</div><div class="result-detail">'+esc(String(err.message||err))+'</div>',"result-error");
      });
    }
    next();
  }

  function render(kind, kw, pid, total, maxR){
    var fi=-1, found=null;
    for(var i=0;i<allItems.length;i++){
      if(String(allItems[i].id)===String(pid)){ fi=i; found=allItems[i]; break; }
    }

    if(fi>=0){
      var rank=fi+1;
      lastFound={ placeId:pid, name:found.name, keyword:kw, kind:kind };

      showRes(
        '<div class="result-name">'+esc(found.name)+'</div>' +
        '<div class="result-detail">'+esc(found.category)+' / '+esc(found.businessCategory)+'</div>' +
        '<div class="result-rank">'+rank+'<span style="font-size:20px;">위</span></div>' +

        '<div class="result-stats">' +

  // ====== 리뷰 대시보드(1개 업체) ======
  var rm=document.getElementById("reviewModal");
  var rmTitle=document.getElementById("rmTitle");
  var rmSub=document.getElementById("rmSub");
  var rmStatus=document.getElementById("rmStatus");
  var rmContent=document.getElementById("rmContent");
  var rmRangeText=document.getElementById("rmRangeText");

  var rmState={ businessId:null, name:null, range:null, data:null };
  var rmCharts={ gender:null, sentiment:null, daily:null, sources:null };

  function destroyRMCharts(){
    Object.keys(rmCharts).forEach(function(k){
      try{ if(rmCharts[k]) rmCharts[k].destroy(); }catch(e){}
      rmCharts[k]=null;
    });
  }

  function apiOne(businessId, startDate, endDate){
    var u = DASH_BASE.replace(/\/+$/,"") + "/stats?businessId=" + encodeURIComponent(businessId) +
      "&startDate=" + encodeURIComponent(startDate) + "&endDate=" + encodeURIComponent(endDate);
    return fetch(u).then(function(r){
      return r.json().then(function(j){
        if(!r.ok || !j.ok) throw new Error(j.error || ("HTTP "+r.status));
        return j;
      });
    });
  }

  function sumRef(arr){ arr=arr||[]; var s=0; for(var i=0;i<arr.length;i++) s+=(arr[i].value||0); return s; }
  function computeSent(themes){
    themes=themes||[];
    var pos=0,neg=0;
    for(var i=0;i<themes.length;i++){
      var t=themes[i];
      if(t.name==="total" && t.preference==="positive") pos += (t.value||0);
      if(t.name==="total" && t.preference==="negative") neg += (t.value||0);
    }
    var den=pos+neg; if(!den) return null;
    return Math.round((pos/den)*1000)/10;
  }
  function kwList(themes, pref){
    themes=themes||[];
    var a=themes.filter(function(t){ return t.preference===pref && t.name!=="total" && (t.value||0)>0; });
    a.sort(function(x,y){ return (y.value||0)-(x.value||0); });
    return a;
  }
  function mergeDaily(dailyObj){
    var map={};
    function addArr(arr){
      arr=arr||[];
      for(var i=0;i<arr.length;i++){
        map[arr[i].date]=(map[arr[i].date]||0)+(arr[i].value||0);
      }
    }
    if(!dailyObj) return [];
    addArr(dailyObj.reservationDaily);
    addArr(dailyObj.receiptDaily);
    return Object.keys(map).sort().map(function(k){ return {date:k,value:map[k]}; });
  }

  function renderOne(data){
    destroyRMCharts();

    var totalReviews = sumRef(data.reviews && data.reviews.referrers);
    var totalReviewers = sumRef(data.reviewers && data.reviewers.referrers);
    var sent = computeSent(data.themes);

    var posKW = kwList(data.themes,"positive").slice(0,8);
    var negKW = kwList(data.themes,"negative").slice(0,8);

    var revDaily = mergeDaily(data.reviews && data.reviews.daily);
    var rvrDaily = mergeDaily(data.reviewers && data.reviewers.daily);

    var sources = ((data.reviews && data.reviews.referrers) || []).slice()
      .filter(function(r){ return (r.value||0)>0; })
      .sort(function(a,b){ return (b.value||0)-(a.value||0); })
      .slice(0,6);

    rmContent.innerHTML =
      '<div class="kv">' +
        '<div class="box"><b>'+comma(totalReviews)+'</b><span>총 리뷰 수</span></div>' +
        '<div class="box"><b>'+comma(totalReviewers)+'</b><span>총 리뷰어 수</span></div>' +
        '<div class="box"><b>'+((data.charactersRatio?.male ?? "-")+'% / '+(data.charactersRatio?.female ?? "-")+'%')+'</b><span>성별(M/F)</span></div>' +
        '<div class="box"><b>'+(sent==null?'-':(sent+'%'))+'</b><span>긍정률(총합)</span></div>' +
      '</div>' +

      '<div class="grid2">' +
        '<div class="chartBox"><h3>성별 비율</h3><div class="chartWrap"><canvas id="chGender"></canvas></div></div>' +
        '<div class="chartBox"><h3>감성(총합)</h3><div class="chartWrap"><canvas id="chSent"></canvas></div></div>' +
      '</div>' +

      '<div class="grid2">' +
        '<div class="chartBox"><h3>일별 리뷰/리뷰어</h3><div class="chartWrap"><canvas id="chDaily"></canvas></div></div>' +
        '<div class="chartBox"><h3>리뷰 유입경로(Top)</h3><div class="chartWrap"><canvas id="chSrc"></canvas></div></div>' +
      '</div>' +

      '<div style="margin-top:12px;">' +
        '<div style="font-weight:900;color:#1a1a2e;margin-bottom:6px;">긍정 키워드</div>' +
        (posKW.length ? posKW.map(function(k){ return '<span class="tag">'+esc(k.name)+'('+k.value+')</span>'; }).join(" ") : '<span class="muted">없음</span>') +
      '</div>' +
      '<div style="margin-top:12px;">' +
        '<div style="font-weight:900;color:#1a1a2e;margin-bottom:6px;">부정 키워드</div>' +
        (negKW.length ? negKW.map(function(k){ return '<span class="tag tag-neg">'+esc(k.name)+'('+k.value+')</span>'; }).join(" ") : '<span class="muted">없음</span>') +
      '</div>' +

      '<div style="margin-top:12px;overflow:auto;max-height:240px;border:1px solid #eee;border-radius:12px;">' +
      '<table style="width:100%;border-collapse:collapse;font-size:12px;">' +
      '<thead><tr><th style="background:#f7f7f7;position:sticky;top:0;padding:8px;text-align:left;border-bottom:1px solid #eee;">유입</th>' +
      '<th style="background:#f7f7f7;position:sticky;top:0;padding:8px;text-align:right;border-bottom:1px solid #eee;">리뷰</th>' +
      '<th style="background:#f7f7f7;position:sticky;top:0;padding:8px;text-align:right;border-bottom:1px solid #eee;">ratio</th></tr></thead><tbody>' +
      sources.map(function(s){
        return '<tr><td style="padding:8px;border-bottom:1px solid #f0f0f0;">'+esc(s.name)+'</td>' +
          '<td style="padding:8px;border-bottom:1px solid #f0f0f0;text-align:right;">'+comma(s.value||0)+'</td>' +
          '<td style="padding:8px;border-bottom:1px solid #f0f0f0;text-align:right;">'+(s.ratio==null?'-':(s.ratio+'%'))+'</td></tr>';
      }).join("") +
      '</tbody></table></div>';

    // charts
    var male = data.charactersRatio ? (data.charactersRatio.male||0) : 0;
    var female = data.charactersRatio ? (data.charactersRatio.female||0) : 0;

    rmCharts.gender = new Chart(document.getElementById("chGender"), {
      type:"pie",
      data:{ labels:["남","여"], datasets:[{ data:[male,female], backgroundColor:["#4285f4","#ea4335"] }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:"bottom" } } }
    });

    var themes=data.themes||[];
    var pos=0,neg=0,neu=0;
    themes.forEach(function(t){
      if(t.name==="total" && t.preference==="positive") pos=t.value||0;
      if(t.name==="total" && t.preference==="negative") neg=t.value||0;
      if(t.name==="total" && t.preference==="neutral") neu=t.value||0;
    });

    rmCharts.sentiment = new Chart(document.getElementById("chSent"), {
      type:"doughnut",
      data:{ labels:["긍정","부정","중립"], datasets:[{ data:[pos,neg,neu], backgroundColor:["#34a853","#ea4335","#9aa0a6"] }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:"bottom" } } }
    });

    var map={};
    revDaily.forEach(function(r){ map[r.date]=map[r.date]||{}; map[r.date].rev=r.value; });
    rvrDaily.forEach(function(r){ map[r.date]=map[r.date]||{}; map[r.date].rvr=r.value; });
    var labels=Object.keys(map).sort();
    var revSeries=labels.map(function(d){ return map[d].rev||0; });
    var rvrSeries=labels.map(function(d){ return map[d].rvr||0; });

    rmCharts.daily = new Chart(document.getElementById("chDaily"), {
      type:"line",
      data:{ labels:labels, datasets:[
        { label:"리뷰", data:revSeries, borderColor:"#1a73e8", backgroundColor:"rgba(26,115,232,0.15)", tension:0.2 },
        { label:"리뷰어", data:rvrSeries, borderColor:"#34a853", backgroundColor:"rgba(52,168,83,0.15)", tension:0.2 }
      ]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:"bottom" } } }
    });

    rmCharts.sources = new Chart(document.getElementById("chSrc"), {
      type:"bar",
      data:{ labels:sources.map(s=>s.name), datasets:[{ data:sources.map(s=>s.value||0), backgroundColor:"#f39c12", borderRadius:6 }] },
      options:{ indexAxis:"y", responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } } }
    });
  }

  function openReviewModal(placeId, name){
    rmState.businessId=String(placeId);
    rmState.name=name||placeId;
    rmState.data=null;
    rmTitle.textContent="리뷰 대시보드: "+rmState.name;
    rmSub.textContent="businessId(placeId): "+rmState.businessId;
    rmStatus.textContent="";
    rmContent.innerHTML="";
    rm.classList.add("show");
    runOne(calcRange(7));
  }

  function closeReviewModal(){
    destroyRMCharts();
    rm.classList.remove("show");
  }

  function runOne(range){
    rmState.range=range;
    rmRangeText.textContent="기간: "+range.startDate+" ~ "+range.endDate+" (오늘 미포함)";
    rmStatus.textContent="로딩중...";
    rmContent.innerHTML="";
    apiOne(rmState.businessId, range.startDate, range.endDate)
      .then(function(resp){
        rmState.data=resp.data;
        rmStatus.textContent = resp.cached ? "완료(캐시)" : "완료";
        renderOne(resp.data);
      })
      .catch(function(e){
        rmStatus.textContent="실패: "+e.message;
      });
  }

  // ✅ 다운로드: 차트를 이미지로 뽑아 “정적 HTML(시각+표)” 생성 (JS 없음)

    if(!rmCharts.gender || !rmCharts.sentiment || !rmCharts.daily || !rmCharts.sources) return alert("차트 로딩 후 다시 시도하세요.");

    var imgG = rmCharts.gender.toBase64Image();
    var imgS = rmCharts.sentiment.toBase64Image();
    var imgD = rmCharts.daily.toBase64Image();
    var imgR = rmCharts.sources.toBase64Image();

    var data = rmState.data;
    var title = "review_dashboard_" + rmState.businessId + "_" + rmState.range.startDate + "_" + rmState.range.endDate;

    var totalReviews = sumRef(data.reviews && data.reviews.referrers);
    var totalReviewers = sumRef(data.reviewers && data.reviewers.referrers);
    var sent = computeSent(data.themes);

    var sources = ((data.reviews && data.reviews.referrers) || []).slice()
      .filter(function(r){ return (r.value||0)>0; })
      .sort(function(a,b){ return (b.value||0)-(a.value||0); });

      '.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}' +
      '.box{border:1px solid #eee;border-radius:12px;padding:12px}.box b{display:block;font-size:18px}.box span{font-size:11px;color:#777}' +
      '.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}' +
      '.imgbox{border:1px solid #eee;border-radius:12px;padding:12px;background:#fff}' +

      'table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}' +
      'th,td{border-bottom:1px solid #eee;padding:8px;text-align:left}th{background:#f7f7f7;position:sticky;top:0}' +
      '.num{text-align:right}' +

      '</style></head><body>' +

        '<h1>리뷰 대시보드: '+esc(rmState.name)+'</h1>' +

        '<div class="kv">' +
          '<div class="box"><b>'+comma(totalReviews)+'</b><span>총 리뷰 수</span></div>' +
          '<div class="box"><b>'+comma(totalReviewers)+'</b><span>총 리뷰어 수</span></div>' +
          '<div class="box"><b>'+((data.charactersRatio?.male ?? "-")+'% / '+(data.charactersRatio?.female ?? "-")+'%')+'</b><span>성별(M/F)</span></div>' +
          '<div class="box"><b>'+(sent==null?'-':(sent+'%'))+'</b><span>긍정률(총합)</span></div>' +

  // modal events
  document.getElementById("rmClose").onclick=closeReviewModal;

  renderH();
})();
