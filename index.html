<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네이버 플레이스 순위 조회</title>
<style>
* {
 margin: 0;
 padding: 0;
 box-sizing: border-box;
}
body {
 font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
 background: #f5f5f5;
 color: #333;
}
.header {
 background: #1a1a2e;
 color: #fff;
 padding: 20px 0;
}
.header-inner {
 max-width: 900px;
 margin: 0 auto;
 padding: 0 20px;
}
.header h1 {
 font-size: 22px;
 font-weight: 700;
}
.header p {
 font-size: 13px;
 color: #aaa;
 margin-top: 4px;
}
.container {
 max-width: 900px;
 margin: 0 auto;
 padding: 20px;
}
.card {
 background: #fff;
 border: 1px solid #ddd;
 border-radius: 8px;
 padding: 24px;
 margin-bottom: 20px;
}
.card h2 {
 font-size: 16px;
 margin-bottom: 16px;
 padding-bottom: 12px;
 border-bottom: 1px solid #eee;
}
.form-row {
 display: flex;
 gap: 12px;
 margin-bottom: 14px;
 flex-wrap: wrap;
}
.form-group {
 flex: 1;
 min-width: 180px;
}
.form-group label {
 display: block;
 font-size: 13px;
 font-weight: 600;
 margin-bottom: 6px;
 color: #555;
}
.form-group input,
.form-group select {
 width: 100%;
 padding: 10px 12px;
 border: 1px solid #ccc;
 border-radius: 6px;
 font-size: 14px;
 outline: none;
}
.form-group input:focus {
 border-color: #1a1a2e;
}
.btn {
 padding: 10px 28px;
 border: none;
 border-radius: 6px;
 font-size: 14px;
 font-weight: 600;
 cursor: pointer;
 transition: background 0.2s;
}
.btn-primary {
 background: #1a1a2e;
 color: #fff;
}
.btn-primary:hover {
 background: #16213e;
}
.btn-primary:disabled {
 background: #999;
 cursor: not-allowed;
}
.result-box {
 display: none;
 margin-top: 20px;
 padding: 20px;
 border-radius: 8px;
 text-align: center;
}
.result-found {
 background: #eafaf1;
 border: 2px solid #2ecc71;
}
.result-notfound {
 background: #fdedec;
 border: 2px solid #e74c3c;
}
.result-error {
 background: #fef9e7;
 border: 2px solid #f39c12;
}
.result-rank {
 font-size: 48px;
 font-weight: 800;
 color: #1a1a2e;
 margin: 8px 0;
}
.result-rank-sub {
 font-size: 14px;
 color: #888;
}
.result-name {
 font-size: 18px;
 font-weight: 700;
 margin-bottom: 4px;
}
.result-detail {
 font-size: 13px;
 color: #666;
 margin-top: 4px;
}
.loading {
 display: none;
 text-align: center;
 padding: 30px;
}
.spinner {
 display: inline-block;
 width: 32px;
 height: 32px;
 border: 3px solid #ddd;
 border-top-color: #1a1a2e;
 border-radius: 50%;
 animation: spin 0.6s linear infinite;
}
@keyframes spin {
 to { transform: rotate(360deg); }
}
.loading-text {
 margin-top: 10px;
 font-size: 13px;
 color: #888;
}
.rank-table {
 width: 100%;
 border-collapse: collapse;
 font-size: 12px;
 margin-top: 16px;
}
.rank-table th {
 background: #f8f8f8;
 padding: 8px 6px;
 text-align: left;
 font-weight: 600;
 border-bottom: 2px solid #ddd;
 white-space: nowrap;
}
.rank-table td {
 padding: 8px 6px;
 border-bottom: 1px solid #eee;
 vertical-align: top;
}
.rank-table tbody tr:hover {
 background: #fafafa;
}
.rank-table .highlight {
 background: #fff9c4;
 font-weight: 600;
}
.badge {
 display: inline-block;
 padding: 2px 8px;
 border-radius: 12px;
 font-weight: 700;
 font-size: 11px;
 color: #fff;
}
.badge-1 { background: #e74c3c; }
.badge-3 { background: #2ecc71; }
.badge-5 { background: #3498db; }
.badge-10 { background: #f39c12; }
.badge-20 { background: #e67e22; }
.badge-other { background: #95a5a6; }
.history-list {
 margin-top: 16px;
}
.history-item {
 display: flex;
 justify-content: space-between;
 align-items: center;
 padding: 8px 12px;
 border-bottom: 1px solid #f0f0f0;
 font-size: 13px;
}
.history-item:hover {
 background: #fafafa;
}
.history-keyword {
 font-weight: 600;
}
.btn-tiny {
 padding: 4px 10px;
 font-size: 11px;
 border: 1px solid #ddd;
 background: #fff;
 border-radius: 4px;
 cursor: pointer;
}
.btn-tiny:hover {
 background: #f0f0f0;
}
.btn-tiny-del {
 color: #e74c3c;
 border-color: #e74c3c;
}
.page-info {
 text-align: center;
 font-size: 12px;
 color: #aaa;
 margin-top: 8px;
}
.max-select {
 display: flex;
 gap: 8px;
 align-items: center;
 margin-bottom: 14px;
}
.max-select label {
 font-size: 13px;
 font-weight: 600;
 color: #555;
}
.max-select select {
 padding: 6px 10px;
 border: 1px solid #ccc;
 border-radius: 6px;
 font-size: 13px;
}

/* 상세정보 모달 */
.modal-overlay {
 display: none;
 position: fixed;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 background: rgba(0,0,0,0.5);
 z-index: 1000;
 align-items: center;
 justify-content: center;
}
.modal-overlay.show {
 display: flex;
}
.modal {
 background: #fff;
 border-radius: 10px;
 width: 90%;
 max-width: 600px;
 max-height: 85vh;
 overflow-y: auto;
 padding: 0;
}
.modal-header {
 position: sticky;
 top: 0;
 background: #1a1a2e;
 color: #fff;
 padding: 16px 20px;
 display: flex;
 justify-content: space-between;
 align-items: center;
 border-radius: 10px 10px 0 0;
}
.modal-header h3 {
 font-size: 16px;
 font-weight: 600;
}
.modal-close {
 background: none;
 border: none;
 color: #fff;
 font-size: 22px;
 cursor: pointer;
 padding: 0 4px;
}
.modal-body {
 padding: 20px;
}
.detail-section {
 margin-bottom: 20px;
}
.detail-section h4 {
 font-size: 14px;
 font-weight: 600;
 margin-bottom: 10px;
 padding-bottom: 8px;
 border-bottom: 1px solid #eee;
 color: #1a1a2e;
}
.detail-grid {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 8px;
}
.detail-item {
 padding: 8px 10px;
 background: #f8f8f8;
 border-radius: 6px;
}
.detail-label {
 font-size: 11px;
 color: #888;
 margin-bottom: 2px;
}
.detail-value {
 font-size: 14px;
 font-weight: 600;
 color: #333;
}
.detail-full {
 grid-column: 1 / -1;
}
.detail-tags {
 display: flex;
 flex-wrap: wrap;
 gap: 6px;
}
.detail-tag {
 display: inline-block;
 padding: 3px 10px;
 background: #eee;
 border-radius: 12px;
 font-size: 11px;
 color: #555;
}
.detail-review {
 padding: 10px 12px;
 background: #f9f9f9;
 border-radius: 6px;
 margin-bottom: 8px;
 font-size: 12px;
 line-height: 1.6;
 color: #444;
 border-left: 3px solid #3498db;
}
.detail-images {
 display: flex;
 gap: 8px;
 overflow-x: auto;
 padding-bottom: 8px;
}
.detail-images img {
 width: 100px;
 height: 100px;
 object-fit: cover;
 border-radius: 6px;
 flex-shrink: 0;
}
.status-open {
 color: #2ecc71;
 font-weight: 600;
}
.status-closed {
 color: #e74c3c;
 font-weight: 600;
}
.name-link {
 color: #1a1a2e;
 text-decoration: none;
 cursor: pointer;
}
.name-link:hover {
 text-decoration: underline;
 color: #3498db;
}
.micro-review {
 font-size: 11px;
 color: #888;
 font-style: italic;
}
.biz-hours {
 font-size: 11px;
 padding: 2px 8px;
 border-radius: 10px;
 display: inline-block;
}
.biz-hours-open {
 background: #eafaf1;
 color: #27ae60;
}
.biz-hours-closed {
 background: #fdedec;
 color: #c0392b;
}
@media (max-width: 600px) {
 .form-row {
  flex-direction: column;
 }
 .form-group {
  min-width: 100%;
 }
 .result-rank {
  font-size: 36px;
 }
 .detail-grid {
  grid-template-columns: 1fr;
 }
 .rank-table {
  font-size: 11px;
 }
}
</style>
</head>

<body>
<div class="header">
 <div class="header-inner">
  <h1>네이버 플레이스 순위 조회</h1>
  <p>키워드와 플레이스 ID를 입력하면 실시간으로 순위를 확인합니다</p>
 </div>
</div>

<div class="container">
 <div class="card">
  <h2>순위 조회</h2>
  <div class="form-row">
   <div class="form-group">
    <label>검색 키워드</label>
    <input type="text" id="inputKeyword" placeholder="예: 남영역맛집">
   </div>
   <div class="form-group">
    <label>플레이스 ID</label>
    <input type="text" id="inputPlaceId" placeholder="예: 1951454277">
   </div>
  </div>

  <div class="max-select">
   <label>검색 범위</label>
   <select id="selectMaxRank">
    <option value="100">100위까지</option>
    <option value="200">200위까지</option>
    <option value="300" selected>300위까지</option>
   </select>
  </div>

  <button class="btn btn-primary" id="btnSearch">순위 조회</button>

  <div class="loading" id="loading">
   <div class="spinner"></div>
   <div class="loading-text" id="loadingText">검색 중...</div>
  </div>

  <div class="result-box" id="resultBox"></div>
 </div>

 <div class="card" id="tableCard" style="display:none;">
  <h2>검색 결과 상세 (<span id="tableKeyword"></span>)</h2>
  <div style="overflow-x:auto;">
   <table class="rank-table" id="rankTable">
    <thead>
     <tr>
      <th>순위</th>
      <th>업체명</th>
      <th>카테고리</th>
      <th>주소</th>
      <th>블로그</th>
      <th>방문자</th>
      <th>저장</th>
      <th>별점</th>
      <th>영업</th>
      <th>가격대</th>
     </tr>
    </thead>
    <tbody id="rankTableBody"></tbody>
   </table>
  </div>
  <div class="page-info" id="pageInfo"></div>
 </div>

 <div class="card">
  <h2>최근 조회 기록</h2>
  <div class="history-list" id="historyList"></div>
  <div id="historyEmpty" style="text-align:center;padding:20px;color:#aaa;font-size:13px;">
   조회 기록이 없습니다
  </div>
 </div>
</div>

<!-- 상세정보 모달 -->
<div class="modal-overlay" id="detailModal">
 <div class="modal">
  <div class="modal-header">
   <h3 id="modalTitle">업체 상세정보</h3>
   <button class="modal-close" id="modalClose">x</button>
  </div>
  <div class="modal-body" id="modalBody"></div>
 </div>
</div>

<script>
(function() {
 "use strict";

 // [변경] 기존 "/" 루트 대신, Worker의 API 경로로 맞춤(404 방지)
 // 너의 Worker가 /api/naver/restaurants 만 받는 상태라면 이게 맞습니다.
 var PROXY_URL = "https://naverrank.dampd21.workers.dev/api/naver/restaurants";

 var HISTORY_KEY = "npt_rank_history";
 var allItemsGlobal = [];

 function loadHistory() {
  try {
   var raw = localStorage.getItem(HISTORY_KEY);
   if (raw) return JSON.parse(raw);
  } catch(e) {}
  return [];
 }
 function saveHistory(list) {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
 }
 function addHistory(keyword, placeId, rank, name) {
  var list = loadHistory();
  list.unshift({
   keyword: keyword,
   placeId: placeId,
   rank: rank,
   name: name || "",
   time: new Date().toLocaleString("ko-KR")
  });
  if (list.length > 50) list = list.slice(0, 50);
  saveHistory(list);
  renderHistory();
 }
 function renderHistory() {
  var list = loadHistory();
  var container = document.getElementById("historyList");
  var empty = document.getElementById("historyEmpty");
  container.innerHTML = "";
  if (list.length === 0) {
   empty.style.display = "block";
   return;
  }
  empty.style.display = "none";
  for (var i = 0; i < list.length; i++) {
   (function(idx) {
    var item = list[idx];
    var div = document.createElement("div");
    div.className = "history-item";
    var rankText = item.rank ? item.rank + "위" : "순위밖";
    var nameText = item.name ? " - " + item.name : "";
    div.innerHTML =
     '<div>' +
     '<span class="history-keyword">' + item.keyword + '</span>' +
     '<span style="color:#888;font-size:12px;"> (ID: ' + item.placeId + ')</span>' +
     '<br><span style="font-size:11px;color:#aaa;">' + item.time + ' / ' + rankText + nameText + '</span>' +
     '</div>' +
     '<div style="display:flex;gap:6px;">' +
     '<button class="btn-tiny btn-rerun">재조회</button>' +
     '<button class="btn-tiny btn-tiny-del btn-del">삭제</button>' +
     '</div>';
    div.querySelector(".btn-rerun").addEventListener("click", function(e) {
     e.stopPropagation();
     document.getElementById("inputKeyword").value = item.keyword;
     document.getElementById("inputPlaceId").value = item.placeId;
     doSearch();
    });
    div.querySelector(".btn-del").addEventListener("click", function(e) {
     e.stopPropagation();
     var l = loadHistory();
     l.splice(idx, 1);
     saveHistory(l);
     renderHistory();
    });
    container.appendChild(div);
   })(i);
  }
 }
 function badgeClass(rank) {
  if (rank === 1) return "badge-1";
  if (rank <= 3) return "badge-3";
  if (rank <= 5) return "badge-5";
  if (rank <= 10) return "badge-10";
  if (rank <= 20) return "badge-20";
  return "badge-other";
 }
 function showLoading(msg) {
  document.getElementById("loading").style.display = "block";
  document.getElementById("loadingText").textContent = msg || "검색 중...";
  document.getElementById("resultBox").style.display = "none";
  document.getElementById("tableCard").style.display = "none";
 }
 function hideLoading() {
  document.getElementById("loading").style.display = "none";
 }
 function showResult(html, cls) {
  var box = document.getElementById("resultBox");
  box.className = "result-box " + cls;
  box.innerHTML = html;
  box.style.display = "block";
 }
 function escapeHtml(str) {
  if (!str) return "";
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
 }
 function stripHtml(str) {
  if (!str) return "";
  return str.replace(/<[^>]*>/g, "");
 }
 function formatBizHours(bh) {
  if (!bh) return "";
  var status = bh.status || "";
  var desc = bh.description || "";
  var isOpen = status.indexOf("영업 중") >= 0;
  var cls = isOpen ? "biz-hours-open" : "biz-hours-closed";
  var text = status;
  if (desc) text += " / " + desc;
  return '<span class="biz-hours ' + cls + '">' + escapeHtml(text) + '</span>';
 }

 // [추가] 응답 형태가 배열(기존) or 객체(새 Worker)여도 items/total을 뽑아줌
 function extractRestaurants(data) {
  // 1) 기존 형태: [ { data: { restaurants: { items, total }}} ]
  if (Array.isArray(data) && data.length > 0 && data[0] && data[0].data && data[0].data.restaurants) {
   return data[0].data.restaurants;
  }
  // 2) 새 형태 A: { data: { restaurants: { items, total } } }
  if (data && data.data && data.data.restaurants) {
   return data.data.restaurants;
  }
  // 3) 새 형태 B: { restaurants: { items, total } }
  if (data && data.restaurants) {
   return data.restaurants;
  }
  // 4) 새 형태 C: { items, total }
  if (data && (data.items || data.total)) {
   return { items: data.items || [], total: data.total || 0 };
  }
  return { items: [], total: 0 };
 }

 // [변경] GET 우선(안정) + 필요 시 POST 재시도
 function fetchPage(keyword, start, display) {
  return new Promise(function(resolve, reject) {
   // start/display 기반이면 혹시 page 기반 API도 대비해서 같이 보냄
   var page = Math.floor((start - 1) / display) + 1;

   // keyword/q 둘 다 같이 전달(Worker 구현에 따라 어떤 키를 받을지 몰라서)
   var url = PROXY_URL +
    "?keyword=" + encodeURIComponent(keyword) +
    "&q=" + encodeURIComponent(keyword) +
    "&start=" + start +
    "&page=" + page +
    "&display=" + display;

   function requestOnce(method) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, url, true);

    // GET은 헤더 안 넣는 게 더 안정적(프리플라이트 감소)
    if (method === "POST") {
     xhr.setRequestHeader("Content-Type", "application/json");
    }

    xhr.timeout = 20000;
    xhr.onload = function() {
     if (xhr.status === 200) {
      try {
       var data = JSON.parse(xhr.responseText);
       resolve(data);
      } catch(e) {
       reject("응답 파싱 실패: " + e.message);
      }
     } else if (xhr.status === 405 && method === "GET") {
      // GET이 막혀있으면 POST로 재시도
      requestOnce("POST");
     } else {
      reject("HTTP " + xhr.status + ": " + (xhr.statusText || ""));
     }
    };
    xhr.onerror = function() {
     reject("네트워크 오류가 발생했습니다.");
    };
    xhr.ontimeout = function() {
     reject("요청 시간이 초과되었습니다.");
    };

    if (method === "POST") xhr.send("{}");
    else xhr.send();
   }

   requestOnce("GET");
  });
 }

 function doSearch() {
  var keyword = document.getElementById("inputKeyword").value.trim();
  var placeId = document.getElementById("inputPlaceId").value.trim();
  var maxRank = parseInt(document.getElementById("selectMaxRank").value) || 300;

  if (!keyword) {
   alert("키워드를 입력하세요.");
   return;
  }
  if (!placeId) {
   alert("플레이스 ID를 입력하세요.");
   return;
  }

  document.getElementById("btnSearch").disabled = true;

  // [변경] Worker가 display 50으로 제한하는 경우(클램프) 대비해서 pageSize=50 권장
  var pageSize = 50;

  showLoading("'" + keyword + "' 검색 중... (1~" + pageSize + "위)");

  allItemsGlobal = [];
  var totalCount = 0;
  var currentPage = 0;
  var maxPages = Math.ceil(maxRank / pageSize);

  function fetchNext() {
   currentPage++;
   var start = (currentPage - 1) * pageSize + 1;
   var display = Math.min(pageSize, maxRank - start + 1);

   if (currentPage > 1) {
    document.getElementById("loadingText").textContent =
     "'" + keyword + "' 검색 중... (" + start + "~" + (start + display - 1) + "위)";
   }

   fetchPage(keyword, start, display)
    .then(function(data) {
     var restaurants = extractRestaurants(data);
     var items = restaurants.items || [];
     var total = restaurants.total || 0;

     totalCount = total;
     allItemsGlobal = allItemsGlobal.concat(items);

     var foundIdx = -1;
     for (var i = 0; i < allItemsGlobal.length; i++) {
      if (String(allItemsGlobal[i].id) === String(placeId)) {
       foundIdx = i;
       break;
      }
     }

     // items.length < display 는 "마지막 페이지/제한"일 수 있음
     if (foundIdx >= 0 || items.length < display || currentPage >= maxPages) {
      hideLoading();
      document.getElementById("btnSearch").disabled = false;
      showResults(keyword, placeId, allItemsGlobal, totalCount, maxRank);
     } else {
      setTimeout(fetchNext, 300);
     }
    })
    .catch(function(err) {
     hideLoading();
     document.getElementById("btnSearch").disabled = false;
     showResult(
      '<div style="font-size:15px;font-weight:600;color:#e67e22;">조회 실패</div>' +
      '<div class="result-detail" style="margin-top:8px;">' + err + '</div>',
      "result-error"
     );
    });
  }

  fetchNext();
 }

 function showResults(keyword, placeId, allItems, totalCount, maxRank) {
  var foundIdx = -1;
  var foundItem = null;

  for (var i = 0; i < allItems.length; i++) {
   if (String(allItems[i].id) === String(placeId)) {
    foundIdx = i;
    foundItem = allItems[i];
    break;
   }
  }

  if (foundIdx >= 0) {
   var rank = foundIdx + 1;
   var bizHtml = formatBizHours(foundItem.newBusinessHours);
   var optionsHtml = "";

   if (foundItem.options) {
    var opts = foundItem.options.split(",");
    for (var oi = 0; oi < opts.length; oi++) {
     optionsHtml +=
      '<span style="display:inline-block;padding:2px 8px;background:#eee;border-radius:10px;font-size:11px;margin:2px;">' +
      escapeHtml(opts[oi].trim()) +
      '</span>';
    }
   }

   showResult(
    '<div class="result-name">' + escapeHtml(foundItem.name) + '</div>' +
    '<div class="result-detail">' + escapeHtml(foundItem.category) + ' / ' +
     escapeHtml(foundItem.commonAddress || foundItem.roadAddress) + '</div>' +
    '<div class="result-rank">' + rank + '<span style="font-size:20px;">위</span></div>' +
    '<div class="result-rank-sub">전체 ' + totalCount + '개 중</div>' +
    (bizHtml ? '<div style="margin-top:8px;">' + bizHtml + '</div>' : '') +
    '<div class="result-detail" style="margin-top:12px;">' +
     '블로그리뷰 ' + (foundItem.blogCafeReviewCount || 0) +
     ' / 방문자리뷰 ' + (foundItem.visitorReviewCount || 0) +
     ' / 저장 ' + (foundItem.saveCount || 0) +
     ' / 별점 ' + (foundItem.visitorReviewScore || "-") +
    '</div>' +
    (foundItem.priceCategory ? '<div class="result-detail">가격대: ' + escapeHtml(foundItem.priceCategory) + '</div>' : '') +
    (foundItem.microReview ? '<div class="result-detail" style="font-style:italic;color:#888;">"' + escapeHtml(foundItem.microReview) + '"</div>' : '') +
    (optionsHtml ? '<div style="margin-top:8px;">' + optionsHtml + '</div>' : '') +
    '<div style="margin-top:12px;"><span class="name-link" style="font-size:12px;color:#3498db;cursor:pointer;" onclick="openDetail(' + foundIdx + ')">상세정보 보기</span></div>',
    "result-found"
   );

   addHistory(keyword, placeId, rank, foundItem.name);

  } else {
   showResult(
    '<div style="font-size:16px;font-weight:600;color:#e74c3c;">' +
     maxRank + '위 안에 없습니다' +
    '</div>' +
    '<div class="result-detail">플레이스 ID: ' + placeId + '</div>' +
    '<div class="result-detail">전체 검색 결과: ' + totalCount + '개</div>',
    "result-notfound"
   );
   addHistory(keyword, placeId, null, "");
  }

  if (allItems.length > 0) {
   document.getElementById("tableCard").style.display = "block";
   document.getElementById("tableKeyword").textContent = keyword;

   var tbody = document.getElementById("rankTableBody");
   tbody.innerHTML = "";

   for (var j = 0; j < allItems.length; j++) {
    var item = allItems[j];
    var isTarget = String(item.id) === String(placeId);
    var tr = document.createElement("tr");
    if (isTarget) tr.className = "highlight";

    var rankNum = j + 1;

    var bh = item.newBusinessHours;
    var bhText = "";
    if (bh) {
     var isOpen = (bh.status || "").indexOf("영업 중") >= 0;
     bhText = '<span class="biz-hours ' + (isOpen ? "biz-hours-open" : "biz-hours-closed") + '">' +
      escapeHtml(bh.status || "") + '</span>';
    }

    tr.innerHTML =
     '<td><span class="badge ' + badgeClass(rankNum) + '">' + rankNum + '</span></td>' +
     '<td><span class="name-link" data-idx="' + j + '">' + escapeHtml(item.name) + '</span>' +
      (isTarget ? ' [대상]' : '') +
      (item.microReview ? '<br><span class="micro-review">' + escapeHtml(item.microReview) + '</span>' : '') +
     '</td>' +
     '<td>' + escapeHtml(item.category) + '</td>' +
     '<td style="font-size:11px;">' + escapeHtml(item.commonAddress || item.roadAddress || "") + '</td>' +
     '<td>' + (item.blogCafeReviewCount || 0) + '</td>' +
     '<td>' + (item.visitorReviewCount || 0) + '</td>' +
     '<td>' + (item.saveCount || 0) + '</td>' +
     '<td>' + (item.visitorReviewScore || "-") + '</td>' +
     '<td>' + bhText + '</td>' +
     '<td style="font-size:11px;">' + escapeHtml(item.priceCategory || "") + '</td>';

    tbody.appendChild(tr);
   }

   document.getElementById("pageInfo").textContent =
    allItems.length + "개 표시 / 전체 " + totalCount + "개";

   // 이름 클릭 이벤트
   var nameLinks = tbody.querySelectorAll(".name-link");
   for (var nl = 0; nl < nameLinks.length; nl++) {
    nameLinks[nl].addEventListener("click", function() {
     var idx = parseInt(this.getAttribute("data-idx"));
     openDetail(idx);
    });
   }
  }
 }

 window.openDetail = function(idx) {
  if (idx < 0 || idx >= allItemsGlobal.length) return;

  var item = allItemsGlobal[idx];
  var rank = idx + 1;

  document.getElementById("modalTitle").textContent =
   (item.name || "업체 상세정보") + " (#" + rank + "위)";

  var html = "";

  // 기본정보
  html += '<div class="detail-section">';
  html += '<h4>기본 정보</h4>';
  html += '<div class="detail-grid">';
  html += '<div class="detail-item"><div class="detail-label">업체명</div><div class="detail-value">' + escapeHtml(item.name) + '</div></div>';
  html += '<div class="detail-item"><div class="detail-label">카테고리</div><div class="detail-value">' + escapeHtml(item.category) + '</div></div>';
  html += '<div class="detail-item"><div class="detail-label">플레이스 ID</div><div class="detail-value">' + escapeHtml(item.id) + '</div></div>';
  html += '<div class="detail-item"><div class="detail-label">거리</div><div class="detail-value">' + escapeHtml(item.distance || "-") + '</div></div>';

  if (item.fullAddress || item.roadAddress) {
   html += '<div class="detail-item detail-full"><div class="detail-label">주소</div><div class="detail-value">' + escapeHtml(item.fullAddress || item.roadAddress) + '</div></div>';
  }
  if (item.phone || item.virtualPhone) {
   html += '<div class="detail-item"><div class="detail-label">전화번호</div><div class="detail-value">' + escapeHtml(item.phone || item.virtualPhone) + '</div></div>';
  }
  if (item.priceCategory) {
   html += '<div class="detail-item"><div class="detail-label">가격대</div><div class="detail-value">' + escapeHtml(item.priceCategory) + '</div></div>';
  }
  var bh = item.newBusinessHours;
  if (bh) {
   html += '<div class="detail-item detail-full"><div class="detail-label">영업시간</div><div class="detail-value">' + formatBizHours(bh) + '</div></div>';
  }
  if (item.microReview) {
   html += '<div class="detail-item detail-full"><div class="detail-label">한줄평</div><div class="detail-value" style="font-style:italic;">"' + escapeHtml(item.microReview) + '"</div></div>';
  }
  html += '</div></div>';

  // 리뷰/저장 통계
  html += '<div class="detail-section">';
  html += '<h4>리뷰 및 저장 통계</h4>';
  html += '<div class="detail-grid">';
  html += '<div class="detail-item"><div class="detail-label">블로그 리뷰</div><div class="detail-value">' + (item.blogCafeReviewCount || 0) + '</div></div>';
  html += '<div class="detail-item"><div class="detail-label">방문자 리뷰</div><div class="detail-value">' + (item.visitorReviewCount || 0) + '</div></div>';
  html += '<div class="detail-item"><div class="detail-label">예약 리뷰</div><div class="detail-value">' + (item.bookingReviewCount || 0) + '</div></div>';
  html += '<div class="detail-item"><div class="detail-label">전체 리뷰</div><div class="detail-value">' + (item.totalReviewCount || 0) + '</div></div>';
  html += '<div class="detail-item"><div class="detail-label">저장수</div><div class="detail-value">' + (item.saveCount || 0) + '</div></div>';
  html += '<div class="detail-item"><div class="detail-label">별점</div><div class="detail-value">' + (item.visitorReviewScore || "-") + '</div></div>';
  html += '<div class="detail-item"><div class="detail-label">이미지수</div><div class="detail-value">' + (item.imageCount || 0) + '</div></div>';
  html += '</div></div>';

  // 편의시설/옵션
  if (item.options) {
   html += '<div class="detail-section">';
   html += '<h4>편의시설 / 옵션</h4>';
   html += '<div class="detail-tags">';
   var opts = item.options.split(",");
   for (var oi = 0; oi < opts.length; oi++) {
    html += '<span class="detail-tag">' + escapeHtml(opts[oi].trim()) + '</span>';
   }
   html += '</div></div>';
  }

  // 예약/주문
  html += '<div class="detail-section">';
  html += '<h4>예약 / 서비스</h4>';
  html += '<div class="detail-grid">';
  html += '<div class="detail-item"><div class="detail-label">예약</div><div class="detail-value">' + (item.hasBooking ? "가능" : "불가") + '</div></div>';
  html += '<div class="detail-item"><div class="detail-label">네이버페이</div><div class="detail-value">' + (item.hasNPay ? "가능" : "불가") + '</div></div>';
  if (item.naverBookingCategory) {
   html += '<div class="detail-item"><div class="detail-label">예약유형</div><div class="detail-value">' + escapeHtml(item.naverBookingCategory) + '</div></div>';
  }
  if (item.deliveryArea) {
   html += '<div class="detail-item"><div class="detail-label">배달지역</div><div class="detail-value">' + escapeHtml(item.deliveryArea) + '</div></div>';
  }
  html += '</div></div>';

  // 방송
  if (item.broadcastInfo && item.broadcastInfo.program) {
   html += '<div class="detail-section">';
   html += '<h4>방송 출연</h4>';
   html += '<div class="detail-grid">';
   html += '<div class="detail-item"><div class="detail-label">프로그램</div><div class="detail-value">' + escapeHtml(item.broadcastInfo.program) + '</div></div>';
   if (item.broadcastInfo.date) {
    html += '<div class="detail-item"><div class="detail-label">방송일</div><div class="detail-value">' + escapeHtml(item.broadcastInfo.date) + '</div></div>';
   }
   if (item.broadcastInfo.menu) {
    html += '<div class="detail-item"><div class="detail-label">소개메뉴</div><div class="detail-value">' + escapeHtml(item.broadcastInfo.menu) + '</div></div>';
   }
   html += '</div></div>';
  }

  // 방문자 리뷰
  if (item.visitorReviews && item.visitorReviews.length > 0) {
   html += '<div class="detail-section">';
   html += '<h4>방문자 리뷰 (' + item.visitorReviews.length + '개)</h4>';
   for (var ri = 0; ri < item.visitorReviews.length; ri++) {
    var rv = item.visitorReviews[ri];
    html += '<div class="detail-review">' + stripHtml(rv.review || "") + '</div>';
   }
   html += '</div>';
  }

  // 방문자 이미지
  if (item.visitorImages && item.visitorImages.length > 0) {
   html += '<div class="detail-section">';
   html += '<h4>방문자 사진 (' + item.visitorImages.length + '개)</h4>';
   html += '<div class="detail-images">';
   for (var vi = 0; vi < item.visitorImages.length; vi++) {
    var img = item.visitorImages[vi];
    html += '<img src="' + escapeHtml(img.imageUrl) + '" alt="' + escapeHtml(img.nickname || "") + '" title="' + escapeHtml(img.nickname || "") + '">';
   }
   html += '</div></div>';
  }

  // 링크
  html += '<div class="detail-section">';
  html += '<h4>바로가기</h4>';
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;">';
  html += '<a href="https://m.place.naver.com/restaurant/' + item.id + '/home" target="_blank" class="btn btn-primary" style="font-size:12px;padding:6px 14px;text-decoration:none;">네이버 플레이스</a>';
  if (item.bookingUrl) {
   html += '<a href="' + escapeHtml(item.bookingUrl) + '" target="_blank" class="btn btn-primary" style="font-size:12px;padding:6px 14px;text-decoration:none;background:#27ae60;">예약하기</a>';
  }
  html += '</div></div>';

  document.getElementById("modalBody").innerHTML = html;
  document.getElementById("detailModal").classList.add("show");
 };

 // 모달 닫기
 document.getElementById("modalClose").addEventListener("click", function() {
  document.getElementById("detailModal").classList.remove("show");
 });
 document.getElementById("detailModal").addEventListener("click", function(e) {
  if (e.target === this) {
   this.classList.remove("show");
  }
 });

 document.getElementById("btnSearch").addEventListener("click", doSearch);
 document.getElementById("inputKeyword").addEventListener("keydown", function(e) {
  if (e.key === "Enter") doSearch();
 });
 document.getElementById("inputPlaceId").addEventListener("keydown", function(e) {
  if (e.key === "Enter") doSearch();
 });

 renderHistory();
})();
</script>
</body>
</html>
