<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네이버 플레이스 순위 조회</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f5;
    color: #333;
}

.header {
    background: #1a1a2e;
    color: #fff;
    padding: 20px 0;
}

.header-inner {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 20px;
}

.header h1 {
    font-size: 22px;
    font-weight: 700;
}

.header p {
    font-size: 13px;
    color: #aaa;
    margin-top: 4px;
}

.container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
}

.card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 20px;
}

.card h2 {
    font-size: 16px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #eee;
}

.form-row {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
}

.form-group {
    flex: 1;
    min-width: 180px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #555;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
}

.form-group input:focus {
    border-color: #1a1a2e;
}

.btn {
    padding: 10px 28px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}

.btn-primary {
    background: #1a1a2e;
    color: #fff;
}

.btn-primary:hover {
    background: #16213e;
}

.btn-primary:disabled {
    background: #999;
    cursor: not-allowed;
}

.result-box {
    display: none;
    margin-top: 20px;
    padding: 20px;
    border-radius: 8px;
    text-align: center;
}

.result-found {
    background: #eafaf1;
    border: 2px solid #2ecc71;
}

.result-notfound {
    background: #fdedec;
    border: 2px solid #e74c3c;
}

.result-error {
    background: #fef9e7;
    border: 2px solid #f39c12;
}

.result-rank {
    font-size: 48px;
    font-weight: 800;
    color: #1a1a2e;
    margin: 8px 0;
}

.result-rank-sub {
    font-size: 14px;
    color: #888;
}

.result-name {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
}

.result-detail {
    font-size: 13px;
    color: #666;
    margin-top: 4px;
}

.loading {
    display: none;
    text-align: center;
    padding: 30px;
}

.spinner {
    display: inline-block;
    width: 32px;
    height: 32px;
    border: 3px solid #ddd;
    border-top-color: #1a1a2e;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loading-text {
    margin-top: 10px;
    font-size: 13px;
    color: #888;
}

.rank-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 16px;
}

.rank-table th {
    background: #f8f8f8;
    padding: 10px 12px;
    text-align: left;
    font-weight: 600;
    border-bottom: 2px solid #ddd;
}

.rank-table td {
    padding: 10px 12px;
    border-bottom: 1px solid #eee;
}

.rank-table tbody tr:hover {
    background: #fafafa;
}

.rank-table .highlight {
    background: #fff9c4;
    font-weight: 600;
}

.badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 12px;
    color: #fff;
}

.badge-1 { background: #e74c3c; }
.badge-3 { background: #2ecc71; }
.badge-5 { background: #3498db; }
.badge-10 { background: #f39c12; }
.badge-20 { background: #e67e22; }
.badge-other { background: #95a5a6; }

.history-list {
    margin-top: 16px;
}

.history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 13px;
}

.history-item:hover {
    background: #fafafa;
    cursor: pointer;
}

.history-keyword {
    font-weight: 600;
}

.history-placeid {
    color: #888;
    font-size: 12px;
}

.history-actions {
    display: flex;
    gap: 8px;
    align-items: center;
}

.btn-tiny {
    padding: 4px 10px;
    font-size: 11px;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 4px;
    cursor: pointer;
}

.btn-tiny:hover {
    background: #f0f0f0;
}

.btn-tiny-del {
    color: #e74c3c;
    border-color: #e74c3c;
}

.btn-tiny-del:hover {
    background: #fdedec;
}

.page-info {
    text-align: center;
    font-size: 12px;
    color: #aaa;
    margin-top: 8px;
}

.max-select {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
}

.max-select label {
    font-size: 13px;
    font-weight: 600;
    color: #555;
}

.max-select select {
    padding: 6px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 13px;
}

@media (max-width: 600px) {
    .form-row {
        flex-direction: column;
    }
    .form-group {
        min-width: 100%;
    }
    .result-rank {
        font-size: 36px;
    }
}
</style>
</head>
<body>

<div class="header">
    <div class="header-inner">
        <h1>네이버 플레이스 순위 조회</h1>
        <p>키워드와 플레이스 ID를 입력하면 실시간으로 순위를 확인합니다</p>
    </div>
</div>

<div class="container">

    <div class="card">
        <h2>순위 조회</h2>
        <div class="form-row">
            <div class="form-group">
                <label>검색 키워드</label>
                <input type="text" id="inputKeyword" placeholder="예: 남영역맛집" value="남영역맛집">
            </div>
            <div class="form-group">
                <label>플레이스 ID</label>
                <input type="text" id="inputPlaceId" placeholder="예: 1951454277" value="1951454277">
            </div>
        </div>
        <div class="max-select">
            <label>검색 범위</label>
            <select id="selectMaxRank">
                <option value="100">100위까지</option>
                <option value="200">200위까지</option>
                <option value="300" selected>300위까지</option>
            </select>
        </div>
        <button class="btn btn-primary" id="btnSearch" onclick="doSearch()">순위 조회</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">검색 중...</div>
        </div>

        <div class="result-box" id="resultBox"></div>
    </div>

    <div class="card" id="tableCard" style="display:none;">
        <h2>검색 결과 상세 (<span id="tableKeyword"></span>)</h2>
        <div style="overflow-x:auto;">
            <table class="rank-table" id="rankTable">
                <thead>
                    <tr>
                        <th>순위</th>
                        <th>업체명</th>
                        <th>카테고리</th>
                        <th>블로그리뷰</th>
                        <th>방문자리뷰</th>
                        <th>저장수</th>
                        <th>별점</th>
                    </tr>
                </thead>
                <tbody id="rankTableBody"></tbody>
            </table>
        </div>
        <div class="page-info" id="pageInfo"></div>
    </div>

    <div class="card">
        <h2>최근 조회 기록</h2>
        <div class="history-list" id="historyList"></div>
        <div id="historyEmpty" style="text-align:center;padding:20px;color:#aaa;font-size:13px;">
            조회 기록이 없습니다
        </div>
    </div>

</div>

<script>
(function() {
    "use strict";

    var PROXY_LIST = [
        "https://api.allorigins.win/raw?url=",
        "https://api.codetabs.com/v1/proxy?quest="
    ];

    var HISTORY_KEY = "npt_rank_history";

    function loadHistory() {
        try {
            var raw = localStorage.getItem(HISTORY_KEY);
            if (raw) return JSON.parse(raw);
        } catch(e) {}
        return [];
    }

    function saveHistory(list) {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
    }

    function addHistory(keyword, placeId, rank, name) {
        var list = loadHistory();
        list.unshift({
            keyword: keyword,
            placeId: placeId,
            rank: rank,
            name: name || "",
            time: new Date().toLocaleString("ko-KR")
        });
        if (list.length > 50) list = list.slice(0, 50);
        saveHistory(list);
        renderHistory();
    }

    function renderHistory() {
        var list = loadHistory();
        var container = document.getElementById("historyList");
        var empty = document.getElementById("historyEmpty");
        container.innerHTML = "";

        if (list.length === 0) {
            empty.style.display = "block";
            return;
        }
        empty.style.display = "none";

        for (var i = 0; i < list.length; i++) {
            (function(idx) {
                var item = list[idx];
                var div = document.createElement("div");
                div.className = "history-item";

                var rankText = item.rank ? item.rank + "위" : "순위밖";
                var nameText = item.name ? " - " + item.name : "";

                div.innerHTML =
                    '<div>' +
                        '<span class="history-keyword">' + item.keyword + '</span>' +
                        '<span class="history-placeid"> (ID: ' + item.placeId + ')</span>' +
                        '<br><span style="font-size:11px;color:#aaa;">' + item.time + ' / ' + rankText + nameText + '</span>' +
                    '</div>' +
                    '<div class="history-actions">' +
                        '<button class="btn-tiny btn-rerun">재조회</button>' +
                        '<button class="btn-tiny btn-tiny-del btn-del">삭제</button>' +
                    '</div>';

                div.querySelector(".btn-rerun").addEventListener("click", function(e) {
                    e.stopPropagation();
                    document.getElementById("inputKeyword").value = item.keyword;
                    document.getElementById("inputPlaceId").value = item.placeId;
                    doSearch();
                });

                div.querySelector(".btn-del").addEventListener("click", function(e) {
                    e.stopPropagation();
                    var l = loadHistory();
                    l.splice(idx, 1);
                    saveHistory(l);
                    renderHistory();
                });

                container.appendChild(div);
            })(i);
        }
    }

    function badgeClass(rank) {
        if (rank === 1) return "badge-1";
        if (rank <= 3) return "badge-3";
        if (rank <= 5) return "badge-5";
        if (rank <= 10) return "badge-10";
        if (rank <= 20) return "badge-20";
        return "badge-other";
    }

    function showLoading(msg) {
        document.getElementById("loading").style.display = "block";
        document.getElementById("loadingText").textContent = msg || "검색 중...";
        document.getElementById("resultBox").style.display = "none";
        document.getElementById("tableCard").style.display = "none";
    }

    function hideLoading() {
        document.getElementById("loading").style.display = "none";
    }

    function showResult(html, cls) {
        var box = document.getElementById("resultBox");
        box.className = "result-box " + cls;
        box.innerHTML = html;
        box.style.display = "block";
    }

    function fetchGraphQL(keyword, start, display) {
        return new Promise(function(resolve, reject) {
            var payload = JSON.stringify([{
                "operationName": "getRestaurantList",
                "variables": {
                    "restaurantListInput": {
                        "query": keyword,
                        "x": "126.9783882",
                        "y": "37.5666103",
                        "start": start,
                        "display": display,
                        "isNmap": false,
                        "deviceType": "pc"
                    }
                },
                "query": "query getRestaurantList($restaurantListInput: RestaurantListInput) { restaurants: restaurantList(input: $restaurantListInput) { items { id name category roadAddress phone totalReviewCount blogCafeReviewCount visitorReviewCount visitorReviewScore saveCount } total } }"
            }]);

            var targetUrl = "https://api.place.naver.com/graphql";

            // 직접 호출 시도
            var xhr = new XMLHttpRequest();
            xhr.open("POST", targetUrl, true);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.setRequestHeader("Accept", "*/*");
            xhr.timeout = 15000;

            xhr.onload = function() {
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        resolve(data);
                    } catch(e) {
                        reject("JSON 파싱 실패");
                    }
                } else {
                    reject("HTTP " + xhr.status);
                }
            };

            xhr.onerror = function() {
                // CORS 차단시 프록시로 재시도
                fetchViaProxy(targetUrl, payload, 0, resolve, reject);
            };

            xhr.ontimeout = function() {
                fetchViaProxy(targetUrl, payload, 0, resolve, reject);
            };

            xhr.send(payload);
        });
    }

    function fetchViaProxy(targetUrl, payload, proxyIdx, resolve, reject) {
        if (proxyIdx >= PROXY_LIST.length) {
            reject("모든 프록시 실패. 네이버 API가 CORS를 차단합니다.");
            return;
        }

        var proxyBase = PROXY_LIST[proxyIdx];
        var proxyUrl = proxyBase + encodeURIComponent(targetUrl);

        var xhr = new XMLHttpRequest();
        xhr.open("POST", proxyUrl, true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.timeout = 15000;

        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    resolve(data);
                } catch(e) {
                    fetchViaProxy(targetUrl, payload, proxyIdx + 1, resolve, reject);
                }
            } else {
                fetchViaProxy(targetUrl, payload, proxyIdx + 1, resolve, reject);
            }
        };

        xhr.onerror = function() {
            fetchViaProxy(targetUrl, payload, proxyIdx + 1, resolve, reject);
        };

        xhr.ontimeout = function() {
            fetchViaProxy(targetUrl, payload, proxyIdx + 1, resolve, reject);
        };

        xhr.send(payload);
    }

    window.doSearch = function() {
        var keyword = document.getElementById("inputKeyword").value.trim();
        var placeId = document.getElementById("inputPlaceId").value.trim();
        var maxRank = parseInt(document.getElementById("selectMaxRank").value) || 300;

        if (!keyword) {
            alert("키워드를 입력하세요.");
            return;
        }
        if (!placeId) {
            alert("플레이스 ID를 입력하세요.");
            return;
        }

        document.getElementById("btnSearch").disabled = true;
        showLoading("'" + keyword + "' 검색 중... (1~100위)");

        var allItems = [];
        var totalCount = 0;
        var pageSize = 100;
        var pages = Math.ceil(maxRank / pageSize);
        var currentPage = 0;

        function fetchNext() {
            currentPage++;
            var start = (currentPage - 1) * pageSize + 1;
            var display = Math.min(pageSize, maxRank - start + 1);

            if (currentPage > 1) {
                document.getElementById("loadingText").textContent =
                    "'" + keyword + "' 검색 중... (" + start + "~" + (start + display - 1) + "위)";
            }

            fetchGraphQL(keyword, start, display)
                .then(function(data) {
                    var items = [];
                    var total = 0;

                    if (Array.isArray(data) && data.length > 0) {
                        var restaurants = data[0].data && data[0].data.restaurants;
                        if (restaurants) {
                            items = restaurants.items || [];
                            total = restaurants.total || 0;
                        }
                    }

                    totalCount = total;
                    allItems = allItems.concat(items);

                    // 해당 업체를 찾았는지 확인
                    var foundIdx = -1;
                    for (var i = 0; i < allItems.length; i++) {
                        if (String(allItems[i].id) === String(placeId)) {
                            foundIdx = i;
                            break;
                        }
                    }

                    // 찾았거나, 더 이상 결과가 없거나, 마지막 페이지면 종료
                    if (foundIdx >= 0 || items.length < display || currentPage >= pages) {
                        hideLoading();
                        document.getElementById("btnSearch").disabled = false;
                        showResults(keyword, placeId, allItems, totalCount, maxRank);
                    } else {
                        // 다음 페이지
                        setTimeout(fetchNext, 500);
                    }
                })
                .catch(function(err) {
                    hideLoading();
                    document.getElementById("btnSearch").disabled = false;
                    showResult(
                        '<div style="font-size:15px;font-weight:600;color:#e67e22;">조회 실패</div>' +
                        '<div class="result-detail">' + err + '</div>' +
                        '<div class="result-detail" style="margin-top:8px;">' +
                        '브라우저에서 직접 네이버 API를 호출할 수 없는 경우가 있습니다.<br>' +
                        'GitHub Actions 자동 추적 기능을 이용해주세요.' +
                        '</div>',
                        "result-error"
                    );
                });
        }

        fetchNext();
    };

    function showResults(keyword, placeId, allItems, totalCount, maxRank) {
        var foundIdx = -1;
        var foundItem = null;

        for (var i = 0; i < allItems.length; i++) {
            if (String(allItems[i].id) === String(placeId)) {
                foundIdx = i;
                foundItem = allItems[i];
                break;
            }
        }

        if (foundIdx >= 0) {
            var rank = foundIdx + 1;
            showResult(
                '<div class="result-name">' + (foundItem.name || "") + '</div>' +
                '<div class="result-detail">' + (foundItem.category || "") + '</div>' +
                '<div class="result-rank">' + rank + '<span style="font-size:20px;">위</span></div>' +
                '<div class="result-rank-sub">전체 ' + totalCount + '개 중</div>' +
                '<div class="result-detail" style="margin-top:12px;">' +
                    '블로그리뷰 ' + (foundItem.blogCafeReviewCount || 0) +
                    ' / 방문자리뷰 ' + (foundItem.visitorReviewCount || 0) +
                    ' / 저장 ' + (foundItem.saveCount || 0) +
                    ' / 별점 ' + (foundItem.visitorReviewScore || 0) +
                '</div>',
                "result-found"
            );
            addHistory(keyword, placeId, rank, foundItem.name);
        } else {
            showResult(
                '<div style="font-size:16px;font-weight:600;color:#e74c3c;">' +
                    maxRank + '위 안에 없습니다' +
                '</div>' +
                '<div class="result-detail">플레이스 ID: ' + placeId + '</div>' +
                '<div class="result-detail">전체 검색 결과: ' + totalCount + '개</div>',
                "result-notfound"
            );
            addHistory(keyword, placeId, null, "");
        }

        // 상세 테이블
        if (allItems.length > 0) {
            document.getElementById("tableCard").style.display = "block";
            document.getElementById("tableKeyword").textContent = keyword;
            var tbody = document.getElementById("rankTableBody");
            tbody.innerHTML = "";

            for (var j = 0; j < allItems.length; j++) {
                var item = allItems[j];
                var isTarget = String(item.id) === String(placeId);
                var tr = document.createElement("tr");
                if (isTarget) tr.className = "highlight";

                var rankNum = j + 1;
                tr.innerHTML =
                    '<td><span class="badge ' + badgeClass(rankNum) + '">' + rankNum + '</span></td>' +
                    '<td>' + (item.name || "") + (isTarget ? " [대상]" : "") + '</td>' +
                    '<td>' + (item.category || "") + '</td>' +
                    '<td>' + (item.blogCafeReviewCount || 0) + '</td>' +
                    '<td>' + (item.visitorReviewCount || 0) + '</td>' +
                    '<td>' + (item.saveCount || 0) + '</td>' +
                    '<td>' + (item.visitorReviewScore || 0) + '</td>';
                tbody.appendChild(tr);
            }

            document.getElementById("pageInfo").textContent =
                allItems.length + "개 표시 / 전체 " + totalCount + "개";
        }
    }

    // Enter 키 지원
    document.getElementById("inputKeyword").addEventListener("keydown", function(e) {
        if (e.key === "Enter") doSearch();
    });
    document.getElementById("inputPlaceId").addEventListener("keydown", function(e) {
        if (e.key === "Enter") doSearch();
    });

    // 초기 렌더링
    renderHistory();

})();
</script>
</body>
</html>
