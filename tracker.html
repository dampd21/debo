<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>플레이스 추적</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:#f5f5f5;color:#333;
    }
    .header{background:#1a1a2e;color:#fff;padding:20px 0}
    .header-inner{max-width:900px;margin:0 auto;padding:0 20px}
    .header h1{font-size:22px;font-weight:700}
    .header p{font-size:13px;color:#aaa;margin-top:4px}

    .container{max-width:900px;margin:0 auto;padding:20px}

    .card{
      background:#fff;border:1px solid #ddd;border-radius:8px;
      padding:24px;margin-bottom:20px;
    }
    .card h2{
      font-size:16px;margin-bottom:16px;padding-bottom:12px;
      border-bottom:1px solid #eee;
    }

    .form-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
    .form-group{flex:1;min-width:180px}
    .form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#555}
    input,select{
      width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:6px;
      font-size:14px;outline:none;
    }
    input:focus,select:focus{border-color:#1a1a2e}

    .btn{
      padding:10px 28px;border:none;border-radius:6px;font-size:14px;
      font-weight:600;cursor:pointer;transition:background .2s;
    }
    .btn-primary{background:#1a1a2e;color:#fff}
    .btn-primary:hover{background:#16213e}
    .btn-ghost{background:#fff;border:1px solid #ccc;color:#333}
    .btn-danger{background:#fff;border:1px solid #e74c3c;color:#e74c3c}

    .muted{color:#888;font-size:12px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

    /* === 내 트랙 카드 === */
    .track-item{padding:12px 0;border-bottom:1px solid #eee}
    .track-item:last-child{border-bottom:none}
    .track-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .track-title{font-weight:800;color:#1a1a2e}
    .track-sub{margin-top:4px;font-size:12px;color:#888}
    .track-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

    /* === 스샷형 미니 타임라인 === */
    .mini-wrap{margin-top:10px;overflow-x:auto;padding-bottom:6px}
    .mini-grid{display:flex;gap:10px;min-width:max-content}
    .mini-cell{
      width:66px;border:1px solid #eee;border-radius:10px;
      padding:8px 6px;background:#fafafa;text-align:center;cursor:pointer;
    }
    .mini-cell:hover{background:#f2f2f2}
    .mini-date{font-size:11px;color:#666;font-weight:700}
    .mini-rank{margin-top:6px;font-size:18px;font-weight:900;color:#4b56ff}
    .mini-out{color:#999}
    .mini-metric{margin-top:6px;font-size:10px;color:#888;line-height:14px}
    .mini-metric b{color:#555}
    .delta{font-size:11px;font-weight:900;margin-left:4px}
    .up{color:#e74c3c}
    .down{color:#3498db}
    .flat{color:#aaa}

    /* === 스냅샷 테이블 === */
    table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
    th{background:#f8f8f8;padding:8px 6px;text-align:left;font-weight:600;border-bottom:2px solid #ddd;position:sticky;top:0}
    td{padding:8px 6px;border-bottom:1px solid #eee;vertical-align:top}
    .hl{background:#fff9c4}
    .num{text-align:right}
    .note{margin-top:10px;padding:10px;border:1px dashed #ddd;border-radius:10px;background:#fafafa;font-size:12px;color:#777}

    @media(max-width:600px){
      .form-row{flex-direction:column}
      .form-group{min-width:100%}
      .mini-cell{width:62px}
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-inner">
      <h1>플레이스 추적</h1>
      <p>트랙 추가 시 즉시 1회 수집, 이후 매일 KST 12:00 자동 저장</p>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h2>설정</h2>
      <div class="muted">workspaceId: <span class="mono" id="ws"></span></div>
      <div class="muted">API: <span class="mono" id="apiLabel"></span></div>
      <div style="margin-top:12px;">
        <a class="btn btn-ghost" href="./index.html" style="text-decoration:none;display:inline-block;">실시간 조회로</a>
      </div>
    </div>

    <div class="card">
      <h2>트랙 추가</h2>
      <div class="form-row">
        <div class="form-group">
          <label>키워드</label>
          <input id="keyword" placeholder="예: 남영역맛집">
        </div>
        <div class="form-group">
          <label>대상 플레이스 ID</label>
          <input id="placeId" placeholder="예: 1951454277">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>도시(광역)</label>
          <select id="city"></select>
        </div>
        <div class="form-group">
          <label>구/군 (서울 선택 시)</label>
          <select id="district"></select>
        </div>
        <div class="form-group">
          <label>기기 타입</label>
          <select id="deviceType">
            <option value="pc" selected>pc</option>
            <option value="mobile">mobile</option>
          </select>
        </div>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <button class="btn btn-primary" id="btnAdd">추가 + 즉시 수집</button>
        <button class="btn btn-ghost" id="btnReload">목록 새로고침</button>
        <span class="muted" id="addStatus"></span>
      </div>
    </div>

    <div class="card">
      <h2>내 트랙</h2>
      <div id="tracks"></div>
      <div id="tracksEmpty" class="muted" style="display:none;padding:10px 0;">등록된 트랙이 없습니다.</div>
    </div>

    <div class="card" id="snapCard" style="display:none;">
      <h2 id="snapTitle">스냅샷</h2>
      <div class="muted" id="snapSub"></div>
      <div id="targetNote" class="note" style="display:none;"></div>

      <div style="overflow:auto;max-height:650px;">
        <table>
          <thead>
            <tr>
              <th>순위</th>
              <th>업체</th>
              <th>카테고리</th>
              <th class="num">블로그</th>
              <th class="num">방문자</th>
              <th class="num">저장</th>
              <th class="num">이미지</th>
              <th class="num">별점</th>
            </tr>
          </thead>
          <tbody id="snapBody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
  // 추적용 Worker (슬래시 X)
  const API_BASE = "https://ranktracker.dampd21.workers.dev";
  document.getElementById("apiLabel").textContent = API_BASE;

  // workspaceId
  const WS_KEY = "ranktracker_workspace_id";
  function getWS(){
    let v = localStorage.getItem(WS_KEY);
    if(!v){
      v = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random());
      localStorage.setItem(WS_KEY, v);
    }
    return v;
  }
  const workspaceId = getWS();
  document.getElementById("ws").textContent = workspaceId;

  // index에서 넘어온 값 자동 채움
  (function(){
    const qs = new URLSearchParams(location.search);
    const kw = qs.get("keyword") || "";
    const pid = qs.get("placeId") || "";
    if (kw) document.getElementById("keyword").value = kw;
    if (pid) document.getElementById("placeId").value = pid;
  })();

  function esc(s){ return s==null ? "" : String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function comma(n){ return (n==null) ? "-" : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function fmtRank(r){ return (r==null) ? "OUT" : String(r); }
  function fmtDelta(n){
    if(n==null) return "";
    if(n===0) return `<span class="delta flat">-</span>`;
    if(n>0) return `<span class="delta up">▲${Math.abs(n)}</span>`;
    return `<span class="delta down">▼${Math.abs(n)}</span>`;
  }
  function fmtDateLabel(dateStr){
    // "2026-02-28" -> "02.28 토"
    const d = new Date(dateStr + "T00:00:00+09:00");
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");
    const wk = ["일","월","화","수","목","금","토"][d.getDay()];
    return `${mm}.${dd} ${wk}`;
  }

  async function api(path, opts={}){
    const r = await fetch(API_BASE + path, {
      ...opts,
      headers: { "Content-Type":"application/json", ...(opts.headers||{}) }
    });
    const j = await r.json().catch(()=>null);
    if(!r.ok) throw new Error(j?.error || ("HTTP " + r.status));
    return j;
  }

  // 지역(서울 구만 예시)
  const REGIONS = {
    "서울": {
      city: { x:"126.9783882", y:"37.5666103" },
      districts: {
        "용산구": { x:"126.9903", y:"37.5324" },
        "강남구": { x:"127.0473", y:"37.5172" },
        "마포구": { x:"126.9016", y:"37.5663" },
        "영등포구": { x:"126.8963", y:"37.5264" }
      }
    },
    "부산": { city: { x:"129.0756", y:"35.1796" } }
  };

  const $city = document.getElementById("city");
  const $district = document.getElementById("district");

  function fillCities(){
    $city.innerHTML="";
    Object.keys(REGIONS).forEach(name=>{
      const opt=document.createElement("option");
      opt.value=name; opt.textContent=name;
      $city.appendChild(opt);
    });
    $city.value="서울";
  }
  function fillDistricts(){
    const ds = REGIONS[$city.value]?.districts || null;
    $district.innerHTML="";
    const opt0=document.createElement("option");
    opt0.value=""; opt0.textContent=ds ? "선택(권장)" : "해당없음";
    $district.appendChild(opt0);
    if(ds){
      Object.keys(ds).forEach(d=>{
        const opt=document.createElement("option");
        opt.value=d; opt.textContent=d;
        $district.appendChild(opt);
      });
    }
  }
  fillCities(); fillDistricts();
  $city.addEventListener("change", fillDistricts);

  async function loadSnapshot(trackId, date, targetPlaceId){
    const data = await api(`/api/snapshot?workspaceId=${encodeURIComponent(workspaceId)}&trackId=${trackId}&date=${encodeURIComponent(date)}`, { method:"GET", headers:{} });

    const snapCard = document.getElementById("snapCard");
    const snapTitle = document.getElementById("snapTitle");
    const snapSub = document.getElementById("snapSub");
    const snapBody = document.getElementById("snapBody");
    const targetNote = document.getElementById("targetNote");

    snapCard.style.display="block";

    if(!data.snapshot){
      snapTitle.textContent = `스냅샷: ${date}`;
      snapSub.textContent = "해당 날짜 데이터가 없습니다.";
      snapBody.innerHTML = "";
      targetNote.style.display="none";
      return;
    }

    snapTitle.textContent = `스냅샷: ${data.snapshot.base_date}`;
    snapSub.textContent = `전일 기준: ${data.prevDate || "-"} · 대상 순위: ${(data.snapshot.target_rank==null) ? "50위권 밖" : (data.snapshot.target_rank+"위")}`;

    let targetIn = false;
    snapBody.innerHTML = "";

    (data.items || []).forEach(it=>{
      const isT = String(it.place_id) === String(targetPlaceId);
      if(isT) targetIn = true;

      const tr = document.createElement("tr");
      if(isT) tr.className = "hl";

      tr.innerHTML = `
        <td class="num"><b>${it.rank}</b> ${it.delta ? fmtDelta(it.delta.rankDelta) : ""}</td>
        <td>
          <div><b>${esc(it.name||"-")}</b>${isT ? ' <span class="pill">대상</span>' : ''}</div>
          <div class="muted mono">${esc(it.place_id)}</div>
        </td>
        <td>${esc(it.category||"-")}</td>
        <td class="num">${comma(it.blog_count ?? 0)}</td>
        <td class="num">${comma(it.visitor_count ?? 0)}</td>
        <td class="num">${comma(it.save_count ?? 0)}</td>
        <td class="num">${comma(it.image_count ?? 0)}</td>
        <td class="num">${(it.score ?? "-")}</td>
      `;
      snapBody.appendChild(tr);
    });

    if(!targetIn){
      targetNote.style.display="block";
      targetNote.innerHTML = `대상 업체(placeId <span class="mono">${esc(targetPlaceId)}</span>)는 이 날짜에 <b>Top50에 없습니다</b>.`;
    }else{
      targetNote.style.display="none";
    }
  }

  async function renderTrackMiniTimeline(track, mountEl){
    // 최근 14일만 미니 타임라인으로
    const data = await api(`/api/timeline?workspaceId=${encodeURIComponent(workspaceId)}&trackId=${track.id}&limit=14`, { method:"GET", headers:{} });
    const tl = data.timeline || [];

    const miniWrap = document.createElement("div");
    miniWrap.className = "mini-wrap";
    const grid = document.createElement("div");
    grid.className = "mini-grid";

    tl.forEach(row=>{
      const cell = document.createElement("div");
      cell.className = "mini-cell";
      cell.innerHTML = `
        <div class="mini-date">${esc(fmtDateLabel(row.date))}</div>
        <div class="mini-rank ${row.targetRank==null ? 'mini-out' : ''}">
          ${esc(fmtRank(row.targetRank))}
          ${fmtDelta(row.rankDelta)}
        </div>
        <div class="mini-metric">
          <div><b>블</b> ${row.blogCount==null ? "-" : comma(row.blogCount)}</div>
          <div><b>방</b> ${row.visitorCount==null ? "-" : comma(row.visitorCount)}</div>
        </div>
      `;

      cell.onclick = () => loadSnapshot(track.id, row.date, track.target_place_id);
      grid.appendChild(cell);
    });

    miniWrap.appendChild(grid);
    mountEl.appendChild(miniWrap);

    // 최신 날짜 스냅샷 자동 로드(한 번)
    if (tl.length) {
      await loadSnapshot(track.id, tl[0].date, track.target_place_id);
    }
  }

  async function loadTracks(){
    const box = document.getElementById("tracks");
    const empty = document.getElementById("tracksEmpty");
    box.innerHTML = "";
    document.getElementById("snapCard").style.display = "none";

    const data = await api(`/api/tracks?workspaceId=${encodeURIComponent(workspaceId)}`, { method:"GET", headers:{} });
    const tracks = data.tracks || [];
    empty.style.display = tracks.length ? "none" : "block";

    // 트랙별 미니 타임라인 표시(트랙 수가 많으면 느릴 수 있음 -> 추후 bulk API로 개선 가능)
    for (const t of tracks) {
      const item = document.createElement("div");
      item.className = "track-item";

      const region = t.region_city + (t.region_district ? (" / " + t.region_district) : "");
      item.innerHTML = `
        <div class="track-head">
          <div>
            <div class="track-title">[${esc(region)}] ${esc(t.keyword)} <span class="mono">${esc(t.target_place_id)}</span></div>
            <div class="track-sub">좌표 x:${esc(t.x)} y:${esc(t.y)} / ${esc(t.device_type||"pc")}</div>
          </div>
          <div class="track-actions">
            <button class="btn btn-ghost" data-act="collect">수동수집</button>
            <button class="btn btn-danger" data-act="del">삭제</button>
          </div>
        </div>
        <div class="muted" style="margin-top:8px;">최근 14일 (날짜 클릭 → 해당일 Top50)</div>
        <div class="miniMount"></div>
      `;

      const collectBtn = item.querySelector('[data-act="collect"]');
      collectBtn.onclick = async () => {
        collectBtn.disabled = true;
        try {
          await api(`/api/collect?workspaceId=${encodeURIComponent(workspaceId)}&trackId=${t.id}`, { method:"POST", body:"{}" });
          await loadTracks();
        } catch (e) {
          alert("수집 실패: " + e.message);
        } finally {
          collectBtn.disabled = false;
        }
      };

      const delBtn = item.querySelector('[data-act="del"]');
      delBtn.onclick = async () => {
        if (!confirm("삭제할까요?")) return;
        await api(`/api/track?workspaceId=${encodeURIComponent(workspaceId)}&id=${t.id}`, { method:"DELETE", headers:{} });
        await loadTracks();
      };

      box.appendChild(item);

      // mini timeline 렌더링
      const mount = item.querySelector(".miniMount");
      try {
        await renderTrackMiniTimeline(t, mount);
      } catch (e) {
        mount.innerHTML = `<div class="muted" style="margin-top:10px;">타임라인 로드 실패: ${esc(e.message)}</div>`;
      }
    }
  }

  document.getElementById("btnReload").onclick = loadTracks;

  document.getElementById("btnAdd").onclick = async () => {
    const kw = document.getElementById("keyword").value.trim();
    const pid = document.getElementById("placeId").value.trim();
    const city = $city.value;
    const district = $district.value || null;
    const deviceType = document.getElementById("deviceType").value;
    const statusEl = document.getElementById("addStatus");

    if(!kw) return alert("키워드를 입력하세요.");
    if(!pid) return alert("플레이스 ID를 입력하세요.");

    let xy = null;
    if(city==="서울" && district && REGIONS["서울"].districts[district]) xy = REGIONS["서울"].districts[district];
    else xy = REGIONS[city]?.city;
    if(!xy) return alert("지역 좌표를 찾을 수 없습니다.");

    statusEl.textContent = "등록 중...";
    try {
      // 1) 등록
      const r = await api("/api/track", {
        method:"POST",
        body: JSON.stringify({
          workspaceId,
          keyword: kw,
          targetPlaceId: pid,
          regionCity: city,
          regionDistrict: district,
          x: xy.x,
          y: xy.y,
          deviceType
        })
      });

      // 2) 즉시 1회 수집
      statusEl.textContent = "등록 완료. 즉시 수집 중...";
      await api(`/api/collect?workspaceId=${encodeURIComponent(workspaceId)}&trackId=${r.id}`, { method:"POST", body:"{}" });

      statusEl.textContent = "완료: 오늘 데이터가 저장되었습니다.";
      await loadTracks();
    } catch (e) {
      statusEl.textContent = "실패: " + e.message;
      alert(e.message);
    }
  };

  loadTracks().catch(e => alert(e.message));
</script>
</body>
</html>
