<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>플레이스 추적</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#f5f5f5;color:#333;
}
.header{background:#1a1a2e;color:#fff;padding:20px 0}
.header-inner{max-width:900px;margin:0 auto;padding:0 20px}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.header h1{font-size:22px;font-weight:700}
.header p{font-size:13px;color:#aaa;margin-top:4px}
.menu-btn{width:38px;height:38px;border:1px solid rgba(255,255,255,0.25);background:transparent;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.menu-btn span{display:block;width:18px;height:2px;background:#fff;position:relative}
.menu-btn span:before,.menu-btn span:after{content:"";position:absolute;left:0;width:18px;height:2px;background:#fff}
.menu-btn span:before{top:-6px}
.menu-btn span:after{top:6px}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:none;z-index:9999}
.drawer-overlay.show{display:block}
.drawer{position:absolute;top:0;right:0;width:280px;height:100%;background:#fff;box-shadow:-10px 0 30px rgba(0,0,0,0.18);padding:16px}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid #eee;margin-bottom:10px}
.drawer-title{font-weight:800;color:#1a1a2e}
.drawer-close{border:none;background:none;font-size:22px;cursor:pointer;color:#666}
.drawer a{display:block;padding:12px 10px;border-radius:10px;color:#333;text-decoration:none;font-weight:700}
.drawer a:hover{background:#f5f5f5}
.drawer .mutedlink{font-size:12px;color:#888;font-weight:600;padding:0 10px 8px}
.container{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:24px;margin-bottom:20px}
.card h2{font-size:16px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #eee}
.form-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.form-group{flex:1;min-width:180px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#555}
input,select{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:6px;font-size:14px;outline:none}
input:focus,select:focus{border-color:#1a1a2e}
.btn{padding:10px 28px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s}
.btn-primary{background:#1a1a2e;color:#fff}
.btn-primary:hover{background:#16213e}
.btn-ghost{background:#fff;border:1px solid #ccc;color:#333}
.btn-danger{background:#fff;border:1px solid #e74c3c;color:#e74c3c}
.muted{color:#888;font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#f0f0f0;color:#555;font-size:11px;margin-left:6px}
.track-item{padding:14px 0;border-bottom:1px solid #eee}
.track-item:last-child{border-bottom:none}
.track-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.track-title{font-weight:800;color:#1a1a2e}
.track-sub{margin-top:4px;font-size:12px;color:#888}
.track-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mini-wrap{margin-top:10px;overflow-x:auto;padding-bottom:8px}
.mini-grid{display:flex;gap:10px;min-width:max-content}
.mini-cell{width:70px;border:1px solid #cfcfcf;border-radius:12px;padding:10px 8px;background:#fff;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,0.04);transition:transform .05s,box-shadow .15s,border-color .15s}
.mini-cell:hover{border-color:#9aa0a6;box-shadow:0 4px 10px rgba(0,0,0,0.08)}
.mini-cell.active{border-color:#1a1a2e;box-shadow:0 0 0 3px rgba(26,26,46,0.12)}
.mini-date{font-size:11px;color:#666;font-weight:800}
.mini-rank{margin-top:8px;font-size:20px;font-weight:900;color:#4b56ff;line-height:1}
.mini-out{color:#999}
.mini-metric{margin-top:8px;font-size:10px;color:#888;line-height:14px}
.mini-metric b{color:#555}
.delta{font-size:11px;font-weight:900;margin-left:4px}
.up{color:#e74c3c}
.down{color:#3498db}
.flat{color:#aaa}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
th{background:#f8f8f8;padding:8px 6px;text-align:left;font-weight:600;border-bottom:2px solid #ddd;position:sticky;top:0}
td{padding:8px 6px;border-bottom:1px solid #eee;vertical-align:top}
.hl{background:#fff9c4}
.num{text-align:right}
.note{margin-top:10px;padding:10px;border:1px dashed #ddd;border-radius:10px;background:#fafafa;font-size:12px;color:#777}
@media(max-width:600px){.form-row{flex-direction:column}.form-group{min-width:100%}.mini-cell{width:66px}}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-top">
      <h1>플레이스 추적</h1>
      <button class="menu-btn" id="btnMenu" aria-label="메뉴"><span></span></button>
    </div>
    <p>트랙 추가 시 즉시 1회 수집, 이후 매일 KST 12:00 자동 저장</p>
  </div>
</div>

<div class="drawer-overlay" id="drawer">
  <div class="drawer" role="dialog" aria-modal="true">
    <div class="drawer-head">
      <div class="drawer-title">메뉴</div>
      <button class="drawer-close" id="btnDrawerClose" aria-label="닫기">x</button>
    </div>
    <div class="mutedlink">페이지 이동</div>
    <a href="./index.html">실시간 조회</a>
    <a href="./tracker.html">플레이스 추적</a>
  </div>
</div>

<div class="container">
  <div class="card">
    <h2>트랙 추가</h2>
    <div class="form-row">
      <div class="form-group">
        <label>업종</label>
        <select id="selectKind">
          <option value="restaurant">식당/카페</option>
          <option value="hairshop">미용실(헤어샵)</option>
          <option value="nailshop">네일</option>
          <option value="hospital">병원</option>
          <option value="accommodation">펜션/숙박</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>키워드</label>
        <input id="keyword" placeholder="예: 강남역맛집, 마곡미용실">
      </div>
      <div class="form-group">
        <label>대상 플레이스 ID</label>
        <input id="placeId" placeholder="예: 1951454277">
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <button class="btn btn-primary" id="btnAdd">추가 + 즉시 수집</button>
      <button class="btn btn-ghost" id="btnReload">목록 새로고침</button>
      <span class="muted" id="addStatus"></span>
    </div>
  </div>

  <div class="card">
    <h2>내 트랙</h2>
    <div id="tracks"></div>
    <div id="tracksEmpty" class="muted" style="display:none;padding:10px 0;">등록된 트랙이 없습니다.</div>
  </div>

  <!-- 스냅샷 -->
  <div class="card" id="snapCard" style="display:none;">
    <h2 id="snapTitle">스냅샷</h2>
    <div class="muted" id="snapSub"></div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
      <button class="btn btn-primary" id="btnOpenDash">리뷰 대시보드 보기(Top50)</button>
    </div>

    <div id="targetNote" class="note" style="display:none;"></div>
    <div style="overflow:auto;max-height:650px;">
      <table>
        <thead>
          <tr>
            <th>순위</th><th>업체</th><th>카테고리</th>
            <th class="num">블로그</th><th class="num">방문자</th>
            <th class="num">저장</th><th class="num">이미지</th><th class="num">별점</th>
          </tr>
        </thead>
        <tbody id="snapBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 리뷰 대시보드(Top50) -->
  <div class="card" id="dashCard" style="display:none;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
      <h2 id="dashTitle">리뷰 대시보드</h2>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-ghost" id="btnDashBack">← 뒤로(스냅샷)</button>
        <button class="btn btn-ghost" id="btnDashDownload">HTML 다운로드</button>
      </div>
    </div>

    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px;">
      <button class="btn btn-ghost" id="btnRange7">7일</button>
      <button class="btn btn-ghost" id="btnRange30">30일</button>
      <button class="btn btn-ghost" id="btnRangeCustom">직접입력</button>
      <span class="muted" id="dashRangeText"></span>
    </div>

    <div id="dashCustom" style="display:none; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px;">
      <input id="dashStart" placeholder="YYYY-MM-DD" />
      <input id="dashEnd" placeholder="YYYY-MM-DD" />
      <button class="btn btn-primary" id="btnDashRunCustom">적용</button>
    </div>

    <div class="muted" id="dashProgress" style="margin-bottom:10px;"></div>

    <div style="overflow:auto; max-height:650px;">
      <table>
        <thead>
          <tr>
            <th>순위</th><th>업체</th>
            <th class="num">스냅샷(블/방/저/이미지)</th>
            <th class="num">리뷰수</th>
            <th class="num">리뷰어</th>
            <th class="num">성별(M/F)</th>
            <th class="num">긍정률</th>
            <th>키워드(긍정 Top3)</th>
            <th>상태</th>
          </tr>
        </thead>
        <tbody id="dashBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // Worker B (ranktracker)
  var API_BASE = "https://ranktracker.dampd21.workers.dev";

  // Worker C (naverdashboard: 리뷰통계)
  var DASH_BASE = "https://naverdashboard.dampd21.workers.dev";

  // 기본 좌표 (서울시청)
  var DEFAULT_X = "126.9783882";
  var DEFAULT_Y = "37.5666103";

  var WS_KEY = "ranktracker_workspace_id";
  function getWS(){
    var v = localStorage.getItem(WS_KEY);
    if(!v){
      v = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random());
      localStorage.setItem(WS_KEY, v);
    }
    return v;
  }
  var workspaceId = getWS();

  (function(){
    var qs = new URLSearchParams(location.search);
    if (qs.get("kind")) document.getElementById("selectKind").value = qs.get("kind");
    if (qs.get("keyword")) document.getElementById("keyword").value = qs.get("keyword");
    if (qs.get("placeId")) document.getElementById("placeId").value = qs.get("placeId");
  })();

  var drawer = document.getElementById("drawer");
  document.getElementById("btnMenu").onclick = function(){ drawer.classList.add("show"); };
  document.getElementById("btnDrawerClose").onclick = function(){ drawer.classList.remove("show"); };
  drawer.onclick = function(e){ if(e.target===drawer) drawer.classList.remove("show"); };

  function esc(s){ return s==null ? "" : String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function comma(n){ return (n==null) ? "-" : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function fmtRank(r){ return (r==null) ? "OUT" : String(r); }
  function fmtDelta(n){
    if(n==null) return "";
    if(n===0) return '<span class="delta flat">-</span>';
    if(n>0) return '<span class="delta up">&#9650;' + Math.abs(n) + '</span>';
    return '<span class="delta down">&#9660;' + Math.abs(n) + '</span>';
  }
  function fmtDateLabel(dateStr){
    var d = new Date(dateStr + "T00:00:00+09:00");
    var mm = String(d.getMonth()+1).padStart(2,"0");
    var dd = String(d.getDate()).padStart(2,"0");
    var wk = ["일","월","화","수","목","금","토"][d.getDay()];
    return mm + "." + dd + " " + wk;
  }
  function kindLabel(k) {
    var m = { restaurant:"식당/카페", hairshop:"미용실", nailshop:"네일", hospital:"병원", accommodation:"숙박" };
    return m[k] || k;
  }

  function api(path, opts){
    opts = opts || {};
    var base = API_BASE.replace(/\/+$/, "");
    return fetch(base + path, {
      method: opts.method || "GET",
      headers: { "Content-Type":"application/json" },
      body: opts.body || undefined
    }).then(function(r){
      return r.json().then(function(j){
        if(!r.ok) throw new Error(j.error || ("HTTP " + r.status));
        return j;
      });
    });
  }

  // ===== 스냅샷 로딩 =====
  var currentSnap = { track: null, date: null, items: [], targetPlaceId: null };

  function loadSnapshot(trackId, date, targetPlaceId){
    return api("/api/snapshot?workspaceId=" + encodeURIComponent(workspaceId) + "&trackId=" + trackId + "&date=" + encodeURIComponent(date)).then(function(data){
      var snapCard = document.getElementById("snapCard");
      var snapTitle = document.getElementById("snapTitle");
      var snapSub = document.getElementById("snapSub");
      var snapBody = document.getElementById("snapBody");
      var targetNote = document.getElementById("targetNote");
      snapCard.style.display="block";

      if(!data.snapshot){
        snapTitle.textContent = "스냅샷: " + date;
        snapSub.textContent = "해당 날짜 데이터가 없습니다.";
        snapBody.innerHTML = "";
        targetNote.style.display="none";

        currentSnap.track = { id: trackId };
        currentSnap.date = date;
        currentSnap.items = [];
        currentSnap.targetPlaceId = targetPlaceId;
        return;
      }

      snapTitle.textContent = "스냅샷: " + data.snapshot.base_date;
      snapSub.textContent = "전일 기준: " + (data.prevDate || "-") + " / 대상 순위: " + ((data.snapshot.target_rank==null) ? "50위권 밖" : (data.snapshot.target_rank+"위"));

      var targetIn = false;
      snapBody.innerHTML = "";
      (data.items || []).forEach(function(it){
        var isT = String(it.place_id) === String(targetPlaceId);
        if(isT) targetIn = true;
        var tr = document.createElement("tr");
        if(isT) tr.className = "hl";
        tr.innerHTML =
          '<td class="num"><b>' + it.rank + '</b> ' + (it.delta ? fmtDelta(it.delta.rankDelta) : "") + '</td>' +
          '<td><div><b>' + esc(it.name||"-") + '</b>' + (isT ? ' <span class="pill">대상</span>' : '') + '</div><div class="muted mono">' + esc(it.place_id) + '</div></td>' +
          '<td>' + esc(it.category||"-") + '</td>' +
          '<td class="num">' + comma(it.blog_count || 0) + '</td>' +
          '<td class="num">' + comma(it.visitor_count || 0) + '</td>' +
          '<td class="num">' + comma(it.save_count || 0) + '</td>' +
          '<td class="num">' + comma(it.image_count || 0) + '</td>' +
          '<td class="num">' + (it.score || "-") + '</td>';
        snapBody.appendChild(tr);
      });

      if(!targetIn){
        targetNote.style.display="block";
        targetNote.innerHTML = '대상 업체(placeId <span class="mono">' + esc(targetPlaceId) + '</span>)는 이 날짜에 <b>Top50에 없습니다</b>.';
      } else {
        targetNote.style.display="none";
      }

      // ✅ 대시보드 기준 상태 저장(스냅샷 기반)
      currentSnap.track = { id: trackId };
      currentSnap.date = data.snapshot.base_date;
      currentSnap.items = data.items || [];
      currentSnap.targetPlaceId = targetPlaceId;
    });
  }

  // ===== 타임라인 =====
  function renderTrackMiniTimeline(track, mountEl){
    return api("/api/timeline?workspaceId=" + encodeURIComponent(workspaceId) + "&trackId=" + track.id + "&limit=14").then(function(data){
      var tl = data.timeline || [];
      var miniWrap = document.createElement("div");
      miniWrap.className = "mini-wrap";
      var grid = document.createElement("div");
      grid.className = "mini-grid";

      var setActive = function(date) {
        var cells = grid.querySelectorAll(".mini-cell");
        for (var i = 0; i < cells.length; i++) cells[i].classList.remove("active");
        var active = grid.querySelector('.mini-cell[data-date="' + date + '"]');
        if (active) active.classList.add("active");
      };

      tl.forEach(function(row){
        var cell = document.createElement("div");
        cell.className = "mini-cell";
        cell.setAttribute("data-date", row.date);
        cell.innerHTML =
          '<div class="mini-date">' + esc(fmtDateLabel(row.date)) + '</div>' +
          '<div class="mini-rank ' + (row.targetRank==null ? 'mini-out' : '') + '">' +
            esc(fmtRank(row.targetRank)) +
            fmtDelta(row.rankDelta) +
          '</div>' +
          '<div class="mini-metric">' +
            '<div><b>블</b> ' + (row.blogCount==null ? "-" : comma(row.blogCount)) + '</div>' +
            '<div><b>방</b> ' + (row.visitorCount==null ? "-" : comma(row.visitorCount)) + '</div>' +
          '</div>';
        cell.onclick = function() {
          setActive(row.date);
          loadSnapshot(track.id, row.date, track.target_place_id);
        };
        grid.appendChild(cell);
      });

      miniWrap.appendChild(grid);
      mountEl.appendChild(miniWrap);

      if (tl.length) {
        setActive(tl[0].date);
        return loadSnapshot(track.id, tl[0].date, track.target_place_id);
      }
    });
  }

  function loadTracks(){
    var box = document.getElementById("tracks");
    var empty = document.getElementById("tracksEmpty");
    box.innerHTML = "";
    document.getElementById("snapCard").style.display = "none";
    document.getElementById("dashCard").style.display = "none";

    return api("/api/tracks?workspaceId=" + encodeURIComponent(workspaceId)).then(function(data){
      var tracks = data.tracks || [];
      empty.style.display = tracks.length ? "none" : "block";

      var chain = Promise.resolve();
      tracks.forEach(function(t) {
        chain = chain.then(function() {
          var item = document.createElement("div");
          item.className = "track-item";
          var kl = kindLabel(t.kind || "restaurant");

          item.innerHTML =
            '<div class="track-head">' +
              '<div>' +
                '<div class="track-title">[' + esc(kl) + '] ' + esc(t.keyword) + ' <span class="mono">' + esc(t.target_place_id) + '</span></div>' +
                '<div class="track-sub">최근 14일 (날짜 클릭 -> 해당일 Top50)</div>' +
              '</div>' +
              '<div class="track-actions">' +
                '<button class="btn btn-ghost" data-act="collect">수동수집</button>' +
                '<button class="btn btn-danger" data-act="del">삭제</button>' +
              '</div>' +
            '</div>' +
            '<div class="miniMount"></div>';

          var collectBtn = item.querySelector('[data-act="collect"]');
          collectBtn.onclick = function() {
            collectBtn.disabled = true;
            api("/api/collect?workspaceId=" + encodeURIComponent(workspaceId) + "&trackId=" + t.id, { method:"POST", body:"{}" })
              .then(function(){ return loadTracks(); })
              .catch(function(e){ alert("수집 실패: " + e.message); })
              .then(function(){ collectBtn.disabled = false; });
          };

          var delBtn = item.querySelector('[data-act="del"]');
          delBtn.onclick = function() {
            if (!confirm("삭제할까요?")) return;
            api("/api/track?workspaceId=" + encodeURIComponent(workspaceId) + "&id=" + t.id, { method:"DELETE" })
              .then(function(){ return loadTracks(); });
          };

          box.appendChild(item);
          var mount = item.querySelector(".miniMount");
          return renderTrackMiniTimeline(t, mount).catch(function(e){
            mount.innerHTML = '<div class="muted" style="margin-top:10px;">타임라인 로드 실패: ' + esc(e.message) + '</div>';
          });
        });
      });
      return chain;
    });
  }

  document.getElementById("btnReload").onclick = function(){ loadTracks(); };

  document.getElementById("btnAdd").onclick = function() {
    var kind = document.getElementById("selectKind").value;
    var kw = document.getElementById("keyword").value.trim();
    var pid = document.getElementById("placeId").value.trim();
    var statusEl = document.getElementById("addStatus");

    if(!kw){ alert("키워드를 입력하세요."); return; }
    if(!pid){ alert("플레이스 ID를 입력하세요."); return; }

    statusEl.textContent = "등록 중...";
    api("/api/track", {
      method:"POST",
      body: JSON.stringify({
        workspaceId: workspaceId,
        kind: kind,
        keyword: kw,
        targetPlaceId: pid,
        regionCity: "서울",
        regionDistrict: null,
        x: DEFAULT_X,
        y: DEFAULT_Y,
        deviceType: "pc"
      })
    }).then(function(r){
      statusEl.textContent = "등록 완료. 즉시 수집 중...";
      return api("/api/collect?workspaceId=" + encodeURIComponent(workspaceId) + "&trackId=" + r.id, { method:"POST", body:"{}" });
    }).then(function(){
      statusEl.textContent = "완료: 오늘 데이터가 저장되었습니다.";
      return loadTracks();
    }).catch(function(e){
      statusEl.textContent = "실패: " + e.message;
      alert(e.message);
    });
  };

  // ====== Top50 리뷰 대시보드 ======
  var lastDash = { range: null, rows: [] };

  function ymd(d){
    var yyyy = d.getFullYear();
    var mm = String(d.getMonth()+1).padStart(2,"0");
    var dd = String(d.getDate()).padStart(2,"0");
    return yyyy + "-" + mm + "-" + dd;
  }
  function calcRange(days){
    var now = new Date();
    var end = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1); // 오늘 미포함: 어제
    var start = new Date(end.getFullYear(), end.getMonth(), end.getDate() - (days - 1));
    return { startDate: ymd(start), endDate: ymd(end) };
  }
  function isYMD(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s||"")); }

  function sumReferrers(arr){
    arr = arr || [];
    var sum = 0;
    for (var i=0;i<arr.length;i++) sum += (arr[i].value || 0);
    return sum;
  }
  function computeSentiment(themes){
    themes = themes || [];
    var pos = 0, neg = 0;
    for (var i=0;i<themes.length;i++){
      var t = themes[i];
      if (t.name === "total" && t.preference === "positive") pos += (t.value||0);
      if (t.name === "total" && t.preference === "negative") neg += (t.value||0);
    }
    var den = pos + neg;
    if (!den) return null;
    return Math.round((pos/den)*1000)/10; // 0.1%
  }
  function topKeywords(themes){
    themes = themes || [];
    var pos = themes.filter(function(t){
      return t.preference === "positive" && t.name !== "total" && (t.value||0) > 0;
    });
    pos.sort(function(a,b){ return (b.value||0)-(a.value||0); });
    return pos.slice(0,3).map(function(t){ return t.name + "(" + t.value + ")"; }).join(", ");
  }

  function apiDashStats(businessId, startDate, endDate){
    var u = DASH_BASE.replace(/\/+$/,"") + "/stats?businessId=" + encodeURIComponent(businessId)
      + "&startDate=" + encodeURIComponent(startDate)
      + "&endDate=" + encodeURIComponent(endDate);
    return fetch(u, { method:"GET" }).then(function(r){
      return r.json().then(function(j){
        if(!r.ok || !j.ok) throw new Error(j.error || ("HTTP " + r.status));
        return j.data;
      });
    });
  }

  // 동시성 제한 큐
  function runQueue(list, concurrency, workerFn, onProgress){
    var idx = 0, active = 0, done = 0;
    return new Promise(function(resolve){
      function next(){
        while(active < concurrency && idx < list.length){
          (function(item){
            active++;
            workerFn(item).catch(function(){})
              .then(function(){
                active--; done++;
                if(onProgress) onProgress(done, list.length);
                if(done >= list.length) resolve();
                else next();
              });
          })(list[idx++]);
        }
      }
      next();
    });
  }

  function showDash(){ document.getElementById("dashCard").style.display="block"; document.getElementById("snapCard").style.display="none"; }
  function hideDash(){ document.getElementById("dashCard").style.display="none"; document.getElementById("snapCard").style.display="block"; }
  function setProgress(txt){ document.getElementById("dashProgress").textContent = txt; }

  function buildDashRows(snapshotItems){
    var body = document.getElementById("dashBody");
    body.innerHTML = "";

    lastDash.rows = snapshotItems.map(function(it){
      return {
        rank: it.rank,
        place_id: it.place_id,
        name: it.name,
        category: it.category,
        blog_count: it.blog_count||0,
        visitor_count: it.visitor_count||0,
        save_count: it.save_count||0,
        image_count: it.image_count||0,
        status: "waiting",
        stats: null,
        error: null
      };
    });

    lastDash.rows.forEach(function(r){
      var tr = document.createElement("tr");
      tr.id = "dashRow_" + r.rank;

      tr.innerHTML =
        '<td class="num"><b>' + r.rank + '</b></td>' +
        '<td><div><b>' + esc(r.name||"-") + '</b></div><div class="muted mono">' + esc(r.place_id) + '</div></td>' +
        '<td class="num">' + comma(r.blog_count) + ' / ' + comma(r.visitor_count) + ' / ' + comma(r.save_count) + ' / ' + comma(r.image_count) + '</td>' +
        '<td class="num" data-k="reviews">-</td>' +
        '<td class="num" data-k="reviewers">-</td>' +
        '<td class="num" data-k="gender">-</td>' +
        '<td class="num" data-k="sent">-</td>' +
        '<td data-k="kw">-</td>' +
        '<td data-k="st"><span class="muted">대기</span></td>';

      body.appendChild(tr);
    });
  }

  function updateDashRow(rank, patch){
    var tr = document.getElementById("dashRow_" + rank);
    if(!tr) return;

    if(patch.status === "loading"){
      tr.querySelector('[data-k="st"]').innerHTML = '<span class="muted">로딩중...</span>';
      return;
    }
    if(patch.status === "error"){
      tr.querySelector('[data-k="st"]').innerHTML = '<span style="color:#e74c3c;font-weight:800;">실패</span> <span class="muted">' + esc(patch.error||"") + '</span>';
      return;
    }
    if(patch.status === "success"){
      var s = patch.stats;
      var totalReviews = sumReferrers(s.reviews && s.reviews.referrers);
      var totalReviewers = sumReferrers(s.reviewers && s.reviewers.referrers);
      var sent = computeSentiment(s.themes);
      var kw = topKeywords(s.themes);

      tr.querySelector('[data-k="reviews"]').textContent = comma(totalReviews);
      tr.querySelector('[data-k="reviewers"]').textContent = comma(totalReviewers);
      tr.querySelector('[data-k="gender"]').textContent = (s.charactersRatio?.male ?? "-") + "/" + (s.charactersRatio?.female ?? "-");
      tr.querySelector('[data-k="sent"]').textContent = (sent==null) ? "-" : (sent + "%");
      tr.querySelector('[data-k="kw"]').textContent = kw || "-";
      tr.querySelector('[data-k="st"]').innerHTML = '<span style="color:#2ecc71;font-weight:900;">완료</span>';
    }
  }

  function runDashboard(range){
    if(!currentSnap.items || currentSnap.items.length === 0){
      alert("먼저 스냅샷을 선택하세요.");
      return;
    }

    lastDash.range = range;
    document.getElementById("dashTitle").textContent =
      "리뷰 대시보드 (Top" + currentSnap.items.length + ") - " + (currentSnap.date || "");

    document.getElementById("dashRangeText").textContent =
      "기간: " + range.startDate + " ~ " + range.endDate + " (오늘 미포함)";

    showDash();
    buildDashRows(currentSnap.items);
    setProgress("0 / " + currentSnap.items.length);

    var okCnt = 0, failCnt = 0;

    runQueue(
      lastDash.rows,
      5, // ✅ 동시성 5
      function(row){
        updateDashRow(row.rank, { status:"loading" });

        return apiDashStats(row.place_id, range.startDate, range.endDate)
          .then(function(stats){
            row.status = "success";
            row.stats = stats;
            okCnt++;
            updateDashRow(row.rank, { status:"success", stats: stats });
          })
          .catch(function(e){
            row.status = "error";
            row.error = e.message;
            failCnt++;
            updateDashRow(row.rank, { status:"error", error: e.message });
          });
      },
      function(done, total){
        setProgress(done + " / " + total + " (성공 " + okCnt + ", 실패 " + failCnt + ")");
      }
    );
  }

  document.getElementById("btnDashBack").onclick = function(){ hideDash(); };

  document.getElementById("btnRange7").onclick = function(){ runDashboard(calcRange(7)); };
  document.getElementById("btnRange30").onclick = function(){ runDashboard(calcRange(30)); };

  document.getElementById("btnRangeCustom").onclick = function(){
    var box = document.getElementById("dashCustom");
    box.style.display = (box.style.display === "none" ? "flex" : "none");
  };

  document.getElementById("btnDashRunCustom").onclick = function(){
    var s = document.getElementById("dashStart").value.trim();
    var e = document.getElementById("dashEnd").value.trim();
    if(!isYMD(s) || !isYMD(e)) return alert("YYYY-MM-DD 형식으로 입력하세요.");
    runDashboard({ startDate: s, endDate: e });
  };

  document.getElementById("btnOpenDash").onclick = function(){
    runDashboard(calcRange(7)); // 기본 7일
  };

  document.getElementById("btnDashDownload").onclick = function(){
    if(!lastDash.rows || !lastDash.rows.length) return alert("다운로드할 데이터가 없습니다.");

    var title = "dashboard_" + (currentSnap.date || "snapshot") + "_" + (lastDash.range?.startDate || "") + "_" + (lastDash.range?.endDate || "");
    var rows = lastDash.rows;

    var html = '<!doctype html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>' +
      '<title>' + esc(title) + '</title>' +
      '<style>body{font-family:system-ui,Segoe UI,Malgun Gothic,sans-serif;padding:18px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid #eee;padding:8px;text-align:left}th{background:#f7f7f7;position:sticky;top:0}</style>' +
      '</head><body>' +
      '<h2>리뷰 대시보드</h2>' +
      '<div>스냅샷: ' + esc(currentSnap.date) + ' / 기간: ' + esc(lastDash.range.startDate) + ' ~ ' + esc(lastDash.range.endDate) + '</div>' +
      '<br/>' +
      '<table><thead><tr><th>순위</th><th>업체</th><th>placeId</th><th>스냅샷(블/방/저/이미지)</th><th>리뷰수</th><th>리뷰어</th><th>M/F</th><th>긍정률</th><th>키워드</th><th>상태</th></tr></thead><tbody>';

    rows.forEach(function(r){
      var s = r.stats;
      var totalReviews = s ? sumReferrers(s.reviews && s.reviews.referrers) : "-";
      var totalReviewers = s ? sumReferrers(s.reviewers && s.reviewers.referrers) : "-";
      var gender = s ? ((s.charactersRatio?.male ?? "-") + "/" + (s.charactersRatio?.female ?? "-")) : "-";
      var sent = s ? computeSentiment(s.themes) : null;
      var kw = s ? topKeywords(s.themes) : "-";

      html += '<tr>' +
        '<td>' + r.rank + '</td>' +
        '<td>' + esc(r.name||"") + '</td>' +
        '<td>' + esc(r.place_id||"") + '</td>' +
        '<td>' + esc((r.blog_count||0) + "/" + (r.visitor_count||0) + "/" + (r.save_count||0) + "/" + (r.image_count||0)) + '</td>' +
        '<td>' + esc(String(totalReviews)) + '</td>' +
        '<td>' + esc(String(totalReviewers)) + '</td>' +
        '<td>' + esc(String(gender)) + '</td>' +
        '<td>' + esc(sent==null ? "-" : (sent + "%")) + '</td>' +
        '<td>' + esc(kw) + '</td>' +
        '<td>' + esc(r.status) + '</td>' +
      '</tr>';
    });

    html += '</tbody></table></body></html>';

    var blob = new Blob([html], {type:"text/html;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = title + ".html";
    a.click();
  };
  // ======

  loadTracks().catch(function(e){ alert(e.message); });
</script>
