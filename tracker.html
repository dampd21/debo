<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>플레이스 순위 추적기 (Top50)</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#222}
    .header{background:#1a1a2e;color:#fff;padding:18px 0}
    .header-inner{max-width:1100px;margin:0 auto;padding:0 16px}
    .header h1{margin:0;font-size:18px}
    .header p{margin:6px 0 0;color:#bdbdbd;font-size:12px}

    .container{max-width:1100px;margin:0 auto;padding:16px}
    .card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px;margin-bottom:12px}
    h2{margin:0 0 10px;font-size:14px}
    label{display:block;font-size:12px;font-weight:700;color:#555;margin-bottom:6px}
    input,select{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:8px;font-size:14px;outline:none}
    input:focus,select:focus{border-color:#1a1a2e}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .col{flex:1;min-width:220px}

    .btn{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;font-weight:800;font-size:13px}
    .btn-primary{background:#1a1a2e;color:#fff}
    .btn-ghost{background:#fff;border:1px solid #ccc;color:#333}
    .btn-danger{background:#fff;border:1px solid #e74c3c;color:#e74c3c}
    .btn:disabled{opacity:.6;cursor:not-allowed}

    .muted{color:#888;font-size:12px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#f0f0f0;color:#555;font-size:11px;margin-left:6px}

    .list .item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
    .list .item:last-child{border-bottom:0}
    .actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

    .timeline{display:flex;flex-direction:column;gap:8px}
    .trow{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid #eee;border-radius:10px;background:#fafafa;cursor:pointer}
    .trow:hover{background:#f3f3f3}
    .rank{font-weight:900}
    .delta{font-size:12px;font-weight:900;margin-left:6px}
    .up{color:#e74c3c}
    .down{color:#1f77b4}
    .flat{color:#999}

    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{padding:8px 6px;border-bottom:1px solid #eee;vertical-align:top}
    th{position:sticky;top:0;background:#f8f8f8;text-align:left}
    .num{text-align:right}
    .hl{background:#fff9c4}
    .small{font-size:11px;color:#777}
    .note{padding:10px;background:#fafafa;border:1px dashed #ddd;border-radius:10px}

    @media (max-width:700px){
      .col{min-width:100%}
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-inner">
      <h1>플레이스 순위 추적기 (Top50)</h1>
      <p>트랙 등록 → 즉시 1회 실시간 수집 → 이후 매일 KST 12:00 자동 저장(Cron)</p>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h2>설정</h2>
      <div class="muted">workspaceId: <span class="mono" id="ws"></span></div>
      <div class="muted">추적 API: <span class="mono" id="apiLabel"></span></div>
      <div style="margin-top:10px">
        <a class="btn btn-ghost" href="./index.html">실시간 조회 페이지로</a>
      </div>
    </div>

    <div class="card">
      <h2>트랙 추가</h2>
      <div class="row">
        <div class="col">
          <label>키워드</label>
          <input id="keyword" placeholder="예: 남영역맛집">
        </div>
        <div class="col">
          <label>대상 플레이스 ID</label>
          <input id="placeId" placeholder="예: 1951454277">
        </div>
      </div>

      <div class="row" style="margin-top:10px;">
        <div class="col">
          <label>도시(광역)</label>
          <select id="city"></select>
        </div>
        <div class="col">
          <label>구/군 (서울 선택 시)</label>
          <select id="district"></select>
        </div>
        <div class="col">
          <label>기기 타입</label>
          <select id="deviceType">
            <option value="pc" selected>pc</option>
            <option value="mobile">mobile</option>
          </select>
        </div>
      </div>

      <div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <button class="btn btn-primary" id="btnAdd">추가 + 즉시 수집</button>
        <button class="btn btn-ghost" id="btnReload">목록 새로고침</button>
        <span class="muted">추가 시 오늘 Top50을 바로 저장합니다.</span>
      </div>

      <div id="addStatus" class="muted" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <h2>내 트랙 목록</h2>
      <div id="tracks" class="list"></div>
      <div id="tracksEmpty" class="muted" style="display:none;padding:10px 0;">등록된 트랙이 없습니다.</div>
    </div>

    <div class="card" id="timelineCard" style="display:none;">
      <h2 id="timelineTitle">타임라인</h2>
      <div class="muted" id="timelineSub" style="margin-bottom:10px;"></div>
      <div id="timeline" class="timeline"></div>
    </div>

    <div class="card" id="snapCard" style="display:none;">
      <h2 id="snapTitle">스냅샷</h2>
      <div class="muted" id="snapSub" style="margin-bottom:10px;"></div>
      <div class="note" id="targetNote" style="display:none;margin-bottom:10px;"></div>
      <div style="overflow:auto;max-height:650px;">
        <table>
          <thead>
            <tr>
              <th>순위</th>
              <th>업체</th>
              <th>카테고리</th>
              <th class="num">블로그</th>
              <th class="num">방문자</th>
              <th class="num">저장</th>
              <th class="num">이미지</th>
              <th class="num">별점</th>
            </tr>
          </thead>
          <tbody id="snapBody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
/** =========================
 *  1) 여기에 추적용 Worker 주소 넣기
 *  ========================= */
const API_BASE = "https://ranktracker.dampd21.workers.dev";
document.getElementById("apiLabel").textContent = API_BASE;

/** workspaceId (로그인 대신) */
const WS_KEY = "ranktracker_workspace_id";
function getWS(){
  let v = localStorage.getItem(WS_KEY);
  if(!v){
    v = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random());
    localStorage.setItem(WS_KEY, v);
  }
  return v;
}
const workspaceId = getWS();
document.getElementById("ws").textContent = workspaceId;

/** 지역 좌표(필요한 만큼 늘리면 됨) */
const REGIONS = {
  "서울": {
    city: { x:"126.9783882", y:"37.5666103" },
    districts: {
      "종로구": { x:"126.9770", y:"37.5729" },
      "중구": { x:"126.9977", y:"37.5636" },
      "용산구": { x:"126.9903", y:"37.5324" },
      "성동구": { x:"127.0366", y:"37.5635" },
      "광진구": { x:"127.0827", y:"37.5385" },
      "동대문구": { x:"127.0396", y:"37.5744" },
      "중랑구": { x:"127.0927", y:"37.6063" },
      "성북구": { x:"127.0167", y:"37.5894" },
      "강북구": { x:"127.0256", y:"37.6397" },
      "도봉구": { x:"127.0471", y:"37.6688" },
      "노원구": { x:"127.0568", y:"37.6542" },
      "은평구": { x:"126.9292", y:"37.6028" },
      "서대문구": { x:"126.9368", y:"37.5792" },
      "마포구": { x:"126.9016", y:"37.5663" },
      "양천구": { x:"126.8665", y:"37.5170" },
      "강서구": { x:"126.8496", y:"37.5512" },
      "구로구": { x:"126.8874", y:"37.4955" },
      "금천구": { x:"126.8956", y:"37.4569" },
      "영등포구": { x:"126.8963", y:"37.5264" },
      "동작구": { x:"126.9395", y:"37.5124" },
      "관악구": { x:"126.9515", y:"37.4782" },
      "서초구": { x:"127.0327", y:"37.4836" },
      "강남구": { x:"127.0473", y:"37.5172" },
      "송파구": { x:"127.1059", y:"37.5145" },
      "강동구": { x:"127.1259", y:"37.5301" }
    }
  },
  "부산": { city: { x:"129.0756", y:"35.1796" } },
  "대구": { city: { x:"128.6014", y:"35.8714" } },
  "인천": { city: { x:"126.7052", y:"37.4563" } },
  "광주": { city: { x:"126.8526", y:"35.1595" } },
  "대전": { city: { x:"127.3845", y:"36.3504" } },
  "울산": { city: { x:"129.3114", y:"35.5395" } },
  "세종": { city: { x:"127.2890", y:"36.4801" } },
  "제주": { city: { x:"126.5312", y:"33.4996" } }
};

const $city = document.getElementById("city");
const $district = document.getElementById("district");

function fillCities(){
  $city.innerHTML = "";
  Object.keys(REGIONS).forEach(name=>{
    const opt=document.createElement("option");
    opt.value=name; opt.textContent=name;
    $city.appendChild(opt);
  });
  $city.value="서울";
}
function fillDistricts(){
  const city=$city.value;
  const ds=REGIONS[city]?.districts || null;
  $district.innerHTML="";
  const opt0=document.createElement("option");
  opt0.value=""; opt0.textContent=ds ? "선택(권장)" : "해당없음";
  $district.appendChild(opt0);
  if(ds){
    Object.keys(ds).forEach(d=>{
      const opt=document.createElement("option");
      opt.value=d; opt.textContent=d;
      $district.appendChild(opt);
    });
  }
}
fillCities();
fillDistricts();
$city.addEventListener("change", fillDistricts);

function esc(s){
  return (s==null) ? "" : String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function fmtRank(rank){
  return (rank==null) ? "50위권 밖" : (rank + "위");
}
function fmtDelta(n){
  if(n==null) return "";
  if(n===0) return `<span class="delta flat">-</span>`;
  if(n>0) return `<span class="delta up">▲${Math.abs(n)}</span>`;
  return `<span class="delta down">▼${Math.abs(n)}</span>`;
}
function fmtDeltaNum(n){
  if(n==null) return `<span class="muted">-</span>`;
  if(n===0) return `<span class="delta flat">0</span>`;
  if(n>0) return `<span class="delta up">▲${n}</span>`;
  return `<span class="delta down">▼${Math.abs(n)}</span>`;
}

async function api(path, opts={}){
  const r = await fetch(API_BASE + path, {
    ...opts,
    headers: { "Content-Type":"application/json", ...(opts.headers||{}) }
  });
  const j = await r.json().catch(()=>null);
  if(!r.ok) throw new Error(j?.error || ("HTTP " + r.status));
  return j;
}

let currentTrackId = null;
let currentTargetPlaceId = null;

async function loadTracks(){
  const box=document.getElementById("tracks");
  const empty=document.getElementById("tracksEmpty");
  box.innerHTML="";
  document.getElementById("timelineCard").style.display="none";
  document.getElementById("snapCard").style.display="none";

  const data = await api(`/api/tracks?workspaceId=${encodeURIComponent(workspaceId)}`, { method:"GET", headers:{} });
  const tracks = data.tracks || [];
  empty.style.display = tracks.length ? "none" : "block";

  tracks.forEach(t=>{
    const div=document.createElement("div");
    div.className="item";
    const region = t.region_city + (t.region_district ? (" / " + t.region_district) : "");
    div.innerHTML = `
      <div>
        <div><b>${esc(t.keyword)}</b> <span class="pill">${esc(region)}</span></div>
        <div class="muted">대상 placeId: <span class="mono">${esc(t.target_place_id)}</span></div>
        <div class="muted">좌표 x:${esc(t.x)} y:${esc(t.y)} / ${esc(t.device_type || "pc")}</div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" data-act="timeline">타임라인</button>
        <button class="btn btn-ghost" data-act="collect">수동수집</button>
        <button class="btn btn-danger" data-act="del">삭제</button>
      </div>
    `;

    div.querySelectorAll("button").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const act = btn.getAttribute("data-act");
        if(act==="timeline"){
          currentTrackId = t.id;
          currentTargetPlaceId = t.target_place_id;
          await loadTimeline(t.id);
        }
        if(act==="collect"){
          btn.disabled=true;
          try{
            await api(`/api/collect?workspaceId=${encodeURIComponent(workspaceId)}&trackId=${t.id}`, { method:"POST", body:"{}" });
            currentTrackId = t.id;
            currentTargetPlaceId = t.target_place_id;
            await loadTimeline(t.id);
          }catch(e){
            alert("수집 실패: " + e.message);
          }finally{
            btn.disabled=false;
          }
        }
        if(act==="del"){
          if(!confirm("삭제할까요?")) return;
          await api(`/api/track?workspaceId=${encodeURIComponent(workspaceId)}&id=${t.id}`, { method:"DELETE", headers:{} });
          await loadTracks();
        }
      });
    });

    box.appendChild(div);
  });
}

async function loadTimeline(trackId){
  const data = await api(`/api/timeline?workspaceId=${encodeURIComponent(workspaceId)}&trackId=${trackId}`, { method:"GET", headers:{} });

  const card = document.getElementById("timelineCard");
  const title = document.getElementById("timelineTitle");
  const sub = document.getElementById("timelineSub");
  const box = document.getElementById("timeline");

  card.style.display="block";
  box.innerHTML="";

  title.textContent = `타임라인: ${data.track.keyword}`;
  sub.textContent = `대상 placeId: ${data.track.targetPlaceId} · (Top50 밖이면 50위권 밖)`;

  (data.timeline || []).forEach(row=>{
    const div=document.createElement("div");
    div.className="trow";
    div.innerHTML = `
      <div>
        <div><b>${esc(row.date)}</b></div>
        <div class="muted">전체 ${row.total ?? "-"}개</div>
      </div>
      <div style="text-align:right">
        <div class="rank">${fmtRank(row.targetRank)} ${fmtDelta(row.rankDelta)}</div>
        <div class="muted">${row.status==="NEW" ? "NEW" : (row.status==="OUT" ? "OUT" : "")}</div>
      </div>
    `;
    div.addEventListener("click", ()=>loadSnapshot(trackId, row.date));
    box.appendChild(div);
  });

  // 최신 날짜 자동 로드
  if((data.timeline||[]).length){
    await loadSnapshot(trackId, data.timeline[0].date);
  }else{
    document.getElementById("snapCard").style.display="block";
    document.getElementById("snapTitle").textContent="스냅샷";
    document.getElementById("snapSub").textContent="아직 수집된 데이터가 없습니다. (수동수집을 눌러 첫 데이터를 만들 수 있습니다.)";
    document.getElementById("snapBody").innerHTML="";
  }
}

async function loadSnapshot(trackId, date){
  const data = await api(`/api/snapshot?workspaceId=${encodeURIComponent(workspaceId)}&trackId=${trackId}&date=${encodeURIComponent(date)}`, { method:"GET", headers:{} });

  const card=document.getElementById("snapCard");
  const title=document.getElementById("snapTitle");
  const sub=document.getElementById("snapSub");
  const body=document.getElementById("snapBody");
  const note=document.getElementById("targetNote");

  card.style.display="block";

  if(!data.snapshot){
    title.textContent = `스냅샷: ${date}`;
    sub.textContent = "해당 날짜 데이터가 없습니다.";
    body.innerHTML="";
    note.style.display="none";
    return;
  }

  title.textContent = `스냅샷: ${data.snapshot.base_date}`;
  sub.textContent = `전일 기준: ${data.prevDate || "-"} · 대상 순위: ${fmtRank(data.snapshot.target_rank)}`;

  const targetPlaceId = data.targetPlaceId || currentTargetPlaceId;
  let targetIn=false;

  body.innerHTML="";
  (data.items||[]).forEach(it=>{
    const tr=document.createElement("tr");
    const isT = String(it.place_id) === String(targetPlaceId);
    if(isT){ tr.className="hl"; targetIn=true; }

    tr.innerHTML = `
      <td class="num"><b>${it.rank}</b> ${it.delta ? fmtDelta(it.delta.rankDelta) : ""}</td>
      <td>
        <div><b>${esc(it.name||"-")}</b>${isT ? ' <span class="pill" style="background:#ffe5e5;color:#c0392b;">대상</span>' : ''}</div>
        ${it.microReview ? `<div class="small">"${esc(it.microReview)}"</div>` : ``}
        <div class="muted mono">${esc(it.place_id)}</div>
      </td>
      <td>${esc(it.category||"-")}</td>
      <td class="num">${it.blog_count ?? 0} <span class="small">${it.delta ? fmtDeltaNum(it.delta.blogDelta) : '<span class="muted">-</span>'}</span></td>
      <td class="num">${it.visitor_count ?? 0} <span class="small">${it.delta ? fmtDeltaNum(it.delta.visitorDelta) : '<span class="muted">-</span>'}</span></td>
      <td class="num">${it.save_count ?? 0} <span class="small">${it.delta ? fmtDeltaNum(it.delta.saveDelta) : '<span class="muted">-</span>'}</span></td>
      <td class="num">${it.image_count ?? 0} <span class="small">${it.delta ? fmtDeltaNum(it.delta.imgDelta) : '<span class="muted">-</span>'}</span></td>
      <td class="num">${(it.score ?? "-")}</td>
    `;
    body.appendChild(tr);
  });

  if(!targetIn){
    note.style.display="block";
    note.innerHTML = `대상 업체(placeId <span class="mono">${esc(targetPlaceId)}</span>)는 이 날짜에 <b>Top50에 없습니다</b>. (정책상 50위권 밖 데이터는 수집/표시하지 않음)`;
  }else{
    note.style.display="none";
  }
}

/** 추가 + 즉시 수집 */
document.getElementById("btnAdd").addEventListener("click", async ()=>{
  const kw = document.getElementById("keyword").value.trim();
  const pid = document.getElementById("placeId").value.trim();
  const regionCity = $city.value;
  const regionDistrict = $district.value || null;
  const deviceType = document.getElementById("deviceType").value;
  const status = document.getElementById("addStatus");

  if(!kw) return alert("키워드를 입력하세요.");
  if(!pid) return alert("플레이스 ID를 입력하세요.");

  // 좌표 결정: 서울+구 선택이면 구청, 아니면 도시 좌표
  let xy = null;
  if(regionCity==="서울" && regionDistrict && REGIONS["서울"].districts[regionDistrict]){
    xy = REGIONS["서울"].districts[regionDistrict];
  }else{
    xy = REGIONS[regionCity]?.city;
  }
  if(!xy) return alert("지역 좌표를 찾을 수 없습니다.");

  const btn = document.getElementById("btnAdd");
  btn.disabled = true;
  status.textContent = "트랙 등록 중...";

  try{
    // 1) 트랙 등록
    const r = await api("/api/track", {
      method:"POST",
      body: JSON.stringify({
        workspaceId,
        keyword: kw,
        targetPlaceId: pid,
        regionCity,
        regionDistrict,
        x: xy.x,
        y: xy.y,
        deviceType
      })
    });

    // 2) 즉시 1회 실시간 수집(요구사항)
    status.textContent = "등록 완료. 실시간 수집 중...";
    await api(`/api/collect?workspaceId=${encodeURIComponent(workspaceId)}&trackId=${r.id}`, {
      method:"POST",
      body:"{}"
    });

    status.textContent = "완료: 오늘 스냅샷이 저장되었습니다.";
    document.getElementById("keyword").value = "";
    document.getElementById("placeId").value = "";

    // 3) 목록/타임라인 갱신
    await loadTracks();
    currentTrackId = r.id;
    currentTargetPlaceId = pid;
    await loadTimeline(r.id);

  }catch(e){
    status.textContent = "실패: " + e.message;
    alert("추가/수집 실패: " + e.message);
  }finally{
    btn.disabled = false;
  }
});

document.getElementById("btnReload").addEventListener("click", loadTracks);

loadTracks().catch(e => alert(e.message));
</script>
</body>
</html>
