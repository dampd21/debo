<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네이버 플레이스 추적</title>
<style>
:root {
  --primary: #03c75a;
  --primary-dark: #02a04a;
  --bg: #f5f7fa;
  --card: #ffffff;
  --text: #333;
  --text-light: #888;
  --border: #e0e0e0;
  --danger: #e74c3c;
  --success: #27ae60;
  --warning: #f39c12;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--bg); color:var(--text); }

.hamburger-menu { position: relative; }
.hamburger-btn {
  background: none; border: none; font-size: 28px; cursor: pointer;
  color: #fff; padding: 4px 8px; line-height: 1;
}
.hamburger-dropdown {
  display: none; position: absolute; top: 44px; right: 0;
  background: #fff; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,.15);
  min-width: 200px; z-index: 999; overflow: hidden;
}
.hamburger-dropdown.active { display: block; }
.hamburger-dropdown a {
  display: block; padding: 14px 20px; text-decoration: none;
  color: var(--text); font-size: 15px; border-bottom: 1px solid #f0f0f0;
  transition: background .2s;
}
.hamburger-dropdown a:last-child { border-bottom: none; }
.hamburger-dropdown a:hover { background: #f0faf4; }
.hamburger-dropdown a.current { color: var(--primary); font-weight: 700; }

header {
  background: var(--primary); color: #fff; padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
header h1 { font-size: 18px; font-weight: 700; }

.container { max-width: 800px; margin: 0 auto; padding: 20px; }

.card {
  background: var(--card); border-radius: 12px; padding: 24px;
  box-shadow: 0 2px 12px rgba(0,0,0,.06); margin-bottom: 20px;
}

.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-light); margin-bottom: 6px; }
.form-group select,
.form-group input {
  width: 100%; padding: 12px 14px; border: 1px solid var(--border);
  border-radius: 8px; font-size: 15px; outline: none; transition: border .2s;
}
.form-group select:focus,
.form-group input:focus { border-color: var(--primary); }

.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }

.btn {
  display: inline-block; padding: 14px 24px; background: var(--primary);
  color: #fff; border: none; border-radius: 8px; font-size: 15px;
  font-weight: 600; cursor: pointer; width: 100%; text-align: center;
  transition: background .2s;
}
.btn:hover { background: var(--primary-dark); }
.btn:disabled { background: #ccc; cursor: not-allowed; }
.btn-danger { background: var(--danger); }
.btn-danger:hover { background: #c0392b; }
.btn-sm { padding: 8px 14px; font-size: 13px; width: auto; }

/* 트랙 카드 */
.track-card {
  border: 1px solid var(--border); border-radius: 10px; padding: 16px;
  margin-bottom: 16px; position: relative;
}
.track-card .track-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 12px;
}
.track-card .track-keyword { font-size: 16px; font-weight: 700; }
.track-card .track-meta { font-size: 12px; color: var(--text-light); margin-top: 4px; }
.track-card .track-delete { font-size: 12px; color: var(--danger); cursor: pointer; border: none; background: none; }

/* 미니 타임라인 */
.mini-timeline {
  display: flex; gap: 4px; overflow-x: auto; padding: 4px 0;
  scrollbar-width: thin;
}
.mini-timeline::-webkit-scrollbar { height: 4px; }
.mini-timeline::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.tl-day {
  min-width: 52px; padding: 6px 4px; border-radius: 6px;
  text-align: center; cursor: pointer; transition: background .2s;
  border: 1px solid var(--border); font-size: 11px; flex-shrink: 0;
}
.tl-day:hover { background: #f0faf4; }
.tl-day.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.tl-day .tl-date { font-weight: 600; }
.tl-day .tl-rank { font-size: 14px; font-weight: 700; margin-top: 2px; }
.tl-day .tl-rank.found { color: var(--primary); }
.tl-day .tl-rank.notfound { color: var(--danger); font-size: 11px; }
.tl-day.active .tl-rank.found { color: #fff; }
.tl-day .tl-delta { font-size: 10px; }
.tl-day .tl-delta.up { color: var(--success); }
.tl-day .tl-delta.down { color: var(--danger); }
.tl-day.active .tl-delta { color: rgba(255,255,255,.8); }

/* 스냅샷 테이블 */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #f8f9fa; padding: 10px 8px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border); white-space: nowrap; }
td { padding: 10px 8px; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
tr:hover { background: #fafafa; }
tr.highlight { background: #e8f8ee !important; font-weight: 700; }

.delta-up { color: var(--success); font-weight: 700; }
.delta-down { color: var(--danger); font-weight: 700; }
.delta-same { color: var(--text-light); }
.delta-new { color: var(--warning); font-size: 11px; }

.loading { text-align: center; padding: 40px; color: var(--text-light); }
.loading::after { content: ''; display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin-left: 8px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

.msg { padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; text-align: center; }
.msg-success { background: #e8f8ee; color: var(--success); }
.msg-error { background: #fdf0ef; color: var(--danger); }

@media (max-width: 600px) {
  .form-row { flex-direction: column; gap: 0; }
  header h1 { font-size: 16px; }
}
</style>
</head>
<body>

<!-- ★ Worker B 도메인을 여기서 변경 ★ -->
<script>
  const API_BASE = 'https://ranktracker.YOUR.workers.dev'.replace(/\/+$/, '');
</script>

  <div class="hamburger-menu">
    <button class="hamburger-btn" onclick="toggleMenu()">☰</button>
    <div class="hamburger-dropdown" id="navMenu">
      <a href="index.html">📊 실시간 순위 조회</a>
      <a href="tracker.html" class="current">📈 플레이스 추적</a>
    </div>
  </div>
</header>

<div class="container">

  <!-- 추가 폼 -->
  <div class="card">
    <h3 style="margin-bottom:16px; font-size:15px;">➕ 새 추적 등록</h3>
    <div class="form-group">
      <label>업종</label>
      <select id="kind">
        <option value="restaurant">🍽️ 식당/카페</option>
        <option value="hairshop">💇 미용실(헤어샵)</option>
        <option value="nailshop">💅 네일</option>
        <option value="hospital">🏥 병원</option>
        <option value="accommodation">🏨 펜션/숙박</option>
      </select>
    </div>
    <div class="form-group">
      <label>키워드</label>
      <input type="text" id="keyword" placeholder="예: 강남역 맛집">
    </div>
    <div class="form-group">
      <label>Place ID (대상 업체)</label>
      <input type="text" id="placeId" placeholder="플레이스 ID">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>시/도</label>
        <select id="regionCity" onchange="onCityChange()">
          <option value="">선택 안 함</option>
        </select>
      </div>
      <div class="form-group">
        <label>구/군</label>
        <select id="regionDistrict" onchange="onDistrictChange()">
          <option value="">선택 안 함</option>
        </select>
      </div>
    </div>
    <div id="msgArea"></div>
    <button class="btn" id="addBtn" onclick="addTrack()">➕ 추가 + 즉시 수집</button>
  </div>

  <!-- 트랙 목록 -->
  <div class="card">
    <h3 style="margin-bottom:16px; font-size:15px;">📋 내 추적 목록</h3>
    <div id="trackList"></div>
  </div>

  <!-- 스냅샷 상세 -->
  <div id="snapshotDetail"></div>
</div>

function initRegions() {
  const cityEl = document.getElementById('regionCity');
  Object.keys(REGIONS).forEach(city => {
    const opt = document.createElement('option');
    opt.value = city;
    opt.textContent = city;
    cityEl.appendChild(opt);
  });
}

function onCityChange() {
  const city = document.getElementById('regionCity').value;
  const distEl = document.getElementById('regionDistrict');
  distEl.innerHTML = '<option value="">선택 안 함</option>';
  if (city && REGIONS[city] && REGIONS[city].districts) {
    Object.keys(REGIONS[city].districts).forEach(d => {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      distEl.appendChild(opt);
    });
  }
}

function onDistrictChange() {}

function getSelectedCoords() {
  const city = document.getElementById('regionCity').value;
  const dist = document.getElementById('regionDistrict').value;
  if (!city) return { x: '', y: '' };
  if (dist && REGIONS[city] && REGIONS[city].districts && REGIONS[city].districts[dist]) {
    return REGIONS[city].districts[dist];
  }
  return { x: REGIONS[city].x, y: REGIONS[city].y };
}

// ── Workspace ID ──
function getWorkspaceId() {
  let wid = localStorage.getItem('workspaceId');
  if (!wid) {
    wid = 'ws_' + Math.random().toString(36).substr(2, 12);
    localStorage.setItem('workspaceId', wid);
  }
  return wid;
}

// ── 메뉴 ──
function toggleMenu() {
  document.getElementById('navMenu').classList.toggle('active');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.hamburger-menu')) {
    document.getElementById('navMenu').classList.remove('active');
  }
});

// ── 메시지 ──
function showMsg(text, type) {
  document.getElementById('msgArea').innerHTML = `<div class="msg msg-${type}">${text}</div>`;
  setTimeout(() => { document.getElementById('msgArea').innerHTML = ''; }, 5000);
}

// ── 트랙 추가 ──
async function addTrack() {
  const kind = document.getElementById('kind').value;
  const keyword = document.getElementById('keyword').value.trim();
  const placeId = document.getElementById('placeId').value.trim();
  const regionCity = document.getElementById('regionCity').value;
  const regionDistrict = document.getElementById('regionDistrict').value;
  const coords = getSelectedCoords();

  if (!keyword || !placeId) {
    alert('키워드와 Place ID를 입력하세요.');
    return;
  }

  const btn = document.getElementById('addBtn');
  btn.disabled = true;
  btn.textContent = '등록 중...';

  try {
    // 1) 트랙 등록
    const resp = await fetch(`${API_BASE}/api/track`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        workspaceId: getWorkspaceId(),
        kind,
        keyword,
        targetPlaceId: placeId,
        regionCity,
        regionDistrict,
        x: coords.x,
        y: coords.y,
        deviceType: 'pcmap'
      })
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);

    showMsg('✅ 트랙 등록 완료! 즉시 수집 중...', 'success');

    // 2) 즉시 수집
    btn.textContent = '수집 중...';
    const cResp = await fetch(`${API_BASE}/api/collect?workspaceId=${encodeURIComponent(getWorkspaceId())}&trackId=${data.trackId}`, {
      method: 'POST'
    });
    const cData = await cResp.json();
    if (cData.error) {
      showMsg('⚠️ 등록됨, 수집 오류: ' + cData.error, 'error');
    } else {
      const rankMsg = cData.targetRank > 0 ? `순위: ${cData.targetRank}위` : '순위권 밖';
      showMsg(`✅ 수집 완료! ${rankMsg}`, 'success');
    }

    loadTracks();
  } catch (e) {
    showMsg('❌ ' + e.message, 'error');
  }

  btn.disabled = false;
  btn.textContent = '➕ 추가 + 즉시 수집';
}

// ── 트랙 목록 로드 ──
async function loadTracks() {
  const listEl = document.getElementById('trackList');
  listEl.innerHTML = '<div class="loading">트랙 로딩 중</div>';

  try {
    const resp = await fetch(`${API_BASE}/api/tracks?workspaceId=${encodeURIComponent(getWorkspaceId())}`);
    const data = await resp.json();
    if (data.error) throw new Error(data.error);

    if (!data.tracks || data.tracks.length === 0) {
      listEl.innerHTML = '<div style="text-align:center;color:var(--text-light);padding:20px;">등록된 추적이 없습니다</div>';
      return;
    }

    listEl.innerHTML = '';
    for (const track of data.tracks) {
      const card = document.createElement('div');
      card.className = 'track-card';
      card.id = `track-${track.id}`;

      const kindLabel = { restaurant:'🍽️식당/카페', hairshop:'💇미용실', nailshop:'💅네일', hospital:'🏥병원', accommodation:'🏨숙박' }[track.kind] || track.kind;
      const regionStr = [track.region_city, track.region_district].filter(Boolean).join(' ');

      card.innerHTML = `
        <div class="track-header">
          <div>
            <div class="track-keyword">${escHtml(track.keyword)}</div>
            <div class="track-meta">
              ${kindLabel} · Place ID: ${escHtml(track.target_place_id)}
              ${regionStr ? ' · ' + escHtml(regionStr) : ''}
            </div>
          </div>
          <button class="track-delete" onclick="deleteTrack(${track.id})">🗑 삭제</button>
        </div>
        <div class="mini-timeline" id="timeline-${track.id}">
          <div class="loading" style="padding:8px;font-size:12px;">타임라인 로딩...</div>
        </div>
      `;
      listEl.appendChild(card);

      // 타임라인 로드
      loadTimeline(track);
    }
  } catch (e) {
    listEl.innerHTML = `<div class="msg msg-error">❌ ${e.message}</div>`;
  }
}

// ── 타임라인 로드 ──
async function loadTimeline(track) {
  const el = document.getElementById(`timeline-${track.id}`);
  try {
    const resp = await fetch(`${API_BASE}/api/timeline?workspaceId=${encodeURIComponent(getWorkspaceId())}&trackId=${track.id}&limit=14`);
    const data = await resp.json();
    if (data.error) throw new Error(data.error);

    if (!data.timeline || data.timeline.length === 0) {
      el.innerHTML = '<div style="font-size:12px;color:var(--text-light);padding:8px;">데이터 없음</div>';
      return;
    }

    // 날짜 역순 → 오래된 순으로 표시
    const days = data.timeline.slice().reverse();
    el.innerHTML = days.map(d => {
      const dateShort = d.baseDate.slice(5); // MM-DD
      const rankText = d.targetRank > 0 ? d.targetRank + '위' : '-';
      const rankClass = d.targetRank > 0 ? 'found' : 'notfound';
      let deltaHtml = '';
      if (d.rankDelta !== null && d.rankDelta !== undefined) {
        if (d.rankDelta > 0) deltaHtml = `<div class="tl-delta up">▲${d.rankDelta}</div>`;
        else if (d.rankDelta < 0) deltaHtml = `<div class="tl-delta down">▼${Math.abs(d.rankDelta)}</div>`;
        else deltaHtml = `<div class="tl-delta">-</div>`;
      }
      return `<div class="tl-day" onclick="showSnapshot(${track.id},'${d.baseDate}',this)">
        <div class="tl-date">${dateShort}</div>
        <div class="tl-rank ${rankClass}">${rankText}</div>
        ${deltaHtml}
      </div>`;
    }).join('');
  } catch (e) {
    el.innerHTML = `<div style="font-size:12px;color:var(--danger);">${e.message}</div>`;
  }
}

// ── 스냅샷 상세 ──
async function showSnapshot(trackId, date, dayEl) {
  // active 표시
  document.querySelectorAll('.tl-day').forEach(d => d.classList.remove('active'));
  if (dayEl) dayEl.classList.add('active');

  const detailEl = document.getElementById('snapshotDetail');
  detailEl.innerHTML = '<div class="card"><div class="loading">상세 로딩 중</div></div>';

  try {
    const resp = await fetch(`${API_BASE}/api/snapshot?workspaceId=${encodeURIComponent(getWorkspaceId())}&trackId=${trackId}&date=${date}`);
    const data = await resp.json();
    if (data.error) throw new Error(data.error);

    let html = `<div class="card">
      <h3 style="margin-bottom:12px; font-size:15px;">📅 ${data.baseDate} 상세 (Top 50)</h3>`;

    if (data.targetRank > 0) {
      html += `<div style="margin-bottom:12px; padding:12px; background:#e8f8ee; border-radius:8px; text-align:center; font-size:16px;">
        🎯 대상 업체 순위: <strong style="color:var(--primary); font-size:22px;">${data.targetRank}위</strong>
        <span style="font-size:13px; color:var(--text-light);"> / ${data.total}개</span>
      </div>`;
    } else {
      html += `<div style="margin-bottom:12px; padding:12px; background:#fdf0ef; border-radius:8px; text-align:center; color:var(--danger);">
        😔 Top 50에 없음 (전체 ${data.total}개)
      </div>`;
    }

    html += `<div class="table-wrap"><table>
      <thead><tr>
        <th>#</th><th>변동</th><th>업체명</th><th>카테고리</th><th>블로그</th><th>방문자</th><th>저장</th><th>별점</th>
      </tr></thead><tbody>`;

    // 현재 트랙의 placeId를 가져오기
    const tracks = JSON.parse(localStorage.getItem('cachedTracks') || '[]');
    const currentTrack = tracks.find(t => t.id == trackId);
    const targetPlaceId = currentTrack ? currentTrack.target_place_id : '';

    data.items.forEach(item => {
      const isTarget = String(item.placeId) === String(targetPlaceId);
      let deltaHtml = '';
      if (item.rankDelta !== null && item.rankDelta !== undefined) {
        if (item.rankDelta > 0) deltaHtml = `<span class="delta-up">▲${item.rankDelta}</span>`;
        else if (item.rankDelta < 0) deltaHtml = `<span class="delta-down">▼${Math.abs(item.rankDelta)}</span>`;
        else deltaHtml = `<span class="delta-same">─</span>`;
      } else {
        deltaHtml = `<span class="delta-new">NEW</span>`;
      }

      html += `<tr class="${isTarget ? 'highlight' : ''}">
        <td>${item.rank}</td>
        <td>${deltaHtml}</td>
        <td>${escHtml(item.name)}${isTarget ? ' ⭐' : ''}</td>
        <td>${escHtml(item.category || '')}</td>
        <td>${item.blogCount||0}</td>
        <td>${item.visitorCount||0}</td>
        <td>${item.saveCount||0}</td>
        <td>${item.score||'-'}</td>
      </tr>`;
    });

    html += `</tbody></table></div></div>`;
    detailEl.innerHTML = html;

    // 스크롤
    detailEl.scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch (e) {
    detailEl.innerHTML = `<div class="card"><div class="msg msg-error">❌ ${e.message}</div></div>`;
  }
}

// ── 트랙 삭제 ──
async function deleteTrack(id) {
  if (!confirm('이 추적을 삭제하시겠습니까?')) return;
  try {
    const resp = await fetch(`${API_BASE}/api/track?workspaceId=${encodeURIComponent(getWorkspaceId())}&id=${id}`, {
      method: 'DELETE'
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    loadTracks();
  } catch (e) {
    alert('삭제 오류: ' + e.message);
  }
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── 초기화 ──
initRegions();

// URL 파라미터 자동 채우기
(function() {
  const p = new URLSearchParams(location.search);
  if (p.get('kind')) document.getElementById('kind').value = p.get('kind');
  if (p.get('keyword')) document.getElementById('keyword').value = p.get('keyword');
  if (p.get('placeId')) document.getElementById('placeId').value = p.get('placeId');
})();

// 트랙 로드 + 캐시
(async function() {
  await loadTracks();
  // 트랙 캐시 (스냅샷에서 targetPlaceId 비교용)
  try {
    const resp = await fetch(`${API_BASE}/api/tracks?workspaceId=${encodeURIComponent(getWorkspaceId())}`);
    const data = await resp.json();
    if (data.tracks) localStorage.setItem('cachedTracks', JSON.stringify(data.tracks));
  } catch(e) {}
})();
</script>
