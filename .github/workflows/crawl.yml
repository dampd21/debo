name: Naver Place Crawler

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # 매일 자정에 자동 실행
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Crawler
      run: python naver_place_crawler.py

    - name: Upload Report
      uses: actions/upload-artifact@v4
      with:
        name: naver-place-report
        path: report.html
